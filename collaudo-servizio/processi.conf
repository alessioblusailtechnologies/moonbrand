# Processi del collaudo tenuti su dal servizio MoonbrandCollaudo. Dopo una modifica: Restart-Service MoonbrandCollaudo
# Formato:  env NOME=valore   oppure   nome | cartella | comando
# Il servizio gira come LocalSystem: i processi ricevono il profilo di Administrator, così il worker trova il login di
# Claude (~/.claude) e npm la sua cache.

env USERPROFILE=C:\Users\Administrator
env HOME=C:\Users\Administrator
env APPDATA=C:\Users\Administrator\AppData\Roaming
env LOCALAPPDATA=C:\Users\Administrator\AppData\Local
env TEMP=C:\Users\Administrator\AppData\Local\Temp
env TMP=C:\Users\Administrator\AppData\Local\Temp
env PATH=C:\Users\Administrator\AppData\Roaming\npm;%PATH%
env REPO=C:\Users\Administrator\Desktop\GIT\BLUSAIL\moonbrand

# API di sviluppo su 3012 (lo studio la raggiunge dal proxy, non serve aprirla fuori)
api    | %REPO%\moonbrand-be\moonbrand-api    | npm run dev
# Studio raggiungibile da fuori: https://45.14.185.228:4200
studio | %REPO%\moonbrand-studio              | npx ng serve --host 0.0.0.0 --ssl
# Worker del motore: per provarne un altro si cambia la cartella (es. moonbrand-ai-ae) e si riavvia il servizio
worker | %REPO%\moonbrand-be\moonbrand-ai-v3  | npm run worker
