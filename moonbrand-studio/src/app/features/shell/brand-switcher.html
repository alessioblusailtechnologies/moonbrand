@let active = brands.activeBrand();
<button class="trigger" type="button" aria-haspopup="menu" [attr.aria-expanded]="open()" (click)="open.set(!open())">
  @if (active) {
    <mb-brand-avatar [name]="active.name" [logo]="active.logoUri" [color]="active.color" [size]="32" />
    <span class="trigger-text">
      <span class="strong-sm">{{ active.name }}</span>
      <span class="caption">{{ kindLabel(active.kind) }}</span>
    </span>
  }
  <mb-icon name="chevron-down" [size]="16" class="chevron" [class.up]="open()" />
</button>

@if (open()) {
  <div class="menu" role="menu">
    <p class="label menu-label">I tuoi brand</p>
    <div class="list">
      @for (brand of brands.brands(); track brand.id) {
        <button class="item" type="button" role="menuitemradio" [attr.aria-checked]="brand.id === active?.id"
          (click)="choose(brand.id)">
          <mb-brand-avatar [name]="brand.name" [logo]="brand.logoUri" [color]="brand.color" [size]="28" />
          <span class="grow">
            <span class="strong-sm name">{{ brand.name }}</span>
            <span class="caption">{{ kindLabel(brand.kind) }}</span>
          </span>
          @if (brand.id === active?.id) {
            <mb-icon name="check" [size]="16" class="check" />
          }
        </button>
      }
    </div>
    <div class="divider"></div>
    <button class="item action" type="button" role="menuitem" (click)="createBrand()">
      <span class="plus"><mb-icon name="plus" [size]="16" /></span>
      <span class="strong-sm">Nuovo brand</span>
    </button>
    <div class="divider"></div>
    <div class="account">
      <span class="grow">
        <span class="strong-sm name">{{ auth.account()?.name || 'Il tuo account' }}</span>
        <span class="caption name">{{ auth.account()?.email }}</span>
      </span>
      <button class="icon-btn" type="button" title="Esci" aria-label="Esci" (click)="signOut()">
        <mb-icon name="log-out" [size]="16" />
      </button>
    </div>
  </div>
}
