<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&family=Hanken+Grotesk:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3B2A14; --secondario: #FFFFCD; --accento: #FEC832; --sfondo: #FFFFCD; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'Quicksand', sans-serif; }
  :root { --burro: oklch(from var(--secondario) max(l, 0.95) min(c, 0.09) h); --su-accento: oklch(from var(--accento) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 30%; display: block; }

  .titolo { position: absolute; left: 34px; top: 150px; font-family: var(--font-titoli); font-weight: 800; color: var(--burro); font-size: 176px; letter-spacing: -0.055em; line-height: 0.92; white-space: nowrap;
    text-shadow: 0 4px 26px rgba(0,0,0,0.28); }
  .titolo span { display: block; }

  .scheda { position: absolute; left: 432px; top: 1000px; width: 560px; padding: 40px 44px 44px; border-radius: 34px; transform: rotate(1.6deg);
    background: color-mix(in srgb, var(--burro) 94%, transparent); color: var(--principale); }
  .voce { display: flex; align-items: center; gap: 22px; font-size: 31px; font-weight: 500; line-height: 1.15; letter-spacing: -0.005em; }
  .voce + .voce { margin-top: 15px; }
  .cerchio { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--principale) 70%, transparent); }
  .fatta .cerchio { border: none; background: var(--accento); display: flex; align-items: center; justify-content: center; }
  .fatta .cerchio svg { width: 20px; height: 20px; color: var(--su-accento); }

  .scintilla { position: absolute; left: 118px; top: 950px; width: 140px; height: 150px; color: var(--burro); filter: drop-shadow(0 2px 5px rgba(0,0,0,0.25)); }
</style>
</head>
<body>
  <!-- foto: una persona seduta fuori da un bar o in vetrina, in posa, il viso nel terzo alto; spazio libero in basso a destra -->
  <img class="foto" src="../esempio/dehors.jpg" alt="">

  <!-- titolo: due righe a sinistra, 1-2 parole ciascuna, al massimo 11 caratteri per riga -->
  <h1 class="titolo"><span>il metodo</span><span>in 5 mosse</span></h1>

  <svg class="scintilla" viewBox="0 0 140 150" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <path d="M82 30 C84 62 92 70 118 72 C92 74 84 82 82 116 C80 82 72 74 46 72 C72 70 80 62 82 30 Z"/>
    <path d="M22 72 L36 82"/><path d="M36 64 L22 92"/><circle cx="18" cy="26" r="6"/><circle cx="76" cy="140" r="5"/><path d="M118 8 L110 26"/>
  </svg>

  <div class="scheda">
    <!-- voci: cinque cose da fare, 3-5 parole ciascuna; una sola fatta (classe fatta) -->
    <p class="voce"><span class="cerchio"></span>rispondere ai messaggi</p>
    <p class="voce"><span class="cerchio"></span>piano dei post di maggio</p>
    <p class="voce"><span class="cerchio"></span>foto del nuovo menu</p>
    <p class="voce fatta"><span class="cerchio"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 L8.5 15 L16 6"/></svg></span>chiamata col cliente</p>
    <p class="voce"><span class="cerchio"></span>report del mese</p>
  </div>
</body>
</html>
