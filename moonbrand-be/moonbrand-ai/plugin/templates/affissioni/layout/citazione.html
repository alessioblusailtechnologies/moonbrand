<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Archivo:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1C1C1A; --secondario: #D1CEA9; --accento: #C0322B; --sfondo: #ECEBE7; }
  :root { --font-titoli: 'Playfair Display', serif; --font-testo: 'Archivo', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: color-mix(in srgb, var(--principale) 70%, black); color: var(--principale); font-family: var(--font-testo); }

  /* il foglio sta sotto la busta di plastica: la foto della plastica su nero ci va sopra in schiarire */
  .foglio { position: absolute; left: 232px; top: 262px; width: 618px; height: 828px; background: color-mix(in srgb, var(--sfondo) 88%, black);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 40px rgba(0,0,0,0.5); }
  .plastica { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; mix-blend-mode: screen; opacity: 0.85; }

  .citazione { position: absolute; left: 0; top: 330px; width: 618px; text-align: center; font-family: var(--font-titoli); font-style: italic; font-weight: 500;
    font-size: 46px; line-height: 1.3; letter-spacing: -0.01em; }
  .logo { position: absolute; left: 0; top: 728px; width: 618px; text-align: center; font-family: var(--font-testo); font-size: 15px; font-weight: 700; line-height: 1.25; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="foglio">
    <!-- citazione: tre righe centrate, la seconda tra parentesi; 10-14 parole in tutto -->
    <p class="citazione">Il tuo marchio<br>(lascia il segno)<br>quando ha uno scopo</p>
    <!-- logo: l'account o il nome del brand, piccolo in fondo al foglio -->
    <p class="logo">@studio<br>faro</p>
  </div>
  <!-- plastica: la busta trasparente stropicciata su fondo nero, resta -->
  <img class="plastica" src="../esempio/plastica.jpg" alt="">
</body>
</html>
