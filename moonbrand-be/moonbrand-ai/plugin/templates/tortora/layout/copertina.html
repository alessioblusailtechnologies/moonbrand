<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #161414; --secondario: #E9E9EB; --accento: #F4C542; --sfondo: #F3EED0; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'IBM Plex Mono', monospace; }
  :root { --crema: oklch(from var(--sfondo) max(l, 0.94) min(c, 0.05) h); --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--crema); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 40%; display: block; filter: saturate(0.78) brightness(0.9); }

  .titolo { position: absolute; right: 92px; top: 150px; width: 900px; text-align: right; font-family: var(--font-titoli); font-weight: 700; font-size: 168px; line-height: 0.84; letter-spacing: -0.065em; }
  .titolo span { display: block; white-space: nowrap; }
  .sotto { position: absolute; right: 96px; top: 470px; text-align: right; font-size: 44px; line-height: 1.12; text-transform: uppercase; letter-spacing: 0.01em; }

  .stella { position: absolute; width: 74px; height: 74px; }
  .s1 { left: 196px; top: 176px; transform: rotate(-10deg); }
  .s2 { right: 70px; top: 622px; width: 64px; height: 64px; transform: rotate(14deg); }

  .fumetto { position: absolute; left: 92px; top: 1000px; padding: 16px 34px 18px; border-radius: 40px; background: var(--secondario); color: var(--su-secondario);
    font-family: 'Hanken Grotesk', sans-serif; font-size: 34px; letter-spacing: -0.01em; box-shadow: 0 6px 16px rgba(0,0,0,0.18); isolation: isolate; }
  .fumetto::before { content: ''; position: absolute; left: 16px; bottom: -6px; width: 30px; height: 26px; background: var(--secondario); border-bottom-right-radius: 26px 22px; transform: rotate(8deg); z-index: -1; }
</style>
</head>
<body>
  <!-- foto: una persona in esterno, in piedi, a figura intera o a tre quarti, luce naturale; la parte alta libera per il titolo -->
  <img class="foto" src="../esempio/porta.jpg" alt="">

  <svg class="stella s1" viewBox="0 0 100 100"><defs><radialGradient id="g1" cx="38%" cy="32%" r="70%"><stop offset="0" style="stop-color: color-mix(in srgb, var(--accento) 35%, white)"/><stop offset="0.5" style="stop-color: var(--accento)"/><stop offset="1" style="stop-color: color-mix(in srgb, var(--accento) 72%, black)"/></radialGradient></defs>
    <path d="M50 6 L62 37 L95 38 L69 58 L79 91 L50 72 L21 91 L31 58 L5 38 L38 37 Z" fill="url(#g1)" stroke="url(#g1)" stroke-width="8" stroke-linejoin="round"/></svg>
  <svg class="stella s2" viewBox="0 0 100 100"><path d="M50 6 L62 37 L95 38 L69 58 L79 91 L50 72 L21 91 L31 58 L5 38 L38 37 Z" fill="url(#g1)" stroke="url(#g1)" stroke-width="8" stroke-linejoin="round"/></svg>

  <!-- titolo: due righe corte, la seconda è la parola che conta; 2 + 2 parole al massimo, 10 lettere per riga -->
  <h1 class="titolo"><span>ecco la</span><span>verità</span></h1>
  <!-- sotto: di cosa si parla, in maiuscolo, due righe di 2-3 parole -->
  <p class="sotto">sul crescere<br>su instagram</p>

  <!-- fumetto: una nota breve, 2-3 parole (un anno, un tempo, un dettaglio) -->
  <p class="fumetto">nel 2026</p>
</body>
</html>
