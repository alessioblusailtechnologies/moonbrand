<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5,500&family=IBM+Plex+Mono:wght@400&family=Italianno&family=Hanken+Grotesk:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #161414; --secondario: #E9E9EB; --accento: #F4C542; --sfondo: #F3EED0; }
  :root { --font-titoli: 'Noto Serif Display', serif; --font-testo: 'IBM Plex Mono', monospace; }
  :root { --crema: oklch(from var(--sfondo) max(l, 0.94) min(c, 0.05) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--crema); font-family: var(--font-testo); }

  .foto { position: absolute; object-fit: cover; display: block; filter: saturate(0.65) brightness(0.86) contrast(1.02) sepia(0.12); }
  .f1 { left: 0; top: 0; width: 540px; height: 675px; object-position: 50% 30%; }
  .f2 { left: 540px; top: 0; width: 540px; height: 675px; object-position: 50% 50%; }
  .f3 { left: 0; top: 675px; width: 1080px; height: 675px; object-position: 50% 60%; filter: saturate(0.6) brightness(0.7) contrast(1.02) sepia(0.12); }

  .titolo { position: absolute; right: 70px; top: 510px; font-family: var(--font-titoli); font-stretch: 62.5%; font-weight: 500; font-size: 150px; line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
  .corsivo { position: absolute; left: 190px; top: 640px; font-family: 'Italianno', cursive; font-size: 230px; line-height: 1; white-space: nowrap; }
  .luogo { position: absolute; left: 790px; top: 708px; display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 14px;
    background: color-mix(in srgb, var(--secondario) 50%, transparent); color: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; font-size: 40px; letter-spacing: 0.01em; text-transform: uppercase; }
  .luogo svg { width: 28px; height: 36px; }
</style>
</head>
<body>
  <!-- foto 1-3: tre momenti del lavoro (uno scatto col telefono, la scrivania, lo schermo), stessi toni caldi e smorzati -->
  <img class="foto f1" src="../esempio/tavola.jpg" alt="">
  <img class="foto f2" src="../esempio/candele.jpg" alt="">
  <img class="foto f3" src="../esempio/scrivania.jpg" alt="">

  <!-- titolo: una parola, al massimo 9 lettere -->
  <h1 class="titolo">contenuti</h1>
  <!-- corsivo: la parola che completa, scritta a mano, al massimo 9 lettere -->
  <p class="corsivo">in arrivo</p>
  <!-- luogo: un posto o un giorno, una parola -->
  <p class="luogo"><svg viewBox="0 0 22 28" fill="currentColor"><path d="M11 0 C4.9 0 0 4.9 0 11 C0 19 11 28 11 28 C11 28 22 19 22 11 C22 4.9 17.1 0 11 0 Z M11 15 A4 4 0 1 1 11 7 A4 4 0 1 1 11 15 Z"/></svg>studio</p>
</body>
</html>
