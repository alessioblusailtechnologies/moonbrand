<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #161414; --secondario: #E9E9EB; --accento: #F4C542; --sfondo: #F3EED0; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'IBM Plex Mono', monospace; }
  :root { --crema: oklch(from var(--sfondo) max(l, 0.94) min(c, 0.05) h); --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--crema); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 30% 50%; display: block; filter: saturate(0.6) brightness(0.72) contrast(1.05) sepia(0.12); }

  .perline { position: absolute; left: 70px; top: 120px; width: 940px; height: 300px; }
  .perlina { position: absolute; width: 132px; height: 132px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--secondario) 30%, white) 0%, var(--secondario) 62%, color-mix(in srgb, var(--secondario) 82%, black) 100%);
    color: var(--su-secondario); font-family: var(--font-titoli); font-weight: 800; font-size: 74px; line-height: 1; box-shadow: 0 6px 14px rgba(0,0,0,0.25); }
  .perlina:nth-child(1) { left: 0;     top: 168px; transform: rotate(-14deg); }
  .perlina:nth-child(2) { left: 124px; top: 136px; transform: rotate(-16deg); }
  .perlina:nth-child(3) { left: 248px; top: 104px; transform: rotate(-17deg); }
  .perlina:nth-child(4) { left: 372px; top: 76px;  transform: rotate(-18deg); }
  .perlina:nth-child(5) { left: 496px; top: 50px;  transform: rotate(-16deg); }
  .perlina:nth-child(6) { left: 620px; top: 30px;  transform: rotate(-12deg); }
  .perlina:nth-child(7) { left: 744px; top: 16px;  transform: rotate(-8deg); }

  .testo { position: absolute; left: 120px; top: 470px; width: 560px; font-family: var(--font-titoli); font-weight: 500; font-size: 82px; line-height: 0.92; letter-spacing: -0.055em; transform: rotate(-4deg); transform-origin: 0 0; }
  .fumetto { position: absolute; left: 230px; top: 860px; padding: 16px 34px 18px; border-radius: 40px; background: var(--secondario); color: var(--su-secondario); isolation: isolate;
    font-family: 'Hanken Grotesk', sans-serif; font-size: 36px; letter-spacing: -0.01em; transform: rotate(-6deg); box-shadow: 0 6px 16px rgba(0,0,0,0.18); }
  .fumetto::before { content: ''; position: absolute; left: 16px; bottom: -6px; width: 30px; height: 26px; background: var(--secondario); border-bottom-right-radius: 26px 22px; transform: rotate(8deg); z-index: -1; }

  .stella { position: absolute; left: 900px; top: 64px; width: 70px; height: 70px; transform: rotate(10deg); }
  .scintilla { position: absolute; left: 92px; top: 380px; width: 84px; height: 84px; transform: rotate(-10deg); }
  .cursore { position: absolute; left: 892px; top: 150px; width: 62px; height: 80px; }
</style>
</head>
<body>
  <!-- foto: una persona con il portatile o il telefono, su un lato; dall'altro lato un muro o un fondo calmo per il testo -->
  <img class="foto" src="../esempio/portatile.jpg" alt="">

  <svg class="stella" viewBox="0 0 100 100"><defs><radialGradient id="g1" cx="38%" cy="32%" r="70%"><stop offset="0" style="stop-color: color-mix(in srgb, var(--accento) 35%, white)"/><stop offset="0.5" style="stop-color: var(--accento)"/><stop offset="1" style="stop-color: color-mix(in srgb, var(--accento) 72%, black)"/></radialGradient></defs>
    <path d="M50 6 L62 37 L95 38 L69 58 L79 91 L50 72 L21 91 L31 58 L5 38 L38 37 Z" fill="url(#g1)" stroke="url(#g1)" stroke-width="8" stroke-linejoin="round"/></svg>

  <!-- perline: una parola di 5-7 lettere, una lettera per pallina (togliere le palline che avanzano) -->
  <div class="perline"><span class="perlina">S</span><span class="perlina">E</span><span class="perlina">G</span><span class="perlina">R</span><span class="perlina">E</span><span class="perlina">T</span><span class="perlina">O</span></div>
  <svg class="cursore" viewBox="0 0 62 80"><path d="M4 4 L4 64 L19 50 L30 75 L41 70 L30 46 L52 46 Z" fill="#FFFFFF" stroke="#111111" stroke-width="4" stroke-linejoin="round"/></svg>
  <svg class="scintilla" viewBox="0 0 100 100"><path d="M50 2 C53 36 64 47 98 50 C64 53 53 64 50 98 C47 64 36 53 2 50 C36 47 47 36 50 2 Z" style="fill: var(--secondario)" opacity="0.92"/></svg>

  <!-- testo: cosa svela il segreto, 6-9 parole su tre-quattro righe -->
  <p class="testo">per farti notare su instagram (2026)</p>
  <!-- fumetto: un invito di 2-3 parole -->
  <p class="fumetto">leggi qui!</p>
</body>
</html>
