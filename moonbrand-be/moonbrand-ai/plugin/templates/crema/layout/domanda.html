<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;800&family=Corinthia&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2B2723; --secondario: #E8E6E3; --accento: #F5C02C; --sfondo: #F1EBCF; }
  :root { --font-titoli: 'Host Grotesk', sans-serif; --font-testo: 'Host Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --bordo-stella: color-mix(in srgb, var(--accento) 72%, black); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 55%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 24%, transparent); }

  .titolo { position: absolute; left: 108px; top: 150px; width: 900px; font-family: var(--font-titoli); font-weight: 800; font-size: 140px; line-height: 0.94; letter-spacing: -0.055em; }
  .titolo span { display: block; white-space: nowrap; }
  .titolo span + span { padding-left: 28px; }
  .a-mano { position: absolute; left: 330px; top: 700px; width: 640px; font-family: 'Corinthia', cursive; font-size: 232px; line-height: 0.72; transform: rotate(-6deg); }
  .a-mano span { display: block; white-space: nowrap; }
  .a-mano span + span { padding-left: 130px; }

  .ricciolo { position: absolute; left: 150px; top: 590px; width: 250px; height: 300px; overflow: visible; }
  .ricciolo path { fill: none; stroke: var(--chiaro); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

  .stella { position: absolute; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.22)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 3; stroke-linejoin: round; }
</style>
</head>
<body>
  <!-- foto: una persona al bar o alla scrivania col viso coperto (tazza, cappello, telefono), il portatile in basso a destra -->
  <img class="foto" src="../esempio/cappello.jpg" alt="">
  <div class="velo"></div>

  <!-- titolo: la domanda in due righe minuscole, al massimo 11 lettere per riga -->
  <h1 class="titolo"><span>i contenuti</span><span>senza volto</span></h1>
  <!-- a-mano: la fine della domanda scritta a mano, due righe corte (7 e 8 lettere al massimo), col punto di domanda -->
  <p class="a-mano"><span>Valgono</span><span>la pena?</span></p>

  <!-- ricciolo: la freccia a mano che porta alla scritta -->
  <svg class="ricciolo" viewBox="0 0 250 300"><path d="M40 6 C-4 60 4 150 70 168 C120 182 128 120 92 112 C52 104 40 170 70 214 C100 258 160 266 214 262"/><path d="M190 240 L216 262 L188 282"/></svg>

  <svg class="stella" style="left: 52px; top: 132px; width: 76px; height: 76px; transform: rotate(-14deg);" viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z"/></svg>
  <svg class="stella" style="left: 866px; top: 362px; width: 92px; height: 92px; transform: rotate(10deg);" viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z"/></svg>
</body>
</html>
