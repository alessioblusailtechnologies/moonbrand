<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2B2723; --secondario: #E8E6E3; --accento: #F5C02C; --sfondo: #F1EBCF; }
  :root { --font-titoli: 'Host Grotesk', sans-serif; --font-testo: 'Host Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --bordo-stella: color-mix(in srgb, var(--accento) 72%, black); --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 40%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 26%, transparent); }

  /* Le perline: una lettera per perlina, su un arco che sale verso destra. */
  .perline { position: absolute; left: 0; top: 0; width: 1080px; height: 600px; }
  .perlina { position: absolute; width: 136px; height: 136px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--secondario); color: var(--su-secondario); font-family: var(--font-titoli); font-weight: 800; font-size: 74px; line-height: 1; text-transform: uppercase;
    box-shadow: inset -8px -10px 18px color-mix(in srgb, var(--principale) 16%, transparent), inset 6px 8px 12px rgba(255,255,255,0.5), 0 8px 16px rgba(0,0,0,0.28); }

  .titolo { position: absolute; left: 116px; top: 560px; width: 620px; font-family: var(--font-titoli); font-weight: 700; font-size: 100px; line-height: 0.86; letter-spacing: -0.06em; }

  .fumetto { position: absolute; left: 230px; top: 930px; max-width: 520px; padding: 16px 36px 18px; border-radius: 44px; background: var(--secondario); color: var(--su-secondario); font-family: var(--font-testo); font-size: 40px; font-weight: 400; line-height: 1.15; letter-spacing: -0.01em; transform: rotate(-6deg); }
  .fumetto::after { content: ''; position: absolute; left: 22px; bottom: -16px; width: 30px; height: 26px; background: var(--secondario); clip-path: polygon(0 100%, 40% 0, 100% 0, 60% 30%); }

  .cursore { position: absolute; left: 948px; top: 196px; width: 64px; height: 80px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3)); }
  .cursore path { fill: #FFFFFF; stroke: #111111; stroke-width: 4; stroke-linejoin: miter; }

  .stella { position: absolute; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.22)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 3; stroke-linejoin: round; }
  .scintilla { position: absolute; display: block; }
  .scintilla path { fill: var(--secondario); }
</style>
</head>
<body>
  <!-- foto: una persona in piedi davanti a un muro o una porta, selfie col telefono o di spalle; il lato sinistro tranquillo -->
  <img class="foto" src="../esempio/porta.jpg" alt="">
  <div class="velo"></div>

  <!-- perline: una parola di 5-7 lettere, una lettera per perlina (togliere o aggiungere perline seguendo l'arco) -->
  <div class="perline">
    <span class="perlina" style="left: 84px; top: 388px; transform: rotate(-14deg);">S</span>
    <span class="perlina" style="left: 210px; top: 330px; transform: rotate(-12deg);">E</span>
    <span class="perlina" style="left: 336px; top: 280px; transform: rotate(-9deg);">G</span>
    <span class="perlina" style="left: 462px; top: 238px; transform: rotate(-6deg);">R</span>
    <span class="perlina" style="left: 588px; top: 204px; transform: rotate(-3deg);">E</span>
    <span class="perlina" style="left: 714px; top: 180px; transform: rotate(0deg);">T</span>
    <span class="perlina" style="left: 840px; top: 166px; transform: rotate(3deg);">O</span>
  </div>

  <!-- titolo: il seguito della parola, 4-6 parole minuscole su tre righe, con l'anno o un numero tra parentesi -->
  <h1 class="titolo">per farsi notare su instagram (2026)</h1>
  <!-- fumetto: 2-3 parole, l'invito a leggere -->
  <p class="fumetto">leggi qui!</p>

  <svg class="cursore" viewBox="0 0 64 80"><path d="M4 4 L4 64 L18 50 L28 74 L38 70 L28 46 L48 46 Z"/></svg>
  <svg class="stella" style="left: 930px; top: 120px; width: 72px; height: 72px; transform: rotate(12deg);" viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z"/></svg>
  <svg class="scintilla" style="left: 52px; top: 504px; width: 84px; height: 84px; transform: rotate(-10deg);" viewBox="0 0 100 100"><path d="M50 0 C53 30 62 44 100 50 C62 56 53 70 50 100 C47 70 38 56 0 50 C38 44 47 30 50 0 Z"/></svg>
</body>
</html>
