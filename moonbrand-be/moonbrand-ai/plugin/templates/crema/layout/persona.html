<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2B2723; --secondario: #E8E6E3; --accento: #F5C02C; --sfondo: #F1EBCF; }
  :root { --font-titoli: 'Host Grotesk', sans-serif; --font-testo: 'Host Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --bordo-stella: color-mix(in srgb, var(--accento) 72%, black); --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 30%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 20%, transparent); }

  .sopra, .sotto { position: absolute; font-family: var(--font-titoli); font-weight: 800; line-height: 0.9; letter-spacing: -0.055em; white-space: nowrap; }
  .sopra { left: 104px; top: 318px; font-size: 230px; }
  .sotto { right: 84px; top: 960px; font-size: 186px; text-align: right; }

  .fumetto { position: absolute; left: 110px; top: 232px; max-width: 560px; padding: 14px 34px 16px; border-radius: 44px; background: var(--secondario); color: var(--su-secondario); font-family: var(--font-testo); font-size: 38px; font-weight: 400; line-height: 1.15; letter-spacing: -0.01em; transform: rotate(-2deg); }
  .fumetto::after { content: ''; position: absolute; left: 22px; bottom: -16px; width: 30px; height: 26px; background: var(--secondario); clip-path: polygon(0 100%, 40% 0, 100% 0, 60% 30%); }

  .freccia { position: absolute; left: 150px; top: 640px; width: 190px; height: 170px; overflow: visible; }
  .freccia path { fill: none; stroke: var(--chiaro); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

  .cursore { position: absolute; left: 780px; top: 470px; width: 64px; height: 80px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3)); }
  .cursore path { fill: #FFFFFF; stroke: #111111; stroke-width: 4; stroke-linejoin: miter; }

  .stella { position: absolute; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.22)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 3; stroke-linejoin: round; }
  .stella.chiara path { fill: var(--secondario); stroke: color-mix(in srgb, var(--secondario) 70%, black); }
</style>
</head>
<body>
  <!-- foto: un ritratto spontaneo per strada, la persona al centro a mezza figura; il titolo si divide sopra e sotto di lei -->
  <img class="foto" src="../esempio/occhiali.jpg" alt="">
  <div class="velo"></div>

  <!-- fumetto: l'attacco del titolo, 2-4 parole minuscole -->
  <p class="fumetto">come costruire il tuo</p>
  <!-- sopra: la prima parola del titolo, al massimo 6 lettere, con l'iniziale maiuscola -->
  <h1 class="sopra">Brand</h1>
  <!-- sotto: la seconda parola, in basso a destra, al massimo 9 lettere -->
  <p class="sotto">personale</p>

  <svg class="freccia" viewBox="0 0 190 170"><path d="M14 4 C0 70 40 130 170 148"/><path d="M146 130 L172 148 L144 162"/></svg>
  <svg class="cursore" viewBox="0 0 64 80"><path d="M4 4 L4 64 L18 50 L28 74 L38 70 L28 46 L48 46 Z"/></svg>
  <svg class="stella" style="left: 744px; top: 268px; width: 86px; height: 86px; transform: rotate(12deg);" viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z"/></svg>
  <svg class="stella chiara" style="left: 196px; top: 1120px; width: 80px; height: 80px; transform: rotate(-16deg);" viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z"/></svg>
</body>
</html>
