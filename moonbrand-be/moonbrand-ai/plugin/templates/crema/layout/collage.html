<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:wght@400;500&family=Host+Grotesk:wght@400;500&family=Corinthia&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2B2723; --secondario: #E8E6E3; --accento: #F5C02C; --sfondo: #F1EBCF; }
  :root { --font-titoli: 'Libre Caslon Condensed', serif; --font-testo: 'Host Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; object-fit: cover; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 18%, transparent); }

  .titolo { position: absolute; right: 70px; top: 530px; text-align: right; font-family: var(--font-titoli); font-weight: 500; font-size: 160px; line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
  .a-mano { position: absolute; left: 170px; top: 640px; font-family: 'Corinthia', cursive; font-size: 214px; line-height: 1; white-space: nowrap; transform: rotate(-5deg); }

  .luogo { position: absolute; left: 720px; top: 720px; display: flex; align-items: center; gap: 12px; padding: 10px 26px 10px 20px; border-radius: 12px;
    background: color-mix(in srgb, var(--secondario) 55%, transparent); color: #FFFFFF; font-family: var(--font-testo); font-size: 36px; font-weight: 500; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.01em; }
  .luogo svg { width: 30px; height: 38px; flex: none; }
  .luogo path { fill: #FFFFFF; }
</style>
</head>
<body>
  <!-- foto 1-3: tre momenti della settimana di lavoro (telefono che fotografa, scrivania, portatile); toni caldi e simili tra loro -->
  <img class="foto" src="../esempio/piatto.jpg" alt="" style="left: 0; top: 0; width: 540px; height: 676px; object-position: 50% 50%;">
  <img class="foto" src="../esempio/scrivania.jpg" alt="" style="left: 540px; top: 0; width: 540px; height: 676px; object-position: 30% 50%;">
  <img class="foto" src="../esempio/candela.jpg" alt="" style="left: 0; top: 676px; width: 1080px; height: 674px; object-position: 50% 45%;">
  <div class="velo"></div>

  <!-- titolo: una parola minuscola, al massimo 9 lettere, a cavallo della riga tra le foto -->
  <h1 class="titolo">contenuti</h1>
  <!-- a-mano: il seguito scritto a mano, al massimo 11 lettere -->
  <p class="a-mano">in scaletta</p>
  <!-- luogo: dove, una parola in maiuscolo nell'etichetta col segnaposto -->
  <p class="luogo"><svg viewBox="0 0 30 38"><path d="M15 0 C6.7 0 0 6.6 0 14.8 C0 25.5 15 38 15 38 C15 38 30 25.5 30 14.8 C30 6.6 23.3 0 15 0 Z M15 20.5 A5.8 5.8 0 1 1 15 8.9 A5.8 5.8 0 1 1 15 20.5 Z"/></svg>studio</p>
</body>
</html>
