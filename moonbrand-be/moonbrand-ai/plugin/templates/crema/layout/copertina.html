<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;800&family=Lekton&family=Corinthia&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2B2723; --secondario: #E8E6E3; --accento: #F5C02C; --sfondo: #F1EBCF; }
  :root { --font-titoli: 'Host Grotesk', sans-serif; --font-testo: 'Host Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --bordo-stella: color-mix(in srgb, var(--accento) 72%, black); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 0%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 22%, transparent); }

  .graffe { position: absolute; left: 0; top: 112px; width: 1080px; text-align: center; font-family: 'Lekton', monospace; font-size: 44px; line-height: 1; white-space: nowrap; }
  .titolo { position: absolute; left: 0; top: 166px; width: 1080px; text-align: center; font-family: var(--font-titoli); font-weight: 800; font-size: 214px; line-height: 0.9; letter-spacing: -0.055em; white-space: nowrap; }
  .a-mano { position: absolute; left: 0; top: 300px; width: 1080px; text-align: center; font-family: 'Corinthia', cursive; font-size: 262px; line-height: 1; white-space: nowrap; transform: rotate(-3deg); }

  .stella { position: absolute; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.22)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 3; stroke-linejoin: round; }
</style>
</head>
<body>
  <!-- foto: una persona intera in uno studio o una casa luminosa, selfie allo specchio o posa spontanea; spazio libero in alto per il titolo -->
  <img class="foto" src="../esempio/finestra.jpg" alt="">
  <div class="velo"></div>

  <!-- graffe: 2-3 parole tra graffe, minuscole, sopra il titolo -->
  <p class="graffe">{ ruba il mio }</p>
  <!-- titolo: una parola, al massimo 7 lettere, minuscola -->
  <h1 class="titolo">piano</h1>
  <!-- a-mano: la parola che completa il titolo, scritta a mano, al massimo 11 lettere; si sovrappone al titolo -->
  <p class="a-mano">editoriale</p>

  <svg class="stella" style="left: 842px; top: 92px; width: 92px; height: 92px; transform: rotate(12deg);" viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z"/></svg>
  <svg class="stella" style="left: 120px; top: 500px; width: 84px; height: 84px; transform: rotate(-10deg);" viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z"/></svg>
</body>
</html>
