<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Albert+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #11120D; --secondario: #8FABC2; --accento: #E0F2FC; --sfondo: #DEF0FA; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'Albert Sans', sans-serif; }
  :root { --su-accento: oklch(from var(--accento) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: #FFFFFF; color: var(--principale); font-family: var(--font-testo); }

  .nome { position: absolute; left: 74px; top: 190px; width: 900px; font-family: var(--font-titoli); font-size: 150px; font-weight: 400; line-height: 1.0; letter-spacing: -0.05em; }
  .ruolo-breve { position: absolute; left: 78px; top: 540px; width: 700px; font-size: 40px; font-weight: 400; letter-spacing: -0.03em; line-height: 1.2; }
  .freccia { position: absolute; left: 836px; top: 502px; width: 140px; height: 140px; border-radius: 50%; background: var(--principale); display: grid; place-items: center; }
  .freccia svg { width: 46px; height: 46px; }
  .foto { position: absolute; left: 46px; top: 702px; width: 968px; height: 594px; border-radius: 38px; object-fit: cover; object-position: 50% 30%; display: block; }
  .ruolo { position: absolute; left: 68px; top: 656px; height: 96px; padding: 0 66px; border-radius: 48px; display: flex; align-items: center;
    background: var(--accento); color: var(--su-accento); font-size: 42px; font-weight: 400; letter-spacing: -0.03em; }
</style>
</head>
<body>
  <!-- nome: nome e cognome su due righe -->
  <h1 class="nome">Chiara<br>Bertoli</h1>
  <!-- ruolo-breve: cosa fa, in 3-6 parole, col punto -->
  <p class="ruolo-breve">Dà forma a ogni campagna.</p>
  <div class="freccia"><svg viewBox="0 0 46 46" fill="none" stroke="var(--accento)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M36 36 L11 11 M11 11 L11 31 M11 11 L31 11"/></svg></div>

  <!-- foto: la persona al lavoro, inquadrata a mezzo busto, sfondo d'ufficio chiaro -->
  <img class="foto" src="../esempio/ritratto.jpg" alt="">
  <!-- ruolo: il titolo, 1-3 parole -->
  <div class="ruolo">Direttrice creativa</div>
</body>
</html>
