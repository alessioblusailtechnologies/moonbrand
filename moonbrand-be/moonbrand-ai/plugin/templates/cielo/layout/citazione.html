<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Albert+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #11120D; --secondario: #8FABC2; --accento: #E0F2FC; --sfondo: #DEF0FA; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'Albert Sans', sans-serif; }
  :root { --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 84px; top: 70px; width: 922px; height: 200px; border-radius: 40px; object-fit: cover; object-position: 50% 30%; display: block; }
  .scheda { position: absolute; left: 74px; top: 290px; width: 940px; height: 712px; border-radius: 52px; background: #F7F7F7; }
  .virgolette { position: absolute; width: 46px; height: 40px; color: var(--principale); }
  .virgolette.apre { left: 94px; top: 76px; }
  .virgolette.chiude { right: 94px; bottom: 70px; }
  .testo { position: absolute; left: 80px; top: 170px; width: 780px; height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: var(--font-titoli); font-size: 50px; font-weight: 400; line-height: 1.3; letter-spacing: -0.035em; }
  .chi { position: absolute; left: 86px; width: 928px; height: 110px; border-radius: 55px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 400; letter-spacing: -0.03em; }
  .chi.nome { top: 1022px; border: 2px solid var(--accento); color: #FFFFFF; }
  .chi.ruolo { top: 1152px; background: var(--secondario); color: var(--su-secondario); }
</style>
</head>
<body>
  <!-- foto: una striscia bassa, un gesto di lavoro (mani, stretta, scrivania) -->
  <img class="foto" src="../esempio/stretta.jpg" alt="">
  <div class="scheda">
    <svg class="virgolette apre" viewBox="0 0 46 40" fill="currentColor"><path d="M0 40 V24 C0 10 6 2 18 0 L20 6 C12 9 9 14 9 20 H19 V40 Z M26 40 V24 C26 10 32 2 44 0 L46 6 C38 9 35 14 35 20 H45 V40 Z"/></svg>
    <!-- testo: la frase, 26-36 parole -->
    <p class="testo">Le aziende che lasciano il segno non nascono in una notte. Crescono con scelte fatte apposta e con una squadra che migliora qualcosa di importante ogni giorno.</p>
    <svg class="virgolette chiude" viewBox="0 0 46 40" fill="currentColor"><path d="M46 0 V16 C46 30 40 38 28 40 L26 34 C34 31 37 26 37 20 H27 V0 Z M20 0 V16 C20 30 14 38 2 40 L0 34 C8 31 11 26 11 20 H1 V0 Z"/></svg>
  </div>
  <!-- nome: chi parla -->
  <div class="chi nome">Davide Ricci</div>
  <!-- ruolo: il suo ruolo, 1-3 parole -->
  <div class="chi ruolo">Fondatore</div>
</body>
</html>
