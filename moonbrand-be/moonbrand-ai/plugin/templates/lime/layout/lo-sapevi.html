<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0A0A0A; --secondario: #DBFFB8; --accento: #66BE10; --sfondo: #DCDCDC; }
  :root { --font-titoli: 'Poppins', sans-serif; --font-testo: 'Poppins', sans-serif; }
  :root { --accento-scuro: color-mix(in srgb, var(--accento) 62%, black); --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: #FFFFFF; font-family: var(--font-testo); }

  .fumetto { position: absolute; font-family: var(--font-titoli); font-weight: 700; text-transform: uppercase; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  .verde { left: 150px; top: 282px; padding: 56px 58px 60px; font-size: 104px; color: #FFFFFF; border-radius: 26px;
    background: linear-gradient(180deg, var(--accento), var(--accento-scuro)); z-index: 2; box-shadow: 0 16px 30px rgba(0,0,0,0.35); }
  .verde::after { content: ''; position: absolute; right: 0; bottom: -44px; width: 70px; height: 46px; background: var(--accento-scuro);
    clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .bianco { left: 486px; top: 468px; min-width: 460px; text-align: center; padding: 60px 64px 58px; font-size: 104px; color: var(--su-secondario); background: var(--secondario); border-radius: 26px; z-index: 1; }
  .bianco::after { content: ''; position: absolute; left: 0; bottom: -50px; width: 70px; height: 52px; background: var(--secondario);
    clip-path: polygon(0 0, 100% 0, 0 100%); }
  .raggi { position: absolute; color: var(--secondario); left: 880px; top: 676px; width: 112px; height: 96px; }

  .citazione { position: absolute; left: 190px; top: 846px; width: 700px; text-align: center; font-size: 47px; font-weight: 400; line-height: 1.5; letter-spacing: -0.02em; }
  .citazione b { color: var(--accento); font-weight: 800; letter-spacing: -0.035em; }
  .virgolette { font-family: var(--font-titoli); color: var(--secondario); font-weight: 800; font-size: 72px; line-height: 0; position: relative; top: 0.56em; letter-spacing: -0.06em; }
  .virgolette.apre { margin-right: 14px; top: 0.3em; }
  .virgolette.chiude { margin-left: 14px; }
</style>
</head>
<body>
  <!-- domanda: due fumetti; nel verde 1-2 parole (LO SAPEVI), nel bianco una parola con il punto di domanda -->
  <p class="fumetto verde">Lo sapevi</p>
  <p class="fumetto bianco">che?</p>
  <svg class="raggi" viewBox="0 0 112 96" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <path d="M20 66 L12 92"/><path d="M38 60 L33 14"/><path d="M52 64 L80 26"/><path d="M60 74 L104 52"/><path d="M62 88 L96 86"/>
  </svg>

  <!-- citazione: il dato o il fatto, 22-32 parole, la parte che conta in verde con <b> -->
  <p class="citazione"><span class="virgolette apre">“</span>Le attività che rispondono alle recensioni ricevono <b>fino al 35% di contatti in più</b> rispetto a chi resta in silenzio.<span class="virgolette chiude">”</span></p>
</body>
</html>
