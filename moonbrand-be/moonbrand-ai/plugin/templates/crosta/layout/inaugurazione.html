<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1C1915; --secondario: #BAA68E; --accento: #522D1A; --sfondo: #F4F1E8; }
  :root { --font-titoli: 'Gilda Display', serif; --font-testo: 'PT Serif', serif; }
  /* testo chiaro sulle foto: la tinta dello sfondo schiarita; testo sul secondario: chiaro se il secondario è medio o scuro */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --su-secondario: oklch(from var(--secondario) clamp(0.16, (0.8 - l) * 1000, 0.97) min(c, 0.03) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }
  .titolo { font-family: var(--font-titoli); font-weight: 400; letter-spacing: -0.01em; }
  .corsivo { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400; }
  .foto { position: absolute; display: block; object-fit: cover; }
  .foto { left: 0; top: 0; width: 1080px; height: 1350px; object-position: 50% 50%; filter: brightness(0.9); }
  .invito { position: absolute; left: 0; top: 150px; width: 1080px; text-align: center; font-size: 76px; line-height: 1.08; color: var(--chiaro); }
  .invito .corsivo { font-size: 80px; }
  .logo { position: absolute; left: 0; top: 500px; width: 1080px; text-align: center; font-size: 230px; line-height: 1; color: var(--chiaro); }
  .indirizzo { position: absolute; left: 70px; top: 1140px; font-size: 38px; line-height: 1.15; color: var(--chiaro); }
  .orari { position: absolute; right: 70px; top: 1140px; text-align: right; font-size: 38px; line-height: 1.15; color: var(--chiaro); }
  .orari .corsivo { font-size: 40px; }
</style>
</head>
<body>
  <!-- foto: un pane intero visto dall'alto su un telo, che riempie il centro -->
  <img class="foto" src="../esempio/pagnotta.jpg" alt="">

  <!-- invito: 6-8 parole su due righe, la seconda in corsivo -->
  <p class="invito titolo">Siete invitati alla<br><span class="corsivo">grande apertura</span> di</p>

  <!-- logo: il nome del forno con il punto, o il file del logo -->
  <h1 class="logo titolo" data-adatta="960">Sfornato.</h1>

  <!-- indirizzo: via e città su due righe -->
  <p class="indirizzo titolo">Via dei Mille 12<br>Bologna</p>
  <!-- orari: «orari di apertura:» in corsivo e una riga di orari -->
  <p class="orari titolo"><span class="corsivo">orari di apertura:</span><br>tutti i giorni 7:00 - 20:00</p>
  <script>
    // Con un font del brand più largo i titoli su una riga si rimpiccioliscono finché stanno nella misura scritta in data-adatta.
    const adatta = () => document.querySelectorAll('[data-adatta]').forEach((el) => {
      el.style.fontSize = '';
      const max = Number(el.dataset.adatta);
      const larghezza = () => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (larghezza() > max && size > 40) { size -= 2; el.style.fontSize = `${size}px`; }
    });
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
