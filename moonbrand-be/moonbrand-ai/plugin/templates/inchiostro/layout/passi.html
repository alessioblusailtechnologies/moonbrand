<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Archivo:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0B0B0B; --secondario: #2F2F2F; --accento: #8C8C8C; --sfondo: #F4F4F2; }
  :root { --font-titoli: 'Playfair Display', serif; --font-testo: 'Archivo', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 0; top: 120px; width: 1080px; text-align: center; font-weight: 400; }
  .titolo .riga { display: block; font-family: var(--font-testo); font-size: 70px; font-weight: 300; line-height: 1.04; text-transform: uppercase; letter-spacing: -0.02em; white-space: nowrap; }
  .titolo em { font-family: var(--font-titoli); font-style: italic; font-size: 84px; text-transform: none; letter-spacing: -0.01em; }

  .linea { position: absolute; left: 539px; top: 400px; width: 2px; height: 820px; background: var(--accento); }
  .punto { position: absolute; left: 514px; width: 52px; height: 52px; border-radius: 50%; background: var(--secondario); }
  .punto::after { content: ''; position: absolute; top: 25px; width: 46px; height: 2px; background: var(--secondario); }
  .punto.s::after { right: 50px; }
  .punto.d::after { left: 50px; }
  .passo { position: absolute; width: 360px; text-align: center; }
  .passo.s { left: 110px; }
  .passo.d { left: 610px; }
  .passo h2 { font-size: 40px; font-weight: 400; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.1; }
  .passo p { margin-top: 6px; font-size: 25px; line-height: 1.3; }
</style>
</head>
<body>
  <!-- titolo: due righe in maiuscolo; nella prima 1 parola + 2 parole in corsivo (em), la seconda al massimo 18 caratteri -->
  <h1 class="titolo"><span class="riga">Come <em>si scrive</em></span><span class="riga">un piano social</span></h1>

  <div class="linea"></div>
  <!-- passi: cinque, alternati a sinistra e a destra; titolo «Passo N» e 7-10 parole -->
  <div class="punto s" style="top: 420px"></div>
  <div class="passo s" style="top: 386px"><h2>Passo 1</h2><p>Scegli tre temi che solo tu puoi raccontare.</p></div>
  <div class="punto d" style="top: 580px"></div>
  <div class="passo d" style="top: 546px"><h2>Passo 2</h2><p>Decidi i giorni di uscita e tienili fermi.</p></div>
  <div class="punto s" style="top: 740px"></div>
  <div class="passo s" style="top: 706px"><h2>Passo 3</h2><p>Prepara le foto una settimana prima.</p></div>
  <div class="punto d" style="top: 900px"></div>
  <div class="passo d" style="top: 866px"><h2>Passo 4</h2><p>Scrivi le didascalie come parli in negozio.</p></div>
  <div class="punto s" style="top: 1060px"></div>
  <div class="passo s" style="top: 1026px"><h2>Passo 5</h2><p>A fine mese guarda cosa ha portato richieste.</p></div>
</body>
</html>
