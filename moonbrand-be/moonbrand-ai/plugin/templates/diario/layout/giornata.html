<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5,300&family=Open+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2A2724; --secondario: #F682A6; --accento: #FCAC30; --sfondo: #F2EDCE; }
  /* Noto Serif Display stretto è molto più stretto dei font dei brand: qui è ingrandito, così le misure sotto valgono per i font del brand, più larghi. */
  @font-face { font-family: 'Noto Stretta'; src: url(https://fonts.gstatic.com/s/notoserifdisplay/v29/buErppa9f8_vkXaZLAgP0G5Wi6QmA1Qwda5M.woff2) format('woff2'); font-style: normal; font-weight: 100 900; font-stretch: 62.5% 100%; size-adjust: 150%; }
  :root { --font-titoli: 'Noto Stretta', 'Noto Serif Display', serif; --font-testo: 'Open Sans', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 50%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 30%, transparent); }

  .logo { position: absolute; left: 0; top: 82px; width: 1080px; text-align: center; font-family: var(--font-testo); font-size: 26px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.02em; }
  .titolo { position: absolute; left: 60px; top: 360px; width: 960px; text-align: center; font-family: var(--font-titoli); font-stretch: 62.5%; font-size: 128px; font-weight: 300; line-height: 184px; letter-spacing: -0.02em; text-transform: uppercase; }
  .sotto { position: absolute; left: 200px; top: 1040px; width: 680px; text-align: center; font-family: var(--font-testo); font-size: 34px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em; }
  .stella { position: absolute; width: 72px; height: 72px; }
  .stella.a { color: var(--secondario); }
  /* la terza stella è il secondario girato verso il blu, come nel modello (rosa, blu, giallo) */
  .stella.b { color: oklch(from var(--secondario) l c calc(h - 80)); }
  .stella.c { color: var(--accento); }
</style>
</head>
<body>
  <!-- foto: un tavolo dall'alto con oggetti veri del giorno (tazza, fiori, libro, tessuti), luce morbida -->
  <img class="foto" src="../esempio/tulipani.jpg" alt="">
  <div class="velo"></div>

  <!-- logo: il nome del brand in piccolo in alto al centro -->
  <p class="logo">Studio Vela</p>

  <!-- titolo: tre righe in maiuscolo, 3-4 parole in tutto, al massimo 9 lettere per riga -->
  <h1 class="titolo">Un giorno<br>da<br>ricordare</h1>

  <!-- sotto: una frase in due righe, 10-14 parole -->
  <p class="sotto">Piccoli momenti, pensieri lenti e la bellezza delle cose di ogni giorno.</p>

  <!-- stelle: tre stelline colorate sparse intorno al titolo -->
  <svg class="stella a" style="left: 40px; top: 560px; transform: rotate(-14deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 2.6l2.7 6 6.5.6-4.9 4.3 1.5 6.4L12 16.6 6.2 19.9l1.5-6.4L2.8 9.2l6.5-.6z"/></svg>
  <svg class="stella b" style="left: 900px; top: 660px; transform: rotate(12deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 2.6l2.7 6 6.5.6-4.9 4.3 1.5 6.4L12 16.6 6.2 19.9l1.5-6.4L2.8 9.2l6.5-.6z"/></svg>
  <svg class="stella c" style="left: 504px; top: 1150px; transform: rotate(-6deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 2.6l2.7 6 6.5.6-4.9 4.3 1.5 6.4L12 16.6 6.2 19.9l1.5-6.4L2.8 9.2l6.5-.6z"/></svg>
</body>
</html>
