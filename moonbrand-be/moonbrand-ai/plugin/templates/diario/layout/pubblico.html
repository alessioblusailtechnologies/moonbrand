<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5,400;1,62.5,400&family=Montserrat:wght@700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2A2724; --secondario: #F682A6; --accento: #FCAC30; --sfondo: #F2EDCE; }
  /* Noto Serif Display stretto è molto più stretto dei font dei brand: qui è ingrandito, così le misure sotto valgono per i font del brand, più larghi. */
  @font-face { font-family: 'Noto Stretta'; src: url(https://fonts.gstatic.com/s/notoserifdisplay/v29/buErppa9f8_vkXaZLAgP0G5Wi6QmA1Qwda5M.woff2) format('woff2'); font-style: normal; font-weight: 100 900; font-stretch: 62.5% 100%; size-adjust: 150%; }
  @font-face { font-family: 'Noto Stretta'; src: url(https://fonts.gstatic.com/s/notoserifdisplay/v29/buEPppa9f8_vkXaZLAgP0G5Wi6QmA1QwcLRCOrN8uo7t6FBJipTQit-N33sQOk-VoTBJUjYVgg.woff2) format('woff2'); font-style: italic; font-weight: 100 900; font-stretch: 62.5% 100%; size-adjust: 150%; }
  :root { --font-titoli: 'Noto Stretta', 'Noto Serif Display', serif; --font-testo: 'Montserrat', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 40%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 24%, transparent); }

  .graffe { position: absolute; left: 0; top: 372px; width: 1080px; text-align: center; font-family: 'DotGothic16', monospace; font-size: 48px; letter-spacing: 0.04em; }
  .titolo { position: absolute; left: 90px; top: 448px; width: 900px; text-align: center; font-family: var(--font-titoli); font-stretch: 62.5%; font-size: 100px; font-weight: 400; line-height: 135px; letter-spacing: -0.045em; }
  .titolo i { font-style: italic; }
  .sotto { position: absolute; left: 0; top: 930px; width: 1080px; text-align: center; font-family: var(--font-testo); font-size: 34px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; }
  .stella { position: absolute; width: 68px; height: 68px; color: var(--accento); }
</style>
</head>
<body>
  <!-- foto: un dettaglio di persona da vicino (braccio, camicia, una mano con un oggetto) contro un muro o un fondo materico -->
  <img class="foto" src="../esempio/righe.jpg" alt="">
  <div class="velo"></div>

  <!-- graffe: la riga a pixel tra graffe sopra il titolo, 2-3 parole -->
  <p class="graffe">{Non sprecarlo}</p>

  <!-- titolo: 3 righe centrate, 4-6 parole; una o due parole in corsivo con <i> -->
  <h1 class="titolo">Il tuo <i>pubblico</i><br>ti sta<br><i>guardando</i></h1>

  <!-- sotto: una riga in maiuscolo, 2-4 parole -->
  <p class="sotto">Fatti ricordare</p>

  <!-- stelle: tre stelline nell'accento intorno al titolo -->
  <svg class="stella" style="left: 160px; top: 676px; transform: rotate(-12deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 2.6l2.7 6 6.5.6-4.9 4.3 1.5 6.4L12 16.6 6.2 19.9l1.5-6.4L2.8 9.2l6.5-.6z"/></svg>
  <svg class="stella" style="left: 860px; top: 600px; transform: rotate(10deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 2.6l2.7 6 6.5.6-4.9 4.3 1.5 6.4L12 16.6 6.2 19.9l1.5-6.4L2.8 9.2l6.5-.6z"/></svg>
  <svg class="stella" style="left: 504px; top: 1010px; transform: rotate(-6deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 2.6l2.7 6 6.5.6-4.9 4.3 1.5 6.4L12 16.6 6.2 19.9l1.5-6.4L2.8 9.2l6.5-.6z"/></svg>
</body>
</html>
