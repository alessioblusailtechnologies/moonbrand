<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2A2724; --secondario: #F682A6; --accento: #FCAC30; --sfondo: #F2EDCE; }
  /* Nanum Brush Script è stretto: qui è ingrandito, così le misure sotto valgono per i font del brand, più larghi. */
  @font-face { font-family: 'Nanum Pennello'; src: url(https://fonts.gstatic.com/s/nanumbrushscript/v26/wXK2E2wfpokopxzthSqPbcR5_gVaxazCiapq.woff2) format('woff2'); size-adjust: 150%; }
  :root { --font-titoli: 'Nanum Pennello', 'Nanum Brush Script', cursive; --font-testo: 'Gaegu', cursive; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 50%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 26%, transparent); }

  .titolo { position: absolute; left: 110px; top: 720px; width: 900px; text-align: center; font-family: var(--font-titoli); font-size: 118px; font-weight: 400; line-height: 153px; letter-spacing: 0.01em; transform: rotate(-7deg); }
  .titolo span { display: block; }
  .titolo .prima { margin-left: 120px; }
  .sotto { position: absolute; left: 560px; top: 1078px; width: 420px; text-align: center; font-family: var(--font-testo); font-size: 46px; font-weight: 700; line-height: 1.08; letter-spacing: 0.06em; text-transform: uppercase; transform: rotate(-7deg); }
  .stella { position: absolute; width: 58px; height: 58px; color: var(--chiaro); }
</style>
</head>
<body>
  <!-- foto: un dettaglio di persona al lavoro (mani, maglione, una tazza, un portatile), da vicino e un po' storta -->
  <img class="foto" src="../esempio/maglione.jpg" alt="">
  <div class="velo"></div>

  <!-- titolo: due righe scritte a mano, inclinate; la prima 1-2 parole, la seconda 2-3 parole, al massimo 16 caratteri -->
  <h1 class="titolo"><span class="prima">Pianifica</span><span>con la testa</span></h1>

  <!-- sotto: due righe corte in maiuscolo, 3-4 parole in tutto -->
  <p class="sotto">Semplifica<br>il lavoro</p>

  <!-- stelle: tre stelline tonde nel colore dei testi, ai lati del titolo -->
  <svg class="stella" style="left: 160px; top: 790px; transform: rotate(-16deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M12 3.4l2.5 5.6 6.1.6-4.6 4 1.4 6L12 16.5l-5.4 3.1 1.4-6-4.6-4 6.1-.6z"/></svg>
  <svg class="stella" style="left: 892px; top: 650px; transform: rotate(14deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M12 3.4l2.5 5.6 6.1.6-4.6 4 1.4 6L12 16.5l-5.4 3.1 1.4-6-4.6-4 6.1-.6z"/></svg>
  <svg class="stella" style="left: 440px; top: 1150px; transform: rotate(-8deg);" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M12 3.4l2.5 5.6 6.1.6-4.6 4 1.4 6L12 16.5l-5.4 3.1 1.4-6-4.6-4 6.1-.6z"/></svg>
</body>
</html>
