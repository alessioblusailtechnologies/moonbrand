<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2A2724; --secondario: #F682A6; --accento: #FCAC30; --sfondo: #F2EDCE; }
  :root { --font-titoli: 'Gaegu', cursive; --font-testo: 'Gaegu', cursive; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 50%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 26%, transparent); }

  .titolo { position: absolute; left: 60px; top: 384px; width: 960px; text-align: center; font-family: var(--font-titoli); font-size: 106px; font-weight: 700; line-height: 1.29; letter-spacing: 0.26em; text-transform: uppercase; }
  /* lo spazio dopo l'ultima lettera sposterebbe le righe a sinistra */
  .titolo span { display: block; margin-right: -0.26em; }
  .sotto { position: absolute; left: 0; top: 990px; width: 1080px; text-align: center; font-family: 'DotGothic16', monospace; font-size: 40px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <!-- foto: persone vere insieme, all'aperto, luce calda; i visi a metà altezza, il titolo ci passa sopra -->
  <img class="foto" src="../esempio/spiaggia.jpg" alt="">
  <div class="velo"></div>

  <!-- titolo: quattro righe molto spaziate in maiuscolo, una parola per riga, al massimo 9 lettere per riga -->
  <h1 class="titolo"><span>Fai</span><span>contenuti</span><span>che</span><span>vendono</span></h1>

  <!-- sotto: tra graffe, a pixel, 2-4 parole -->
  <p class="sotto">{Prova così}</p>
</body>
</html>
