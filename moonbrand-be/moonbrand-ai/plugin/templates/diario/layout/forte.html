<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2A2724; --secondario: #F682A6; --accento: #FCAC30; --sfondo: #F2EDCE; }
  :root { --font-titoli: 'Schibsted Grotesk', sans-serif; --font-testo: 'Schibsted Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 60% 50%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 22%, transparent); }

  .titolo { position: absolute; left: 112px; top: 470px; width: 760px; font-family: var(--font-titoli); font-size: 168px; font-weight: 500; line-height: 0.98; letter-spacing: -0.055em; }
  .sotto { position: absolute; left: 116px; top: 1028px; font-family: 'DotGothic16', monospace; font-size: 48px; letter-spacing: 0.04em; white-space: nowrap; }
</style>
</head>
<body>
  <!-- foto: una persona di spalle o di profilo su un lato, davanti a un paesaggio calmo (acqua, cielo); la metà sinistra libera per il titolo -->
  <img class="foto" src="../esempio/lago.jpg" alt="">
  <div class="velo"></div>

  <!-- titolo: 3 righe a sinistra, una o due parole per riga, al massimo 9 lettere per riga -->
  <h1 class="titolo">Dai forma<br>al tuo<br>brand</h1>

  <!-- sotto: tra graffe, a pixel, 2-4 parole -->
  <p class="sotto">{Prima di tutto}</p>
</body>
</html>
