<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #15121D; --secondario: #2B2735; --accento: #FFFFFF; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Arimo', sans-serif; --font-testo: 'Arimo', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .su { position: absolute; left: 72px; top: 68px; font-size: 22px; line-height: 1; text-transform: uppercase; }
  .linea { position: absolute; left: 72px; top: 112px; width: 705px; height: 3px; background: var(--secondario); }
  .giu { position: absolute; left: 72px; top: 142px; font-size: 22px; line-height: 1.32; text-transform: uppercase; }
  .bottone { position: absolute; left: 824px; top: 67px; width: 188px; height: 86px; border-radius: 43px; border: 3px solid var(--secondario); color: var(--secondario); display: flex; align-items: center; justify-content: center; }
  .bottone svg { width: 34px; height: 34px; }

  .titolo { position: absolute; left: 271px; top: 290px; width: 545px; font-family: var(--font-titoli); font-weight: 700; font-size: 56px; line-height: 1.14; letter-spacing: -0.035em;
    text-align: justify; text-align-last: left; }
  .foto { position: absolute; left: 271px; top: 521px; width: 545px; height: 536px; object-fit: cover; display: block; }
  .verticale { position: absolute; left: 950px; top: 1010px; width: 100px; text-align: center; transform: rotate(-90deg); font-size: 24px; line-height: 1; white-space: nowrap; }
  .testo { position: absolute; left: 72px; top: 1170px; width: 940px; font-size: 25px; line-height: 1.33; text-align: justify; text-align-last: left; }
</style>
</head>
<body>
  <!-- su: l'invito sopra la linea, 2-3 parole in maiuscolo -->
  <p class="su">Leggi sul sito</p>
  <div class="linea"></div>
  <!-- giu: il tipo di contenuto, 3-4 parole su due righe -->
  <p class="giu">Il nuovo articolo<br>del blog.</p>
  <!-- bottone: ovale a filetto con la freccia -->
  <div class="bottone"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17h22M19 8l9 9-9 9"/></svg></div>

  <!-- titolo: il titolo dell'articolo, 6-9 parole su tre righe, giustificato -->
  <h1 class="titolo">Obiettivi chiari per una crescita che dura nel tempo.</h1>
  <!-- foto: persone al lavoro insieme, quasi quadrata, sotto il titolo e larga quanto lui -->
  <img class="foto" src="../esempio/scrivania.jpg" alt="">
  <!-- verticale: un hashtag di una parola, in verticale accanto alla foto -->
  <p class="verticale">#Crescere</p>

  <!-- testo: l'attacco dell'articolo, 30-40 parole, giustificato -->
  <p class="testo">Un buon piano di marketing parte da una domanda semplice: cosa deve cambiare tra sei mesi? Da lì si scelgono canali, messaggi e budget, e ogni post ha un motivo preciso per esistere.</p>
</body>
</html>
