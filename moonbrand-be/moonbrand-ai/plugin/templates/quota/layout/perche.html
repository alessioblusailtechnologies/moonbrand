<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #15121D; --secondario: #2B2735; --accento: #FFFFFF; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Arimo', sans-serif; --font-testo: 'Arimo', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 38% 50%; display: block; filter: grayscale(1) contrast(1.35) brightness(0.74); }
  .titolo { position: absolute; right: 80px; top: 100px; width: 560px; padding-right: 60px; text-align: right; color: #FFFFFF; font-family: var(--font-titoli); font-weight: 700;
    font-size: 52px; line-height: 0.98; letter-spacing: -0.045em; text-transform: uppercase; }
  .titolo::after { content: ''; position: absolute; right: 0; top: 3px; bottom: 1px; width: 28px; background: var(--secondario); }

  .pillola { position: absolute; height: 70px; padding: 0 36px; border-radius: 35px; display: flex; align-items: center; white-space: nowrap;
    background: var(--accento); color: var(--principale); font-size: 26px; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <!-- foto: un edificio dal basso o un soggetto forte, sempre in bianco e nero, a tutta pagina -->
  <img class="foto" src="../esempio/facciata.jpg" alt="">

  <!-- titolo: la domanda o la promessa, 5-7 parole su due o tre righe, in maiuscolo, allineato a destra -->
  <h1 class="titolo">Perché le aziende restano con noi</h1>

  <!-- pillole: 4 punti di forza di 1-3 parole, ognuno ripetuto due volte sparso sulla foto -->
  <p class="pillola" style="left:70px; top:146px">Crescita misurabile</p>
  <p class="pillola" style="left:418px; top:314px">Risultati veri</p>
  <p class="pillola" style="left:320px; top:642px">Impatto reale</p>
  <p class="pillola" style="left:62px; top:766px">Crescita misurabile</p>
  <p class="pillola" style="left:660px; top:822px">Risultati veri</p>
  <p class="pillola" style="left:506px; top:1006px">Budget sotto controllo</p>
  <p class="pillola" style="left:110px; top:1136px">Budget sotto controllo</p>
  <p class="pillola" style="left:700px; top:1190px">Impatto reale</p>
</body>
</html>
