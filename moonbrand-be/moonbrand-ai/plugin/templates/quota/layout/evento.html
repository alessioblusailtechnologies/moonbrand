<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #15121D; --secondario: #2B2735; --accento: #FFFFFF; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Arimo', sans-serif; --font-testo: 'Arimo', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 54px; top: 58px; font-family: var(--font-titoli); font-weight: 700; font-size: 100px; line-height: 1; letter-spacing: -0.06em; white-space: nowrap; }
  .tema { position: absolute; left: 652px; top: 74px; width: 374px; }
  .tema h2 { font-family: var(--font-titoli); font-size: 37px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  .tema p { margin-top: 20px; font-size: 23px; line-height: 1.38; text-align: justify; text-align-last: left; }

  .chi { position: absolute; left: 54px; top: 492px; font-family: var(--font-titoli); font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .linea { position: absolute; left: 54px; top: 548px; width: 972px; height: 3px; background: var(--secondario); }
  .sotto { position: absolute; left: 54px; top: 576px; width: 340px; font-size: 24px; line-height: 1.38; text-align: justify; text-align-last: left; }
  .volti { position: absolute; right: 54px; top: 574px; display: flex; gap: 18px; }
  .volti img { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; display: block; }

  .quando { position: absolute; left: 700px; top: 990px; width: 326px; display: flex; justify-content: space-between; font-size: 27px; line-height: 1; }
  .data { position: absolute; right: 54px; top: 1066px; text-align: right; font-family: var(--font-titoli); font-size: 232px; font-weight: 400; line-height: 1; letter-spacing: -0.07em; white-space: nowrap; }
</style>
</head>
<body>
  <!-- titolo: il tipo di appuntamento, una parola (Evento, Webinar, Workshop) -->
  <h1 class="titolo">Workshop</h1>
  <div class="tema">
    <!-- tema: il titolo dell'incontro, 2-3 parole -->
    <h2>Social che vendono</h2>
    <!-- tema-testo: di cosa si parla, 10-16 parole -->
    <p>Come trasformare chi ti segue in clienti, con esempi veri di attività locali.</p>
  </div>

  <!-- chi: una parola sopra la linea (Relatori, Ospiti) -->
  <p class="chi">Relatori</p>
  <div class="linea"></div>
  <!-- sotto: una riga di 5-9 parole sotto la linea -->
  <p class="sotto">Tre ore pratiche con il nostro team strategico.</p>
  <!-- volti: tre ritratti rotondi di chi parla -->
  <div class="volti">
    <img src="../esempio/relatrice.jpg" alt="" style="object-position: 30% 30%">
    <img src="../esempio/relatore.jpg" alt="" style="object-position: 50% 25%">
    <img src="../esempio/ospite.jpg" alt="" style="object-position: 50% 20%">
  </div>

  <!-- quando: giorno della settimana e ora -->
  <p class="quando"><span>Giovedì</span><span>/</span><span>18:30</span></p>
  <!-- data: giorno e mese abbreviato, al massimo 6 caratteri -->
  <p class="data">14 Nov</p>
</body>
</html>
