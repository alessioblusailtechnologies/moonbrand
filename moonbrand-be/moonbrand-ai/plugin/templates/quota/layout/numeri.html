<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #15121D; --secondario: #2B2735; --accento: #FFFFFF; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Arimo', sans-serif; --font-testo: 'Arimo', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 74px; top: 96px; width: 940px; font-family: var(--font-titoli); font-weight: 400; font-size: 66px; line-height: 1.12; letter-spacing: -0.02em; }
  .righe { position: absolute; left: 72px; top: 352px; width: 936px; }
  .riga { display: flex; align-items: center; height: 235px; border-bottom: 2px solid var(--secondario); }
  .cifra { width: 440px; text-align: right; font-family: var(--font-titoli); font-size: 118px; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
  .voce { margin-left: 50px; }
  .piccolo { display: block; font-size: 19px; line-height: 1; margin-bottom: 14px; }
  .grande { display: block; font-size: 40px; line-height: 1; letter-spacing: -0.01em; }

  .tondo { position: absolute; top: 1160px; width: 140px; height: 140px; border-radius: 50%; border: 2px solid var(--secondario); display: flex; align-items: center; justify-content: center; color: var(--secondario); }
  .t1 { left: 74px; } .t2 { right: 72px; }
  .tondo svg { width: 30px; height: 30px; }
</style>
</head>
<body>
  <!-- titolo: il tema dei numeri, 5-9 parole su due righe -->
  <h1 class="titolo">Il metodo conta: i numeri del nostro primo anno</h1>

  <div class="righe">
    <!-- righe: tre numeri veri (al massimo 6 caratteri), ognuno con una parolina sopra e la voce di 1-2 parole -->
    <div class="riga"><p class="cifra">48.000</p><p class="voce"><span class="piccolo">Contatti</span><span class="grande">generati</span></p></div>
    <div class="riga"><p class="cifra">1.200</p><p class="voce"><span class="piccolo">Contenuti</span><span class="grande">pubblicati</span></p></div>
    <div class="riga"><p class="cifra">16</p><p class="voce"><span class="piccolo">Aziende</span><span class="grande">seguite</span></p></div>
  </div>

  <!-- tondi: due cerchi a filetto in basso con un segno piccolo (documento a sinistra, freccia a destra) -->
  <div class="tondo t1"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3h10l5 5v19H8z"/><path d="M12 22v-4M15.5 22v-7M19 22v-5"/></svg></div>
  <div class="tondo t2"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 15h20M18 8l7 7-7 7"/></svg></div>
</body>
</html>
