<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1F1612; --secondario: #B88E68; --accento: #7E5235; --sfondo: #FDF5EC; }
  :root { --font-titoli: 'Playfair Display', serif; --font-testo: 'Poppins', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--accento); color: var(--principale); font-family: var(--font-testo); }
  /* la foto dentro la cornice piena in accento */
  .foto { position: absolute; left: 18px; top: 18px; width: 1044px; height: 1314px; object-fit: cover; display: block; }
  .pannello { position: absolute; left: 210px; top: 335px; width: 660px; height: 708px; border-radius: 40px;
    border: 2px solid color-mix(in oklch, var(--principale) 45%, transparent); background: color-mix(in oklch, var(--sfondo) 58%, transparent); }
  .titolo { position: absolute; left: 0; width: 656px; top: 50px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 64px; line-height: 1.1; letter-spacing: 0.01em; }
  .filo { position: absolute; left: 0; top: 166px; width: 656px; height: 2px; background: color-mix(in oklch, var(--principale) 45%, transparent); }
  .testo { position: absolute; left: 92px; top: 214px; width: 472px; font-size: 24px; line-height: 1.68; letter-spacing: 0.05em; text-align: justify; hyphens: manual; }
  .nome { position: absolute; left: 0; width: 656px; top: 556px; text-align: center; font-family: var(--font-titoli); font-size: 42px; line-height: 1.2; }
  .stelle { position: absolute; left: 0; width: 656px; top: 634px; text-align: center; font-size: 28px; letter-spacing: 0.45em; padding-left: 0.45em; color: var(--accento); }
</style>
</head>
<body>
  <!-- foto: un fondo di materia (agrumi secchi, farina, chicchi), tanti elementi uguali -->
  <img class="foto" src="../esempio/arance.jpg" alt="">

  <div class="pannello">
    <!-- titolo: 2-3 parole -->
    <h1 class="titolo">Dicono di noi</h1>
    <div class="filo"></div>
    <!-- recensione: 40-55 parole, giustificata -->
    <p class="testo">Il pane di questo forno è una scoperta. Crosta che scrocchia, mollica morbida e un profumo che si sente dal fondo della via. Si sente la cura in ogni pezzo, dalle michette alla focaccia. Il sabato mattina ormai passo qui prima di tutto il resto.</p>
    <!-- nome: nome e cognome di chi scrive -->
    <p class="nome">Giulia Ferretti</p>
    <!-- stelle: il voto -->
    <p class="stelle">★★★★★</p>
  </div>
</body>
</html>
