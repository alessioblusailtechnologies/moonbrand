<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root { --principale: #021F67; --secondario: #3569CF; --accento: #0A1F5B; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Pathway Gothic One', sans-serif; --font-testo: 'Titillium Web', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: #D9D9DB; font-family: var(--font-testo); }

  .foto { position: absolute; left: 360px; top: 0; width: 900px; height: 1350px; object-fit: cover; object-position: 50% 30%; display: block;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%); mask-image: linear-gradient(90deg, transparent 0%, #000 22%); }
  .velo { position: absolute; inset: 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--principale) 62%, transparent) 0%, color-mix(in srgb, var(--secondario) 58%, transparent) 100%); }

  .titolo { position: absolute; left: 116px; top: 410px; width: 500px; font-family: var(--font-titoli); font-weight: 400; color: #FFFFFF;
    text-transform: uppercase; font-size: 172px; line-height: 0.97; letter-spacing: 0.015em; }
  .titolo span { display: block; white-space: nowrap; }
  .titolo .evidenza { color: var(--accento); }
</style>
</head>
<body>
  <!-- foto: una persona a mezza figura, sguardo pensoso o deciso, sulla metà destra; fondo chiaro e uniforme -->
  <img class="foto" src="../esempio/consulente.jpg" alt="">
  <div class="velo"></div>

  <!-- titolo: tre righe di una parola corta ciascuna, ognuna chiusa dal punto, al massimo 7 lettere; la riga centrale nell'accento -->
  <h1 class="titolo"><span>Meno.</span><span class="evidenza">Post.</span><span>Meglio.</span></h1>
</body>
</html>
