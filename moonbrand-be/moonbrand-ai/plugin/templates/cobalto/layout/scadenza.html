<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #021F67; --secondario: #3569CF; --accento: #0A1F5B; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Titillium Web', sans-serif; --font-testo: 'Titillium Web', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; font-family: var(--font-testo); color: #FFFFFF; background: var(--principale); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 50%; display: block; filter: grayscale(1); }
  .velo { position: absolute; inset: 0;
    background: linear-gradient(130deg, color-mix(in srgb, var(--principale) 85%, transparent) 0%, color-mix(in srgb, var(--secondario) 80%, transparent) 100%); }

  .sopra { position: absolute; left: 0; width: 1080px; top: 150px; text-align: center; font-family: var(--font-titoli); font-size: 100px; font-weight: 700; line-height: 1.1; text-transform: uppercase; }

  .cifre { position: absolute; left: 0; width: 1080px; top: 372px; display: flex; justify-content: center; gap: 44px; }
  .cifra { position: relative; width: 218px; height: 502px; background: #FFFFFF; border-radius: 22px; color: var(--accento);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-titoli); font-size: 280px; font-weight: 700; line-height: 1; overflow: hidden; }
  /* la piega delle palette: una riga del colore del fondo e due tacche sui lati */
  .cifra::before { content: ''; position: absolute; left: 0; right: 0; top: 249px; height: 4px; background: color-mix(in srgb, var(--principale) 70%, var(--secondario)); }
  .cifra::after { content: ''; position: absolute; left: 0; right: 0; top: 236px; height: 30px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--principale) 55%, var(--secondario)) 0 16px, transparent 16px calc(100% - 16px), color-mix(in srgb, var(--principale) 45%, var(--secondario)) calc(100% - 16px)); }

  .sotto { position: absolute; left: 0; width: 1080px; top: 1000px; text-align: center; font-size: 58px; font-weight: 400; text-transform: uppercase; line-height: 1.1; }
  .info { position: absolute; left: 152px; width: 776px; top: 1166px; height: 80px; border: 2px solid color-mix(in srgb, #FFFFFF 85%, transparent);
    display: flex; align-items: center; justify-content: center; font-size: 34px; text-transform: uppercase; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <!-- foto: un tavolo con fogli, grafici o portatile, sotto il velo -->
  <img class="foto" src="../esempio/grafici.jpg" alt="">
  <div class="velo"></div>

  <!-- sopra: una parola sola -->
  <h1 class="sopra">Solo</h1>
  <!-- cifre: due cifre, una per palette -->
  <div class="cifre"><div class="cifra">0</div><div class="cifra">5</div></div>
  <!-- sotto: 2-3 parole, cosa scade -->
  <p class="sotto">Giorni al corso</p>
  <!-- info: dove iscriversi o cosa succede, 3-6 parole -->
  <p class="info">Iscrizioni dal link in bio</p>
</body>
</html>
