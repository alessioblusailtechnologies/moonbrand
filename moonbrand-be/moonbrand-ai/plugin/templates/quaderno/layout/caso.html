<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --principale: #1A2230; --secondario: #5C6470; --accento: #2E5E4E; --sfondo: #EEEEEA; }

/* Griglia: margine sinistro 88, destro 72, sei colonne da 133 con canale da 24. Inizio colonne: 88, 245, 403, 560, 717, 875. */
html { --filo: color-mix(in srgb, var(--principale) 35%, transparent); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; }
body { position: relative; overflow: hidden; background: var(--sfondo); color: var(--principale); font-family: 'Newsreader', serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }

.testata { position: absolute; left: 88px; right: 72px; top: 56px; padding-bottom: 18px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--principale); }
.logo { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
.rubrica { font-family: 'Schibsted Grotesk', sans-serif; font-size: 24px; color: var(--secondario); }

.foto { position: absolute; left: 0; top: 164px; width: 1080px; height: 600px; object-fit: cover; object-position: 50% 45%; }

h2 { position: absolute; left: 86px; right: 150px; top: 808px; font-size: 64px; line-height: 1.04; font-weight: 450; letter-spacing: -0.018em; text-wrap: balance; }

.risultati { position: absolute; left: 88px; right: 72px; bottom: 64px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; border-top: 1px solid var(--filo); }
.risultato { padding-top: 18px; }
.risultato + .risultato { padding-left: 24px; border-left: 1px solid var(--filo); }
.cifra { font-size: 128px; line-height: 1; font-weight: 400; letter-spacing: -0.035em; font-variant-numeric: lining-nums; color: var(--accento); }
.misura { margin-top: 12px; font-family: 'Schibsted Grotesk', sans-serif; font-size: 24px; line-height: 1.4; max-width: 400px; }
</style>
</head>
<body>
  <header class="testata">
    <!-- logo: il nome del brand -->
    <span class="logo">Pardo &amp; Ferri</span>
    <!-- rubrica: il cliente e il luogo -->
    <span class="rubrica">Lavori, Forno Gatti a Imola</span>
  </header>

  <!-- foto: il cliente al lavoro o il lavoro fatto per lui, vero; a tutta larghezza -->
  <img class="foto" src="../esempio/forno.jpg" alt="">

  <!-- titolo: cosa è cambiato per il cliente, 6-11 parole, al massimo due righe -->
  <h2>Il pane del sabato si prenota online, e al banco si respira</h2>

  <section class="risultati">
    <div class="risultato">
      <!-- risultato 1: la cifra misurata, al massimo 6 caratteri -->
      <p class="cifra">+41%</p>
      <!-- cosa misura e in che periodo, massimo 80 caratteri -->
      <p class="misura">ordini per il sabato, da marzo a settembre, rispetto al 2025</p>
    </div>
    <div class="risultato">
      <!-- risultato 2: un'altra cifra misurata, al massimo 6 caratteri; si può togliere tutto il blocco -->
      <p class="cifra">9 ore</p>
      <!-- cosa misura e in che periodo, massimo 80 caratteri -->
      <p class="misura">di telefono in meno ogni settimana per chi sta al banco</p>
    </div>
  </section>
</body>
</html>
