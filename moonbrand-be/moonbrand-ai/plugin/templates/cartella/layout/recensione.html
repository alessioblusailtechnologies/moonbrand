<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@115,900&family=Hanken+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #543928; --secondario: #C3D9E7; --accento: #F6DDE0; --sfondo: #F7EEC7; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Hanken Grotesk', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--sfondo); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 796px; width: 1080px; height: 554px; object-fit: cover; display: block; }
  .titolo { position: absolute; left: 40px; top: 128px; width: 1000px; text-align: center; font-family: var(--font-titoli); font-weight: 900; font-stretch: 115%; font-size: 118px; line-height: 0.86; text-transform: uppercase; letter-spacing: -0.01em; }
  .stelle { position: absolute; left: 0; top: 372px; width: 1080px; height: 54px; display: flex; justify-content: center; gap: 10px; }
  .stelle svg { width: 50px; height: 50px; }
  .testo { position: absolute; left: 110px; top: 456px; width: 860px; text-align: center; font-size: 32px; font-weight: 500; line-height: 1.58; }
  .firma { position: absolute; left: 50%; top: 716px; transform: translateX(-50%); height: 148px; padding: 0 64px 0 22px; border-radius: 74px; background: var(--accento); border: 3px solid var(--principale);
    display: flex; align-items: center; gap: 30px; color: var(--principale); white-space: nowrap; }
  .firma img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; border: 2px solid var(--principale); }
  .firma b { display: block; font-size: 38px; font-weight: 700; line-height: 1.15; }
  .firma span { display: block; font-size: 29px; font-weight: 500; line-height: 1.3; }
</style>
</head>
<body>
  <!-- foto: metà bassa, i prodotti o il lavoro del cliente, da vicino -->
  <img class="foto" src="../esempio/cosmetici.jpg" alt="">

  <!-- titolo: due righe in maiuscolo, al massimo 11 lettere per riga -->
  <h1 class="titolo">Dicono<br>di noi</h1>
  <div class="stelle">
    <svg viewBox="0 0 24 24"><path style="fill: var(--accento)" d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z"/></svg>
    <svg viewBox="0 0 24 24"><path style="fill: var(--accento)" d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z"/></svg>
    <svg viewBox="0 0 24 24"><path style="fill: var(--accento)" d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z"/></svg>
    <svg viewBox="0 0 24 24"><path style="fill: var(--accento)" d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z"/></svg>
    <svg viewBox="0 0 24 24"><path style="fill: var(--accento)" d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z"/></svg>
  </div>
  <!-- testo: la recensione, 28-38 parole -->
  <p class="testo">In sei mesi il nostro profilo è cambiato. Post curati, reel che funzionano e finalmente qualcuno che risponde ai clienti. Le richieste dal sito sono raddoppiate e noi pensiamo solo ai prodotti.</p>
  <!-- firma: foto tonda, nome e cognome, attività del cliente -->
  <div class="firma"><img src="../esempio/ritratto.jpg" alt=""><div><b>Marta Bellini</b><span>Linea Alba Cosmetici</span></div></div>
</body>
</html>
