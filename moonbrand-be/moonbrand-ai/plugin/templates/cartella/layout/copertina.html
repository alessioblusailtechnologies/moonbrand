<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@115,900&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #543928; --secondario: #C3D9E7; --accento: #F6DDE0; --sfondo: #F7EEC7; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Hanken Grotesk', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .sfocata { position: absolute; left: 0; top: 0; width: 1080px; height: 520px; object-fit: cover; filter: blur(26px) saturate(0.9); transform: scale(1.12); }
  .cartella { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
  .polaroid { position: absolute; background: #FFFFFF; padding: 14px 14px 0; box-shadow: 0 6px 16px rgba(0,0,0,0.18); }
  .polaroid img { display: block; object-fit: cover; }
  .p1 { left: 648px; top: 236px; transform: rotate(4deg); z-index: 2; }
  .p1 img { width: 368px; height: 250px; }
  .p2 { left: 22px; top: 384px; transform: rotate(-5deg); z-index: 5; }
  .p2 img { width: 420px; height: 236px; object-position: 50% 30%; }
  .rosa { z-index: 3; } .scura { z-index: 4; } .azzurra { z-index: 6; } .gialla { z-index: 7; }

  .linguetta { position: absolute; z-index: 9; font-size: 24px; font-weight: 700; letter-spacing: -0.005em; white-space: nowrap; text-align: center; }
  .l1 { left: 96px; top: 306px; width: 344px; }
  .l2 { left: 760px; top: 422px; width: 316px; color: var(--sfondo); }
  .l3 { left: 412px; top: 543px; width: 350px; }
  .l4 { left: 36px; top: 668px; width: 360px; }

  .titolo { position: absolute; z-index: 9; left: 108px; top: 840px; width: 880px; font-family: var(--font-titoli); font-weight: 900; font-stretch: 115%; font-size: 106px; line-height: 0.9; text-transform: uppercase; letter-spacing: -0.01em; }
  .sotto { position: absolute; z-index: 9; left: 110px; top: 1162px; width: 760px; font-size: 27px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; }
  .freccia { position: absolute; z-index: 9; left: 922px; top: 1166px; width: 50px; height: 26px; color: var(--principale); }
</style>
</head>
<body>
  <!-- sfondo: una foto qualunque del brand, resta sfocata come un fondo di colori -->
  <img class="sfocata" src="../esempio/fiori.jpg" alt="">

  <!-- foto-1: polaroid dietro la prima cartella, un dettaglio (persona, prodotto) -->
  <div class="polaroid p1"><img src="../esempio/capelli.jpg" alt=""></div>
  <svg class="cartella rosa" viewBox="0 0 1080 1350"><path style="fill: var(--accento)" d="M0 346 L78 346 C96 346 96 284 128 284 L408 284 C440 284 440 346 458 346 L1080 346 L1080 1350 L0 1350 Z"/></svg>
  <!-- foto-2: polaroid tra le cartelle, il lavoro in corso (un set, una ripresa) -->
  <div class="polaroid p2"><img src="../esempio/squadra.jpg" alt=""></div>
  <svg class="cartella scura" viewBox="0 0 1080 1350"><path style="fill: var(--principale)" d="M0 464 L722 464 C740 464 740 398 772 398 L1080 398 L1080 1350 L0 1350 Z"/></svg>
  <svg class="cartella azzurra" viewBox="0 0 1080 1350"><path style="fill: var(--secondario)" d="M0 594 L380 594 C398 594 398 516 430 516 L740 516 C772 516 772 594 790 594 L1080 594 L1080 1350 L0 1350 Z"/></svg>
  <svg class="cartella gialla" viewBox="0 0 1080 1350"><path style="fill: var(--sfondo)" d="M0 718 L0 718 C0 718 6 634 52 634 L372 634 C404 634 404 718 422 718 L1080 718 L1080 1350 L0 1350 Z"/></svg>

  <!-- linguette: quattro voci di 1-3 parole (i servizi; l'ultima apre la cartella davanti) -->
  <p class="linguetta l1">Gestione dei social</p>
  <p class="linguetta l2">Contenuti</p>
  <p class="linguetta l3">Influencer</p>
  <p class="linguetta l4">I nostri servizi</p>

  <!-- titolo: tre righe corte in maiuscolo, al massimo 10 lettere per riga -->
  <h1 class="titolo">I nostri<br>servizi<br>social</h1>
  <!-- sotto: una riga in maiuscolo, 4-6 parole -->
  <p class="sotto">Come possiamo lavorare insieme</p>
  <svg class="freccia" viewBox="0 0 50 26" fill="none" stroke="currentColor" stroke-width="5"><path d="M0 13 H44"/><path d="M33 3 L45 13 L33 23" stroke-linejoin="miter"/></svg>
</body>
</html>
