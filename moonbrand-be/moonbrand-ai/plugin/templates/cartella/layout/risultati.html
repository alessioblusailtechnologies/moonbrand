<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@115,900&family=Hanken+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #543928; --secondario: #C3D9E7; --accento: #F6DDE0; --sfondo: #F7EEC7; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Hanken Grotesk', sans-serif; }
  :root { --filo: color-mix(in srgb, var(--principale) 70%, transparent); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--secondario); color: var(--principale); font-family: var(--font-testo); }

  .quadro { position: absolute; left: 58px; top: 76px; width: 966px; height: 1204px; background: var(--sfondo); border: 2px solid var(--filo); }
  .testata { position: absolute; left: 52px; top: 44px; width: 860px; display: flex; justify-content: space-between; font-size: 24px; font-weight: 500; }
  .titolo { position: absolute; left: 0; top: 160px; width: 962px; text-align: center; font-family: var(--font-titoli); font-weight: 900; font-stretch: 115%; font-size: 108px; line-height: 1; text-transform: uppercase; letter-spacing: -0.005em; }
  .testo { position: absolute; left: 120px; top: 330px; width: 722px; text-align: center; font-size: 32px; font-weight: 500; line-height: 1.7; }
  .tabella { position: absolute; left: 108px; top: 600px; width: 754px; background: #FFFFFF; border: 2px solid var(--filo); }
  .riga { height: 117px; display: flex; align-items: center; }
  .riga + .riga { border-top: 2px solid color-mix(in srgb, var(--principale) 30%, transparent); }
  .riga b { width: 272px; padding-left: 58px; font-family: var(--font-titoli); font-weight: 900; font-stretch: 115%; font-size: 56px; letter-spacing: -0.02em; }
  .riga span { font-size: 32px; font-weight: 500; }
</style>
</head>
<body>
  <div class="quadro">
    <!-- testata: il nome del brand a sinistra (class logo) e il profilo a destra -->
    <div class="testata"><span class="logo">studio vetrina</span><span>@studiovetrina</span></div>
    <!-- titolo: una parola in maiuscolo, al massimo 10 lettere -->
    <h1 class="titolo">Risultati</h1>
    <!-- testo: cosa è cambiato, 24-32 parole -->
    <p class="testo">Una presenza social più costante e pensata, con più interazioni, più persone raggiunte, follower che crescono ogni mese e più visite al sito.</p>
    <!-- righe: quattro numeri (segno, 2 cifre, %) e la loro voce di 1-3 parole -->
    <div class="tabella">
      <div class="riga"><b>+42%</b><span>Interazioni</span></div>
      <div class="riga"><b>+68%</b><span>Copertura</span></div>
      <div class="riga"><b>+24%</b><span>Clic sul sito</span></div>
      <div class="riga"><b>+31%</b><span>Nuovi follower</span></div>
    </div>
  </div>
</body>
</html>
