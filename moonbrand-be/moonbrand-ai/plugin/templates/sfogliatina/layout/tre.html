<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1B1A17; --secondario: #8B6B47; --accento: #F5D35A; --sfondo: #F3EEE5; }
  :root { --font-titoli: 'Noto Serif Display', serif; --font-testo: 'Montserrat', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  /* tre cerchi a filo sottile che si incrociano, una parola in ciascuno */
  .cerchi { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
  .cerchi circle { fill: none; stroke: var(--principale); stroke-width: 2; }
  .parola { position: absolute; width: 360px; text-align: center; font-family: var(--font-titoli); font-weight: 700; font-stretch: 75%; font-size: 76px; line-height: 1; color: var(--principale); text-shadow: 0 3px 6px color-mix(in srgb, var(--principale) 22%, transparent); }

  .logo { position: absolute; left: 395px; top: 1103px; width: 290px; height: 56px; border: 3px solid var(--principale); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--principale); }
</style>
</head>
<body>
  <svg class="cerchi" viewBox="0 0 1080 1350" aria-hidden="true">
    <circle cx="532" cy="345" r="208"/>
    <circle cx="380" cy="613" r="208"/>
    <circle cx="688" cy="613" r="208"/>
  </svg>

  <!-- parole: tre qualità del prodotto, una parola ciascuna (al massimo 9 lettere) -->
  <div class="parola" style="left: 352px; top: 270px;">Fragrante</div>
  <div class="parola" style="left: 190px; top: 585px;">Soffice</div>
  <div class="parola" style="left: 530px; top: 585px;">Burroso</div>

  <!-- logo: il nome del forno nella targhetta a filo, in basso al centro -->
  <div class="logo">Forno Ardizzone</div>
</body>
</html>
