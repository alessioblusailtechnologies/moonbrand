<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Courier+Prime:wght@400;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --principale: #4E2E1F; --secondario: #9B7C5F; --accento: #C2A586; --sfondo: #F5F0EA; }
  :root { --font-titoli: 'Kaushan Script', cursive; --font-testo: 'Courier Prime', monospace; }
  :root { --carta: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.04) h); --su-fascia: oklch(from var(--secondario) calc(clamp(0, (0.66 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--carta); color: var(--principale); font-family: var(--font-testo); }
  .etichetta { font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1; }
  .doodle { position: absolute; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .anelli { color: var(--accento); stroke-width: 7; }
  .tratto { color: var(--principale); stroke-width: 3; }

  .fascia { position: absolute; left: 0; top: 0; width: 1080px; height: 105px; background: var(--secondario); color: var(--su-fascia); }
  .fascia .logo { position: absolute; left: 117px; top: 32px; font-size: 40px; font-weight: 500; letter-spacing: 0.03em; }
  .fascia .sito { position: absolute; left: 585px; top: 30px; display: flex; align-items: center; gap: 22px; font-size: 32px; text-decoration: underline; text-underline-offset: 6px; }
  .fascia .sito svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 2.4; }

  .script { position: absolute; left: 0; width: 1080px; text-align: center; font-family: var(--font-titoli); font-weight: 400; line-height: 1; }
  .uno { top: 150px; font-size: 250px; }
  .due { top: 890px; font-size: 220px; }
  /* le parole piccole in mezzo, chiare e coperte in parte dal prodotto */
  .piccolo { position: absolute; left: 0; width: 1080px; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 500; text-transform: uppercase; line-height: 1; color: var(--accento); }
  .p1 { top: 390px; font-size: 96px; }
  .p2 { top: 800px; font-size: 84px; letter-spacing: 0.02em; }
  .foto { position: absolute; left: 90px; top: 360px; width: 960px; height: 686px; object-fit: cover; display: block; mix-blend-mode: multiply; filter: brightness(1.12) contrast(1.06);
    -webkit-mask-image: radial-gradient(ellipse 40% 40% at 46% 52%, #000 70%, transparent 100%); mask-image: radial-gradient(ellipse 40% 40% at 46% 52%, #000 70%, transparent 100%); }
  .testo { position: absolute; left: 40px; width: 1000px; top: 1180px; text-align: center; font-size: 27px; line-height: 1.6; }

  .anelli-su { width: 420px; height: 380px; left: -20px; top: 100px; }
  .stella { width: 60px; height: 130px; left: 1030px; top: 360px; }
  .freccia { width: 140px; height: 180px; left: 868px; top: 750px; transform: scaleX(-1) rotate(-10deg); }
  .cuore { width: 90px; height: 140px; left: -18px; top: 1010px; transform: rotate(-14deg); }
</style>
</head>
<body>
  <div class="fascia">
    <!-- logo: il nome del forno -->
    <p class="logo etichetta">Forno Bellavista</p>
    <!-- sito: l'indirizzo del sito -->
    <p class="sito"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><ellipse cx="20" cy="20" rx="7" ry="16"/><path d="M4 20 H36"/></svg>fornobellavista.it</p>
  </div>

  <svg class="doodle anelli anelli-su" viewBox="0 0 420 380"><path d="M10 40 C120 100 260 200 380 300 C410 326 390 350 360 326 C250 240 130 160 40 110 C10 94 24 66 56 80 C170 130 290 210 400 280 M20 200 C100 230 180 280 250 340"/></svg>

  <!-- uno: un verbo o una parola sola, in corsivo, al massimo 7 lettere -->
  <p class="script uno">Scegli</p>
  <!-- p1: 1-2 parole piccole in maiuscolo, coperte in parte dal prodotto -->
  <p class="piccolo p1">il tuo</p>

  <!-- foto: un prodotto di lato su un fondo liscio chiaro (si fonde con la carta), largo come la slide -->
  <img class="foto" src="../esempio/cornetto-lato.jpg" alt="">

  <!-- p2: una parola piccola in maiuscolo sopra la seconda riga in corsivo -->
  <p class="piccolo p2">gusto</p>
  <!-- due: una parola in corsivo, al massimo 9 lettere -->
  <p class="script due">preferito</p>

  <svg class="doodle tratto stella" viewBox="0 0 100 110"><path d="M52 4 C53 22 56 34 60 43 C72 44 84 44 96 47 C86 55 76 61 68 66 C72 79 76 92 78 104 C68 95 59 87 51 80 C42 87 32 95 21 102 C26 90 30 78 34 67 C24 60 14 54 5 48 C18 46 31 45 42 44 C46 32 49 18 52 4 Z"/></svg>
  <svg class="doodle tratto freccia" viewBox="0 0 100 150"><path d="M70 6 C40 14 30 44 52 54 C74 64 80 36 58 34 C30 32 18 80 34 140 M18 120 L34 142 L52 122"/></svg>
  <svg class="doodle tratto cuore" viewBox="0 0 100 110"><path d="M50 98 C30 76 6 58 8 34 C10 14 34 8 47 30 C54 10 82 4 90 26 C98 52 72 76 50 98 C44 80 42 62 34 50"/></svg>

  <!-- testo: due righe, una frase corta e l'elenco dei gusti (al massimo 60 caratteri) -->
  <p class="testo">Li trovi in vetrina ogni mattina:<br>crema, pistacchio, cioccolato, albicocca, frutti di bosco</p>
</body>
</html>
