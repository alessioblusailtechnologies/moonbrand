<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #4E2E1F; --secondario: #9B7C5F; --accento: #C2A586; --sfondo: #F5F0EA; }
  :root { --font-titoli: 'Kaushan Script', cursive; --font-testo: 'Courier Prime', monospace; }
  :root { --carta: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.04) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--carta); color: var(--principale); font-family: var(--font-testo); }
  .doodle { position: absolute; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .anelli { color: var(--accento); stroke-width: 7; }
  .tratto { color: var(--principale); stroke-width: 3; }

  /* titolo enorme a sinistra su quattro righe, il prodotto che esce dal bordo sinistro e copre l'ultima */
  .titolo { position: absolute; left: 92px; top: 70px; font-family: var(--font-titoli); font-weight: 400; font-size: 205px; line-height: 0.92; }
  .titolo span { display: block; }
  .foto { position: absolute; left: -60px; top: 120px; width: 1160px; height: 1740px; object-fit: cover; display: block; mix-blend-mode: multiply; filter: brightness(1.1) contrast(1.05);
    -webkit-mask-image: radial-gradient(ellipse 46% 17% at 34% 52%, #000 70%, transparent 100%); mask-image: radial-gradient(ellipse 46% 17% at 34% 52%, #000 70%, transparent 100%); }
  .profilo { position: absolute; left: 0; width: 1080px; top: 1272px; text-align: center; font-size: 26px; text-decoration: underline; text-underline-offset: 5px; }

  .stella { width: 110px; height: 124px; left: 850px; top: 120px; transform: rotate(8deg); }
  .freccia { width: 150px; height: 160px; left: 820px; top: 650px; transform: rotate(60deg); }
  .anelli-giu { width: 340px; height: 500px; left: 780px; top: 850px; }
</style>
</head>
<body>
  <!-- titolo: 4 righe corte in corsivo, una o due parole per riga -->
  <h1 class="titolo"><span>Solo</span><span>cornetti</span><span>appena</span><span>sfornati</span></h1>

  <!-- foto: un prodotto grande di lato, su un fondo liscio chiaro, che esce dal bordo sinistro -->
  <img class="foto" src="../esempio/cornetto.jpg" alt="">

  <svg class="doodle tratto stella" viewBox="0 0 100 110"><path d="M52 4 C53 22 56 34 60 43 C72 44 84 44 96 47 C86 55 76 61 68 66 C72 79 76 92 78 104 C68 95 59 87 51 80 C42 87 32 95 21 102 C26 90 30 78 34 67 C24 60 14 54 5 48 C18 46 31 45 42 44 C46 32 49 18 52 4 Z"/></svg>
  <svg class="doodle tratto freccia" viewBox="0 0 100 150"><path d="M70 6 C40 14 30 44 52 54 C74 64 80 36 58 34 C30 32 18 80 34 140 M18 120 L34 142 L52 122"/></svg>
  <svg class="doodle anelli anelli-giu" viewBox="0 0 340 500"><path d="M20 30 C120 120 220 260 300 420 C316 452 290 466 272 436 C200 310 120 190 40 100 C20 76 44 60 66 84 C160 180 250 320 320 480 M60 300 C120 360 170 430 210 500"/></svg>

  <!-- profilo: il profilo social -->
  <p class="profilo">@fornobellavista</p>
</body>
</html>
