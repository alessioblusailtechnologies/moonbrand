<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #6B4126; --secondario: #D3A375; --accento: #E8BBA8; --sfondo: #F8F4EC; }
  :root { --font-titoli: 'Cormorant Garamond', serif; --font-testo: 'Montserrat', sans-serif; }
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 860px; object-fit: cover; object-position: 50% 45%; display: block; }

  /* il fondo pieno che sale a cupola larga sulla foto */
  .cupola { position: absolute; left: -260px; top: 628px; width: 1600px; height: 1200px; border-radius: 50%; background: var(--principale); }

  .forno { position: absolute; left: 495px; top: 712px; width: 90px; height: 100px; }
  .forno * { fill: none; stroke: var(--chiaro); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  .sopra { position: absolute; left: 140px; top: 850px; width: 800px; text-align: center; font-size: 25px; line-height: 40px; letter-spacing: 0.16em; text-transform: uppercase; }
  .titolo { position: absolute; left: 60px; top: 1010px; width: 960px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 96px; line-height: 104px; }

  .tratteggio { position: absolute; left: 30px; top: 1304px; width: 1020px; border-top: 2px dashed color-mix(in srgb, var(--chiaro) 80%, transparent); }
</style>
</head>
<body>
  <!-- foto: la vetrina, il banco o l'insegna, in alto; la parte bassa la copre la cupola -->
  <img class="foto" src="../esempio/vetrina.jpg" alt="">
  <div class="cupola"></div>

  <!-- forno: l'icona a filo del forno, resta così -->
  <svg class="forno" viewBox="0 0 90 100"><rect x="4" y="4" width="82" height="86" rx="5"/><line x1="4" y1="24" x2="86" y2="24"/><circle cx="17" cy="14" r="4"/><circle cx="31" cy="14" r="4"/><circle cx="45" cy="14" r="4"/><line x1="62" y1="14" x2="76" y2="14"/><rect x="16" y="36" width="58" height="42" rx="3"/><path d="M33 47c-4 4 4 8 0 12M45 47c-4 4 4 8 0 12M57 47c-4 4 4 8 0 12"/><line x1="16" y1="90" x2="16" y2="96"/><line x1="74" y1="90" x2="74" y2="96"/></svg>

  <!-- sopra: 4-7 parole in maiuscolo su 2 righe, cosa si aspetta -->
  <p class="sopra">Il conto alla rovescia<br>per il pane caldo</p>

  <!-- titolo: il conto alla rovescia, 2 righe di 12-18 caratteri con il numero -->
  <h1 class="titolo">Mancano 6 ore<br>all'apertura!</h1>

  <div class="tratteggio"></div>
</body>
</html>
