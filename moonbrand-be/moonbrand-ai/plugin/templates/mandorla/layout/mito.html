<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #6B4126; --secondario: #D3A375; --accento: #E8BBA8; --sfondo: #F8F4EC; }
  :root { --font-titoli: 'Cormorant Garamond', serif; --font-testo: 'Montserrat', sans-serif; }
  /* testo sull'accento: una sua versione scura se l'accento è chiaro, quasi bianca se è scuro */
  :root { --su-accento: oklch(from var(--accento) calc(0.3 + clamp(0, (0.62 - l) * 1000, 1) * 0.66) min(c * 0.6, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .etichetta { position: absolute; left: 314px; top: 127px; width: 452px; height: 93px; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--secondario) 22%, var(--sfondo)); border: 2px solid var(--principale); font-size: 26px; letter-spacing: 0.2em; text-transform: uppercase; }

  .titolo { position: absolute; left: 60px; top: 288px; width: 960px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 90px; line-height: 98px; }

  .fascia { position: absolute; left: 0; top: 646px; width: 1080px; height: 256px; background: var(--accento); color: var(--su-accento);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 27px; line-height: 44px; letter-spacing: 0.18em; text-transform: uppercase; }
  .fascia strong { font-weight: 700; }

  .foto { position: absolute; left: 0; top: 902px; width: 1080px; height: 448px; object-fit: cover; object-position: 50% 62%; display: block; }
</style>
</head>
<body>
  <!-- etichetta: la domanda della rubrica, 2-4 parole, nel riquadro con il filo -->
  <p class="etichetta">Mito o verità?</p>

  <!-- titolo: la credenza da smontare, 3 righe di 14-22 caratteri -->
  <h1 class="titolo">Il pane va mangiato<br>sempre il giorno<br>in cui è sfornato</h1>

  <!-- fascia: la risposta in una parola in grassetto, sotto una frase di 2 righe da 25-32 caratteri -->
  <div class="fascia">
    <strong>Mito</strong>
    <p>Il pane a lievito madre è ancora<br>più buono il giorno dopo</p>
  </div>

  <!-- foto: orizzontale a tutta larghezza in fondo, il prodotto da vicino -->
  <img class="foto" src="../esempio/cornetti.jpg" alt="">
</body>
</html>
