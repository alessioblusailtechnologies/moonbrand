<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Roboto:wght@400;700&family=Oswald:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #253A33; --secondario: #E4E1CE; --accento: #D8F0CE; --sfondo: #F8F8F8; }
  :root { --font-titoli: 'Libre Baskerville', serif; --font-testo: 'Roboto', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .firma { position: absolute; left: 46px; top: 88px; font-family: 'Oswald', sans-serif; font-size: 27px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; white-space: nowrap; }
  .asterisco { position: absolute; right: 26px; top: 70px; width: 78px; height: 78px; color: var(--principale); }

  .titolo { position: absolute; left: 40px; top: 340px; width: 1000px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 112px; line-height: 0.98; letter-spacing: -0.03em; }
  .titolo em { font-style: italic; }
  /* le foto dentro il titolo: capsule alte quanto le minuscole */
  .titolo img { display: inline-block; width: 190px; height: 84px; border-radius: 42px; object-fit: cover; vertical-align: -0.04em; margin: 0 0.04em; }

  .freccia { position: absolute; left: 40px; top: 1232px; width: 136px; height: 76px; color: var(--principale); }
  .invito { position: absolute; right: 34px; top: 1238px; font-family: var(--font-titoli); font-size: 48px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }
</style>
</head>
<body>
  <!-- logo: il nome del brand tra parentesi quadre, in maiuscolo stretto -->
  <p class="firma">[ <span class="logo">Studio Ardesia</span> ]</p>
  <svg class="asterisco" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="9"><path d="M40 2V78M2 40H78M13 13L67 67M67 13L13 67"/></svg>

  <!-- titolo: una frase di 12-16 parole centrata su 6 righe; due piccole foto a capsula tra le parole; la seconda frase in corsivo con <em> -->
  <h1 class="titolo">Il tuo brand <img src="../esempio/prato.jpg" alt=""> merita una strategia che funziona. <em>Costruiamola <img src="../esempio/vaso.jpg" alt=""> insieme.</em></h1>

  <svg class="freccia" viewBox="0 0 136 76" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="130" height="70" rx="35"/><path d="M30 38H104M86 21L104 38L86 55"/></svg>
  <!-- invito: 2-4 parole -->
  <p class="invito">Inizia da qui</p>
</body>
</html>
