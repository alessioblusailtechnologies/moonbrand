<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Roboto:wght@400;700&family=Oswald:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #253A33; --secondario: #E4E1CE; --accento: #D8F0CE; --sfondo: #F8F8F8; }
  :root { --font-titoli: 'Libre Baskerville', serif; --font-testo: 'Roboto', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 46px; top: 58px; width: 880px; font-family: var(--font-titoli); font-weight: 400; font-size: 146px; line-height: 0.88; letter-spacing: -0.035em; }
  .asterisco { position: absolute; right: 16px; top: 246px; width: 76px; height: 76px; color: var(--principale); }

  .freccia { position: absolute; left: 44px; top: 422px; width: 136px; height: 76px; color: var(--principale); }
  .sotto { position: absolute; left: 234px; top: 432px; font-family: var(--font-titoli); font-size: 48px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }

  .barra { position: absolute; bottom: 14px; width: 316px; }
  .barra .anno { position: absolute; left: -4px; bottom: calc(100% + 92px); font-family: 'Oswald', sans-serif; font-size: 29px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; white-space: nowrap; }
  .barra .valore { position: absolute; left: -4px; bottom: calc(100% + 22px); font-family: var(--font-titoli); font-size: 50px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }
  .b1 { left: 50px; height: 316px; background: var(--secondario); }
  .b2 { left: 394px; height: 474px; background: var(--accento); }
  .b3 { left: 739px; height: 632px; background: var(--principale); }
</style>
</head>
<body>
  <!-- titolo: 2 parole su due righe -->
  <h1 class="titolo">I nostri risultati</h1>
  <svg class="asterisco" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="9"><path d="M40 2V78M2 40H78M13 13L67 67M67 13L13 67"/></svg>

  <svg class="freccia" viewBox="0 0 136 76" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="130" height="70" rx="35"/><path d="M30 38H104M86 21L104 38L86 55"/></svg>
  <!-- sotto: 1-3 parole che dicono cosa sono i numeri -->
  <p class="sotto">In numeri</p>

  <!-- barre: tre periodi in crescita; etichetta di 1-2 parole e valore di 2-4 caratteri; le altezze seguono i valori -->
  <div class="barra b1"><p class="anno">Anno 1</p><p class="valore">12K</p></div>
  <div class="barra b2"><p class="anno">Anno 2</p><p class="valore">45K</p></div>
  <div class="barra b3"><p class="anno">Anno 3</p><p class="valore">130K</p></div>
</body>
</html>
