<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #253A33; --secondario: #E4E1CE; --accento: #D8F0CE; --sfondo: #F8F8F8; }
  :root { --font-titoli: 'Libre Baskerville', serif; --font-testo: 'Roboto', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .asterisco { position: absolute; left: 491px; top: 50px; width: 78px; height: 78px; color: var(--principale); }
  .titolo { position: absolute; left: 40px; top: 180px; width: 1000px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 118px; line-height: 0.97; letter-spacing: -0.035em; }
  .titolo em { display: block; font-style: italic; }
  .sotto { position: absolute; left: 40px; top: 488px; width: 1000px; text-align: center; font-family: var(--font-titoli); font-size: 36px; font-weight: 400; letter-spacing: -0.015em; }

  .ritratti { position: absolute; left: 22px; top: 650px; display: flex; gap: 20px; }
  .ritratti img { width: 326px; height: 456px; border-radius: 96px; object-fit: cover; display: block; }

  .freccia { position: absolute; left: 26px; top: 1224px; width: 136px; height: 76px; color: var(--principale); }
  .invito { position: absolute; right: 40px; top: 1230px; font-family: var(--font-titoli); font-size: 48px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }
</style>
</head>
<body>
  <svg class="asterisco" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="9"><path d="M40 2V78M2 40H78M13 13L67 67M67 13L13 67"/></svg>

  <!-- titolo: due righe; la prima 1-2 parole dritte, la seconda 2-3 parole in corsivo con <em> -->
  <h1 class="titolo">La nostra <em>squadra</em></h1>
  <!-- sotto: una frase di 4-6 parole -->
  <p class="sotto">Strategia e creatività allo stesso tavolo.</p>

  <!-- ritratti: tre persone in piedi su un fondo chiaro e pieno, dalla vita in su -->
  <div class="ritratti">
    <img src="../esempio/socio.jpg" alt="" style="object-position: 50% 30%">
    <img src="../esempio/socia.jpg" alt="" style="object-position: 50% 20%">
    <img src="../esempio/socia-2.jpg" alt="" style="object-position: 52% 40%">
  </div>

  <svg class="freccia" viewBox="0 0 136 76" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="130" height="70" rx="35"/><path d="M30 38H104M86 21L104 38L86 55"/></svg>
  <!-- invito: 2-4 parole -->
  <p class="invito">Conosciamoci</p>
</body>
</html>
