<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700&family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #5E2A1C; --secondario: #7F5943; --accento: #F3EFEA; --sfondo: #E9E1D6; }
  :root { --font-titoli: 'Lexend', sans-serif; --font-testo: 'Source Sans 3', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 0; width: 1080px; top: 192px; text-align: center; font-family: var(--font-titoli); font-weight: 700; font-size: 66px; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; }
  .foto { position: absolute; width: 338px; height: 322px; object-fit: cover; display: block; }
  .bottone { position: absolute; left: 338px; top: 1142px; width: 404px; height: 64px; border: 2.5px solid var(--principale); border-radius: 32px;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 27px; }
</style>
</head>
<body>
  <!-- titolo: 3-4 parole, il tema della raccolta -->
  <h1 class="titolo">Le nostre storie</h1>

  <!-- foto: quattro prodotti o momenti del forno, quasi quadrate, due chiare e due scure -->
  <img class="foto" style="left: 156px; top: 355px;" src="../esempio/biscotti-griglia.jpg" alt="">
  <img class="foto" style="left: 584px; top: 355px;" src="../esempio/waffle.jpg" alt="">
  <img class="foto" style="left: 156px; top: 761px;" src="../esempio/filone.jpg" alt="">
  <img class="foto" style="left: 584px; top: 761px;" src="../esempio/vetrina.jpg" alt="">

  <!-- bottone: 2-3 parole in minuscolo, l'invito -->
  <p class="bottone">scorri e leggi</p>
</body>
</html>
