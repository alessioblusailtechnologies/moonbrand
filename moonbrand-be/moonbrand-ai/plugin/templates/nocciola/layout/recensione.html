<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #5E2A1C; --secondario: #7F5943; --accento: #F3EFEA; --sfondo: #E9E1D6; }
  :root { --font-titoli: 'Pinyon Script', cursive; --font-testo: 'Source Sans 3', sans-serif; }
  /* il testo sul secondario: chiaro se il secondario è scuro, scuro se è chiaro, con la sua tinta */
  :root { --su-secondario: oklch(from var(--secondario) clamp(0.18, (0.66 - l) * 1000, 0.97) min(c, 0.012) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .scheda { position: absolute; left: 144px; top: 262px; width: 792px; height: 620px; border: 2px solid var(--principale); border-radius: 44px;
    background: color-mix(in oklch, var(--sfondo), white 60%); }
  .titolo { position: absolute; left: 144px; width: 792px; top: 312px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 66px; line-height: 1.1; white-space: nowrap; }
  .stelle { position: absolute; left: 144px; width: 792px; top: 420px; display: flex; justify-content: center; gap: 14px; }
  .stelle svg { width: 64px; height: 64px; fill: var(--principale); }
  .testo { position: absolute; left: 214px; width: 652px; top: 528px; text-align: center; font-size: 37px; line-height: 1.32; }
  .nome { position: absolute; left: 345px; top: 838px; width: 390px; height: 86px; border-radius: 43px; border: 2px solid var(--principale); background: var(--secondario); color: var(--su-secondario);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 32px; }
</style>
</head>
<body>
  <div class="scheda"></div>

  <!-- titolo: 2-3 parole scritte a mano -->
  <h1 class="titolo">La voce dei clienti</h1>

  <div class="stelle">
    <svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.7-5.6 5 1.7 7.4L12 17.6l-6.6 3.9 1.7-7.4-5.6-5 7.4-.7z"/></svg>
  </div>

  <!-- testo: le parole del cliente tra virgolette, 35-50 parole -->
  <p class="testo">&ldquo;Entri e senti subito il profumo del pane appena sfornato. Ho preso la crostata di stagione per il compleanno di mia madre e non ne è avanzata una fetta. Ora il sabato mattina passo sempre di qui.&rdquo;</p>

  <!-- nome: nome e iniziale del cognome -->
  <p class="nome">Giulia R.</p>
</body>
</html>
