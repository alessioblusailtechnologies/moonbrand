<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700&family=Gilda+Display&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #5E2A1C; --secondario: #7F5943; --accento: #F3EFEA; --sfondo: #E9E1D6; }
  :root { --font-titoli: 'Lexend', sans-serif; --font-testo: 'Source Sans 3', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 0; width: 1080px; top: 286px; text-align: center; font-family: var(--font-titoli); font-weight: 700; font-size: 74px; line-height: 1.1; text-transform: uppercase; white-space: nowrap; }
  .sottotitolo { position: absolute; left: 0; width: 1080px; top: 384px; text-align: center; font-family: 'Gilda Display', serif; font-size: 56px; line-height: 1.1; white-space: nowrap; }
  .voce { position: absolute; left: 228px; width: 624px; height: 88px; border: 2.5px solid var(--principale); border-radius: 44px;
    display: flex; align-items: center; justify-content: center; font-size: 31px; white-space: nowrap; }
  .profilo { position: absolute; left: 0; width: 1080px; top: 1118px; text-align: center; font-size: 29px; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <!-- titolo: 2 parole in maiuscolo, il tema -->
  <h1 class="titolo">Colazione lenta</h1>
  <!-- sottotitolo: 4-6 parole, il senso in una riga -->
  <p class="sottotitolo">un momento solo per te</p>

  <!-- voci: 3 consigli di 4-7 parole, uno per riquadro -->
  <p class="voce" style="top: 555px;">Siediti invece di mangiare in piedi</p>
  <p class="voce" style="top: 736px;">Scegli il cornetto ancora tiepido</p>
  <p class="voce" style="top: 917px;">Lascia il telefono in tasca</p>

  <!-- profilo: il profilo social del brand -->
  <p class="profilo logo">@fornobelcastro</p>
</body>
</html>
