<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #22201D; --secondario: #C4D8E1; --accento: #FDF955; --sfondo: #F9F9ED; }
  :root { --font-titoli: 'Newsreader', serif; --font-testo: 'Work Sans', sans-serif; }
  :root { --su-accento: oklch(from var(--accento) calc(clamp(0.24, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: #0E0D0C; color: #FFFFFF; font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 60%; display: block; filter: brightness(0.5) saturate(0.3); }
  .velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.55) 72%, rgba(0,0,0,0.92) 100%); }

  .testata { position: absolute; left: 108px; right: 108px; top: 38px; display: flex; justify-content: space-between; font-size: 24px; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; color: #FFFFFF; }

  .titolo { position: absolute; left: 50px; width: 980px; top: 372px; text-align: center; font-family: var(--font-titoli); font-style: italic; font-weight: 400; font-variation-settings: 'opsz' 72; color: #FFFFFF; }
  .piccolo { display: block; font-size: 84px; line-height: 1; letter-spacing: -0.02em; }
  .grande { display: block; margin-top: -6px; font-size: 136px; line-height: 1.02; letter-spacing: -0.03em; }

  .freccia { position: absolute; left: 488px; top: 850px; width: 110px; height: 262px; }
  .pillola { position: absolute; left: 270px; top: 1148px; width: 540px; padding: 22px 26px 20px; border-radius: 40px; background: var(--accento); color: var(--su-accento); border: 1.5px solid color-mix(in srgb, var(--principale) 70%, transparent);
    text-align: center; font-size: 24px; font-weight: 400; line-height: 1.22; letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
  <!-- foto: una persona vestita di scuro, seduta o accovacciata, in una stanza in penombra; il soggetto nella metà alta, il basso tranquillo -->
  <img class="foto" src="../esempio/seduta.jpg" alt="">
  <div class="velo"></div>

  <div class="testata">
    <!-- logo: il nome o l'handle del brand -->
    <span class="logo">@ottobrestudio</span>
    <!-- rubrica: una parola, il tema della serie -->
    <span>Metodo</span>
  </div>

  <h1 class="titolo">
    <!-- titolo-piccolo: l'attacco, 2-3 parole -->
    <span class="piccolo">come creiamo</span>
    <!-- titolo-grande: le parole che contano, 1-2 parole, al massimo 16 lettere -->
    <span class="grande">post che vendono</span>
  </h1>

  <svg class="freccia" viewBox="0 0 110 262" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 2 C 42 30, 12 78, 18 118 C 22 150, 70 160, 76 132 C 82 104, 40 104, 30 138 C 22 168, 34 214, 46 252"/>
    <path d="M30 238 L 46 254 L 56 232"/>
  </svg>

  <!-- invito: cosa trova chi scorre, 10-14 parole in maiuscolo -->
  <p class="pillola">Scorri e scopri i 3 passi che usiamo con ogni cliente</p>
</body>
</html>
