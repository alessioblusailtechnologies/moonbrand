<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #730F0F; --secondario: #FBE9A6; --accento: #EAE065; --sfondo: #B7CBE3; }
  :root { --font-titoli: 'Arimo', sans-serif; --font-testo: 'PT Sans', sans-serif; }
  /* Il bordo delle voci vuote è bianco sul fondo del modello; su un fondo quasi bianco diventa nero. */
  :root { --bordo: oklch(from var(--sfondo) calc(clamp(0, (0.88 - l) * 1000, 1)) 0 0); }
  :root { --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; color: var(--principale); font-family: var(--font-testo);
    background: var(--sfondo); }
  .griglia { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; color: color-mix(in srgb, var(--principale) 13%, transparent); }

  .social { position: absolute; left: 52px; right: 52px; display: flex; justify-content: space-between; font-size: 24px; }
  .social.su { top: 84px; }
  .social.giu { top: 1236px; }

  .titolo { position: absolute; left: 44px; top: 300px; width: 1010px; font-family: var(--font-titoli); font-weight: 700; font-size: 188px; line-height: 0.94; letter-spacing: -0.035em; text-transform: uppercase; }

  .servizi { position: absolute; left: 50px; top: 760px; width: 1000px; display: flex; flex-direction: column; gap: 26px; }
  .fila { display: flex; gap: 22px; }
  .servizio { height: 92px; padding: 0 46px; border-radius: 46px; display: flex; align-items: center; white-space: nowrap;
    font-family: var(--font-titoli); font-size: 33px; font-weight: 700; letter-spacing: -0.03em; text-transform: uppercase; }
  .pieno { background: var(--principale); color: #FFFFFF; }
  .vuoto { border: 3px solid var(--bordo); color: var(--principale); }
  .chiaro { background: var(--secondario); color: var(--su-secondario); }
</style>
</head>
<body>
  <svg class="griglia" viewBox="0 0 1080 1350"><defs><pattern id="g" x="120" y="30" width="241" height="241" patternUnits="userSpaceOnUse"><path d="M1.5 0 V241 M0 1.5 H241" stroke="currentColor" stroke-width="3" fill="none"/></pattern></defs><rect width="1080" height="1350" fill="url(#g)"/></svg>

  <!-- social: in alto e in basso, invito a seguire ai lati e il profilo al centro -->
  <div class="social su"><span>Segui per altri consigli</span><span>@studiogranata</span><span>Segui per altri consigli</span></div>

  <!-- titolo: due righe in maiuscolo, al massimo 8 lettere per riga -->
  <h1 class="titolo">I nostri<br>servizi</h1>

  <!-- servizi: tre file di due voci di 1-3 parole (al massimo 24 caratteri per fila); piena e vuota si alternano, una sola chiara -->
  <div class="servizi">
    <div class="fila"><p class="servizio pieno">Social media</p><p class="servizio vuoto">Pubblicità</p></div>
    <div class="fila"><p class="servizio vuoto">Branding</p><p class="servizio pieno">Grafica e siti web</p></div>
    <div class="fila"><p class="servizio chiaro">Gestione profili</p><p class="servizio vuoto">Foto e video</p></div>
  </div>

  <div class="social giu"><span>Segui per altri consigli</span><span>@studiogranata</span><span>Segui per altri consigli</span></div>
</body>
</html>
