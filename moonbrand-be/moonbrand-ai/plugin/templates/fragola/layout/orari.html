<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Archivo:wght@400;600&family=Noto+Serif+Display:wdth,wght@62.5..100,400&family=La+Belle+Aurore&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3A2216; --secondario: #8E4A26; --accento: #F862C0; --sfondo: #F3ECE0; }
  :root { --font-titoli: 'Young Serif', serif; --font-testo: 'Archivo', sans-serif; }
  :root { --carta: oklch(from var(--sfondo) max(l, 0.96) min(c, 0.02) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 50%; }

  /* lo scontrino: carta con i bordi dentellati in alto e in basso, appeso con una molletta */
  .scontrino { position: absolute; left: 245px; top: 238px; width: 595px; height: 910px; background: var(--carta);
    -webkit-mask: radial-gradient(circle at 50% 0, transparent 9px, #000 9.5px) 0 0 / 28px 50.1% repeat-x,
                  radial-gradient(circle at 50% 100%, transparent 9px, #000 9.5px) 0 100% / 28px 50.1% repeat-x; }
  .molletta { position: absolute; left: 487px; top: 132px; }

  .marchio { position: absolute; left: 245px; width: 595px; top: 278px; text-align: center; }
  .marchio svg { display: block; margin: 0 auto; fill: none; stroke: var(--accento); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .marchio .nome { font-family: 'Noto Serif Display', serif; font-stretch: 80%; font-size: 52px; line-height: 0.82; letter-spacing: -0.02em; }
  .marchio .sotto { display: inline-block; margin-top: 8px; padding: 2px 16px; border: 1.5px solid var(--principale); border-radius: 50%; font-family: 'La Belle Aurore', cursive; font-size: 20px; transform: rotate(-4deg); }
  .marchio .lato { position: absolute; top: 108px; font-family: 'La Belle Aurore', cursive; font-size: 15px; }

  .puntini { position: absolute; left: 245px; width: 595px; top: 494px; border-top: 3px dotted color-mix(in oklch, var(--principale) 70%, transparent); }

  .titolo { position: absolute; left: 245px; width: 595px; top: 552px; text-align: center; font-family: var(--font-titoli); font-size: 128px; line-height: 0.98; letter-spacing: -0.01em; color: var(--accento); }

  .orari { position: absolute; left: 320px; width: 450px; top: 880px; font-weight: 600; font-size: 38px; line-height: 1.2; letter-spacing: -0.03em; }
  .orari p { display: flex; justify-content: space-between; }
  .orari p + p { border-top: 3px solid var(--principale); }
  .visita { position: absolute; left: 245px; width: 595px; top: 1022px; text-align: center; font-size: 27px; line-height: 1.35; letter-spacing: -0.02em; }
  .visita b { font-weight: 600; }
</style>
</head>
<body>
  <!-- foto: il pane nel forno o sul banco, calda, con i pani ai lati dello scontrino -->
  <img class="foto" src="../esempio/forno.jpg" alt="">

  <div class="scontrino"></div>
  <!-- la molletta di metallo: un oggetto, resta grigia -->
  <svg class="molletta" width="110" height="130" viewBox="0 0 110 130">
    <path d="M38 64 C 30 30, 34 8, 55 8 C 76 8, 80 30, 72 64" fill="none" stroke="#9a9a9a" stroke-width="6"/>
    <path d="M38 64 C 30 30, 34 8, 55 8 C 76 8, 80 30, 72 64" fill="none" stroke="#e8e8e8" stroke-width="2"/>
    <circle cx="55" cy="22" r="8" fill="#2b2b2b"/>
    <path d="M8 76 L 102 76 L 96 122 L 14 122 Z" fill="#3a3a3a"/>
    <path d="M8 76 L 102 76 L 100 86 L 10 86 Z" fill="#6a6a6a"/>
    <path d="M30 64 L 80 64 L 82 78 L 28 78 Z" fill="#b5b5b5"/>
  </svg>

  <!-- marchio: il logo del forno sullo scontrino (disegno, nome, sottotitolo, anno ai lati) -->
  <div class="marchio logo">
    <svg width="98" height="56" viewBox="0 0 98 56"><path d="M6 46 C 4 30, 22 12, 49 10 C 76 12, 94 30, 92 46 C 84 50, 76 48, 70 44 C 58 52, 40 52, 28 44 C 22 48, 12 50, 6 46 Z"/><path d="M28 44 C 30 32, 34 20, 38 13"/><path d="M49 10 L 49 50"/><path d="M70 44 C 68 32, 64 20, 60 13"/></svg>
    <p class="nome">Forno<br>Ortensia</p>
    <p class="sotto">pane di quartiere</p>
    <span class="lato" style="left: 150px;">Dal</span><span class="lato" style="right: 140px;">1987</span>
  </div>

  <div class="puntini"></div>

  <!-- titolo: 2 parole su due righe -->
  <h1 class="titolo">Orari<br>del forno</h1>

  <!-- orari: due righe, giorni a sinistra e ore a destra, con un filetto in mezzo -->
  <div class="orari">
    <p><span>Lun-Sab</span><span>7-20</span></p>
    <p><span>Domenica</span><span>7-13</span></p>
  </div>

  <!-- visita: invito corto e indirizzo in grassetto -->
  <p class="visita">Vieni a trovarci in<br><b>Via Saragozza 41, Bologna</b></p>
</body>
</html>
