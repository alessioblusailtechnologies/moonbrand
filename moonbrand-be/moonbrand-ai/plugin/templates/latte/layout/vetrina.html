<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Prata&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2E2420; --secondario: #B98E6B; --accento: #5A2C1E; --sfondo: #FCF6F1; }
  :root { --font-titoli: 'Gloock', serif; --font-testo: 'Prata', serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 62%; }

  .sopra { position: absolute; left: 0; top: 120px; width: 1080px; text-align: center; font-size: 46px; letter-spacing: 0.12em; line-height: 1; }
  .titolo { position: absolute; left: 40px; top: 190px; width: 1000px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 92px; line-height: 1.05; letter-spacing: -0.005em; }

  .frecce { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
  .frecce path { fill: none; stroke: var(--principale); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .voce { position: absolute; font-size: 36px; line-height: 1.3; text-align: center; }
  .v1 { left: 760px; top: 438px; width: 260px; }
  .v2 { left: 10px; top: 580px; width: 260px; }
  .v3 { left: 60px; top: 1000px; width: 230px; }
  .v4 { left: 820px; top: 960px; width: 230px; }

  .sito { position: absolute; left: 0; top: 1250px; width: 1080px; text-align: center; font-size: 26px; letter-spacing: 0.16em; }
</style>
</head>
<body>
  <!-- foto: un dolce solo, di lato, su fondo chiaro e vuoto, con spazio sopra e ai lati per le voci -->
  <img class="foto" src="../esempio/tortino.jpg" width="1080" height="1350" alt="">

  <!-- sopra: 2-3 parole spaziate -->
  <p class="sopra">Oggi in vetrina</p>

  <!-- titolo: il nome del dolce, 2-4 parole su una riga -->
  <h1 class="titolo">Cupcake al pistacchio</h1>

  <!-- frecce: tracciate a mano dal dolce alle voci, restano -->
  <svg class="frecce" viewBox="0 0 1080 1350" aria-hidden="true">
    <path d="M520,470 C560,400 660,385 748,410"/>
    <path d="M730,396 L750,411 L728,424"/>
    <path d="M440,520 C380,440 210,440 150,560"/>
    <path d="M136,543 L149,563 L166,546"/>
    <path d="M300,880 C220,900 180,950 175,990"/>
    <path d="M160,972 L175,992 L190,972"/>
    <path d="M790,760 C880,770 930,840 935,945"/>
    <path d="M920,926 L935,948 L950,926"/>
  </svg>

  <!-- voce: un ingrediente per voce, 1-3 parole su due righe al massimo -->
  <p class="voce v1">Fragola</p>
  <p class="voce v2">Scaglie di<br>cioccolato</p>
  <p class="voce v3">Base alla<br>vaniglia</p>
  <p class="voce v4">Crema al<br>pistacchio</p>

  <!-- sito: indirizzo del sito, in minuscolo spaziato -->
  <p class="sito">www.fornomerlo.it</p>
</body>
</html>
