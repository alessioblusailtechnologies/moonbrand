<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wdth,wght@62.5..100,100..900&family=Archivo:wdth,wght@62..125,100..900&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --principale: #820A0B; --secondario: #E3E2DD; --accento: #F8E8D0; --sfondo: #F5F4F0; }
  :root { --font-titoli: 'Noto Serif', serif; --font-testo: 'Archivo', sans-serif; }
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --carta: oklch(from var(--secondario) max(l, 0.91) min(c, 0.035) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: #3A2214; color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 30% 70%; }

  .angolo { position: absolute; font-family: var(--font-testo); font-size: 19px; font-weight: 400; font-stretch: 80%; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1; }
  .giu { top: 1218px; }
  .sx { left: 112px; } .dx { right: 112px; }

  .scheda { position: absolute; left: 205px; top: 150px; width: 670px; height: 560px; background: var(--carta); border-radius: 6px; color: var(--principale); text-align: center; }
  .titolo { position: absolute; left: 0; top: 100px; width: 670px; font-family: var(--font-titoli); font-weight: 400; font-stretch: 70%; font-size: 82px; line-height: 0.84; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
  .parere { position: absolute; left: 140px; top: 275px; width: 390px; font-family: var(--font-testo); font-size: 20px; line-height: 1.25; text-align: justify; }
  .firma { position: absolute; left: 0; top: 410px; width: 670px; font-family: 'Pinyon Script', cursive; font-size: 62px; line-height: 1; color: color-mix(in srgb, var(--principale) 85%, var(--carta)); }
</style>
</head>
<body>
  <!-- foto: una foto vera di un dolce o del pane da vicino, la sfoglia o la crosta a tutto campo -->
  <img class="foto" src="../esempio/forno.jpg" alt="">

  <div class="scheda">
    <!-- titolo: 2 righe in maiuscolo di 6-10 caratteri -->
    <h1 class="titolo" data-max="600">Parole<br>dei clienti</h1>
    <!-- recensione: le parole vere di un cliente, 20-30 parole -->
    <p class="parere" lang="it">Il cornetto al pistacchio del sabato è diventato il rito di famiglia. Sempre caldo, sempre un sorriso al banco, e la crema arriva fino in fondo.</p>
    <!-- firma: nome e cognome del cliente, scritto a mano -->
    <p class="firma">Giulia Ferri</p>
  </div>

  <!-- angoli: solo in basso, due etichette brevi (1-3 parole) -->
  <p class="angolo giu sx">Dicono di noi</p>
  <p class="angolo giu dx">Vieni a trovarci</p>
  <script>
    // Con font del brand più larghi il titolo si rimpicciolisce finché ogni riga sta nella sua misura (data-max, in px).
    const adatta = () => {
      for (const el of document.querySelectorAll('[data-max]')) {
        const max = Number(el.dataset.max);
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        const larghezza = () => { const r = document.createRange(); r.selectNodeContents(el); return Math.max(0, ...[...r.getClientRects()].map((q) => q.width)); };
        while (larghezza() > max && size > 24) { size -= 2; el.style.fontSize = size + 'px'; }
      }
    };
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
