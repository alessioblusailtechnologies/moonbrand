<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wdth,wght@62.5..100,100..900&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root { --principale: #820A0B; --secondario: #E3E2DD; --accento: #F8E8D0; --sfondo: #F5F4F0; }
  :root { --font-titoli: 'Noto Serif', serif; --font-testo: 'Archivo', sans-serif; }
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --carta: oklch(from var(--secondario) max(l, 0.91) min(c, 0.035) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: #5A0A10; color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; filter: brightness(0.82); }

  .angolo { position: absolute; font-family: var(--font-testo); font-size: 19px; font-weight: 400; font-stretch: 80%; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1; }
  .su { top: 114px; } .giu { top: 1218px; }
  .sx { left: 112px; } .dx { right: 112px; }

  .scheda { position: absolute; left: 205px; top: 340px; width: 670px; height: 690px; background: var(--carta); border-radius: 6px; color: var(--principale); text-align: center; }
  .titolo { position: absolute; left: 0; top: 50px; width: 670px; font-family: var(--font-titoli); font-weight: 400; font-stretch: 70%; font-size: 76px; line-height: 0.84; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
  .scheda img { position: absolute; left: 115px; top: 200px; width: 440px; height: 330px; object-fit: contain; mix-blend-mode: multiply; }
  .riga { position: absolute; left: 0; top: 578px; width: 670px; font-family: var(--font-testo); font-size: 22px; font-weight: 400; line-height: 1.2; text-transform: uppercase; }
</style>
</head>
<body>
  <!-- foto: una foto vera dell'ingrediente da vicino (frutta, cacao, nocciole), a tutto campo -->
  <img class="foto" src="../esempio/lamponi.jpg" alt="">

  <!-- angoli: in alto il profilo e la data, in basso due etichette brevi (1-2 parole) -->
  <p class="angolo su sx">@fornogelsomino</p>
  <p class="angolo su dx">12 ottobre</p>

  <div class="scheda">
    <!-- titolo: il gusto o il prodotto, 2 righe di 8-12 caratteri in maiuscolo -->
    <h1 class="titolo" data-max="600">Sapore di<br>lampone</h1>
    <!-- foto: il dolce su fondo chiaro, scontornato o su un piatto bianco -->
    <img src="../esempio/cheesecake.jpg" alt="">
    <!-- riga: 2 righe di 20-30 caratteri, cosa è e come è fatto -->
    <p class="riga">Frutta vera, niente aromi<br>cheesecake fatta da noi</p>
  </div>

  <p class="angolo giu sx">Novità</p>
  <p class="angolo giu dx">Dal nostro banco</p>
  <script>
    // Con font del brand più larghi il titolo si rimpicciolisce finché ogni riga sta nella sua misura (data-max, in px).
    const adatta = () => {
      for (const el of document.querySelectorAll('[data-max]')) {
        const max = Number(el.dataset.max);
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        const larghezza = () => { const r = document.createRange(); r.selectNodeContents(el); return Math.max(0, ...[...r.getClientRects()].map((q) => q.width)); };
        while (larghezza() > max && size > 24) { size -= 2; el.style.fontSize = size + 'px'; }
      }
    };
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
