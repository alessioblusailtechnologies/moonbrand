<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wdth,wght@62.5..100,100..900&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root { --principale: #820A0B; --secondario: #E3E2DD; --accento: #F8E8D0; --sfondo: #F5F4F0; }
  :root { --font-titoli: 'Noto Serif', serif; --font-testo: 'Archivo', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .angolo { position: absolute; font-family: var(--font-testo); font-size: 19px; font-weight: 400; font-stretch: 80%; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1; }
  .su { top: 114px; } .giu { top: 1218px; }
  .sx { left: 112px; } .dx { right: 112px; }

  .polaroid { position: absolute; left: 300px; top: 236px; width: 480px; height: 520px; padding: 20px 20px 0; background: #FFFFFF; box-shadow: 0 1px 3px color-mix(in srgb, #000 12%, transparent); }
  .polaroid img { display: block; width: 440px; height: 400px; object-fit: cover; object-position: 50% 52%; }
  .didascalia { margin-top: 34px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-stretch: 75%; font-size: 25px; line-height: 1; text-transform: uppercase; }

  .titolo { position: absolute; left: 0; top: 742px; width: 1080px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-stretch: 70%; font-size: 150px; line-height: 0.84; letter-spacing: -0.015em; text-transform: uppercase; white-space: nowrap; }
</style>
</head>
<body>
  <!-- angoli: in alto il profilo e la data, in basso un invito e un'etichetta (1-3 parole) -->
  <p class="angolo su sx">@fornogelsomino</p>
  <p class="angolo su dx">12 ottobre</p>

  <div class="polaroid">
    <!-- foto: una foto vera della torta o del dolce da prenotare -->
    <img src="../esempio/crostata-fragole.jpg" alt="">
    <!-- didascalia: fino a quando, 3-5 parole -->
    <p class="didascalia">Si prenota fino al 25</p>
  </div>

  <!-- titolo: 2 righe in maiuscolo di 6-12 caratteri, che toccano il fondo della polaroid -->
  <h1 class="titolo" data-max="980">Prenotazioni<br>aperte</h1>

  <p class="angolo giu sx">Dai un'occhiata</p>
  <p class="angolo giu dx">Torte di ottobre</p>
  <script>
    // Con font del brand più larghi il titolo si rimpicciolisce finché ogni riga sta nella sua misura (data-max, in px).
    const adatta = () => {
      for (const el of document.querySelectorAll('[data-max]')) {
        const max = Number(el.dataset.max);
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        const larghezza = () => { const r = document.createRange(); r.selectNodeContents(el); return Math.max(0, ...[...r.getClientRects()].map((q) => q.width)); };
        while (larghezza() > max && size > 24) { size -= 2; el.style.fontSize = size + 'px'; }
      }
    };
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
