<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&family=Libre+Caslon+Condensed:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3B3130; --secondario: #7EC736; --accento: #F7CF3E; --sfondo: #FEFFDF; }
  :root { --font-titoli: 'Caslon Idee', 'Libre Caslon Condensed', serif; --font-testo: 'Hanken Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --ombra: color-mix(in srgb, var(--principale) 55%, transparent); --bordo-stella: color-mix(in srgb, var(--accento) 70%, black); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 18%, transparent); }
  .titolo { position: absolute; font-family: var(--font-titoli); font-weight: 800; letter-spacing: -0.075em; line-height: 0.86; color: var(--chiaro);
    text-shadow: 0 0 34px var(--ombra), 0 3px 10px color-mix(in srgb, var(--principale) 30%, transparent); white-space: nowrap; }
  .titolo span { display: block; }
  .piccolo { position: absolute; font-size: 44px; font-weight: 400; letter-spacing: -0.055em; line-height: 1.02; color: var(--chiaro);
    text-shadow: 0 0 18px var(--ombra); white-space: nowrap; }
  .corsivo { font-family: 'Pinyon Script', cursive; font-weight: 400; letter-spacing: 0; color: var(--chiaro); text-shadow: 0 0 24px var(--ombra); white-space: nowrap; }
  .stella { position: absolute; filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--principale) 40%, transparent)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 4; stroke-linejoin: round; }
  .stella.bianca path { fill: var(--chiaro); stroke: none; }
  .cursore { position: absolute; width: 52px; height: 70px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35)); }
  .cursore path { fill: #FFFFFF; stroke: #000000; stroke-width: 2.2; stroke-linejoin: round; }
</style>
<style>
  /* Libre Caslon Condensed è strettissimo: qui è ingrandito, così le misure sotto valgono per i font del brand, più larghi. */
  @font-face { font-family: 'Caslon Idee'; src: url(https://fonts.gstatic.com/s/librecasloncondensed/v3/flUURrasxYEyVwtcWIsbLunUPow3bHNaxvyEdaQClLYatgOE7C0S4xuvgM0.woff2) format('woff2'); size-adjust: 131%; }
  .foto { object-position: 50% 50%; }
  .titolo { left: 0; top: 150px; width: 1080px; text-align: center; font-size: 180px; font-weight: 400; letter-spacing: -0.04em; line-height: 1.31; }
  .titolo span + span { margin-top: 60px; }
  .piccolo.anno { left: 0; top: 1090px; width: 1080px; text-align: center; font-size: 54px; letter-spacing: 0; }
</style>
</head>
<body>
  <!-- foto: un dettaglio di oggetti dall'alto o di tre quarti (borsa, tazza, tessuti), toni chiari e caldi -->
  <img class="foto" src="../esempio/borsa.jpg" alt="">
  <div class="velo"></div>

  <!-- titolo: tre righe di una parola, centrate, al massimo 9 lettere per riga -->
  <h1 class="titolo"><span>Idee</span><span>contenuti</span><span>UGC</span></h1>
  <!-- anno: l'anno o un numero corto -->
  <p class="piccolo anno">2026</p>
  <svg class="stella" style="left:250px; top:250px; width:76px; height:76px; transform: rotate(-8deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg><svg class="stella" style="left:940px; top:560px; width:76px; height:76px; transform: rotate(10deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg><svg class="stella" style="left:222px; top:850px; width:76px; height:76px; transform: rotate(-4deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg>
</body>
</html>
