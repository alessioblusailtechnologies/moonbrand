<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3B3130; --secondario: #7EC736; --accento: #F7CF3E; --sfondo: #FEFFDF; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'Hanken Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --ombra: color-mix(in srgb, var(--principale) 55%, transparent); --bordo-stella: color-mix(in srgb, var(--accento) 70%, black); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 18%, transparent); }
  .titolo { position: absolute; font-family: var(--font-titoli); font-weight: 800; letter-spacing: -0.075em; line-height: 0.86; color: var(--chiaro);
    text-shadow: 0 0 34px var(--ombra), 0 3px 10px color-mix(in srgb, var(--principale) 30%, transparent); white-space: nowrap; }
  .titolo span { display: block; }
  .piccolo { position: absolute; font-size: 44px; font-weight: 400; letter-spacing: -0.055em; line-height: 1.02; color: var(--chiaro);
    text-shadow: 0 0 18px var(--ombra); white-space: nowrap; }
  .corsivo { font-family: 'Pinyon Script', cursive; font-weight: 400; letter-spacing: 0; color: var(--chiaro); text-shadow: 0 0 24px var(--ombra); white-space: nowrap; }
  .stella { position: absolute; filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--principale) 40%, transparent)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 4; stroke-linejoin: round; }
  .stella.bianca path { fill: var(--chiaro); stroke: none; }
  .cursore { position: absolute; width: 52px; height: 70px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35)); }
  .cursore path { fill: #FFFFFF; stroke: #000000; stroke-width: 2.2; stroke-linejoin: round; }
</style>
<style>
  .foto { object-position: 40% 50%; filter: blur(3px) brightness(0.86); transform: scale(1.03); }
  .piccolo.lato { right: 170px; top: 152px; text-align: right; font-size: 56px; line-height: 1.06; }
  .titolo { left: 0; top: 500px; width: 1080px; text-align: center; font-size: 140px; line-height: 0.9; }
  .selettore { position: absolute; left: 312px; top: 948px; height: 80px; display: flex; border-radius: 16px; background: var(--chiaro); color: var(--principale);
    box-shadow: 0 6px 18px color-mix(in srgb, var(--principale) 30%, transparent); }
  .selettore::before { content: ''; position: absolute; left: 216px; top: -18px; width: 36px; height: 20px; background: var(--chiaro); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .selettore p { display: flex; align-items: center; padding: 0 34px; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; }
  .selettore p + p { border-left: 2px solid color-mix(in srgb, var(--principale) 22%, transparent); }
</style>
</head>
<body>
  <!-- foto: una scrivania con uno schermo o un tablet e una bevanda, sfocata e scurita: fa da fondo -->
  <img class="foto" src="../esempio/tablet.jpg" alt="">
  <div class="velo"></div>

  <!-- lato: due righe corte in minuscolo, in alto a destra -->
  <p class="piccolo lato">niente più<br>tentativi</p>
  <!-- titolo: tre righe in minuscolo, la prima con il numero, al massimo 12 lettere per riga -->
  <h1 class="titolo"><span>3 controlli</span><span>prima di</span><span>pubblicare</span></h1>
  <!-- selettore: tre voci di una o due parole, i punti del titolo -->
  <div class="selettore"><p>il gancio</p><p>l'invito</p><p>l'obiettivo</p></div>
  <svg class="stella" style="left:184px; top:446px; width:82px; height:82px; transform: rotate(-6deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg><svg class="stella" style="left:880px; top:930px; width:86px; height:86px; transform: rotate(8deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg>
</body>
</html>
