<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3B3130; --secondario: #7EC736; --accento: #F7CF3E; --sfondo: #FEFFDF; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'Hanken Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --ombra: color-mix(in srgb, var(--principale) 55%, transparent); --bordo-stella: color-mix(in srgb, var(--accento) 70%, black); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 18%, transparent); }
  .titolo { position: absolute; font-family: var(--font-titoli); font-weight: 800; letter-spacing: -0.075em; line-height: 0.86; color: var(--chiaro);
    text-shadow: 0 0 34px var(--ombra), 0 3px 10px color-mix(in srgb, var(--principale) 30%, transparent); white-space: nowrap; }
  .titolo span { display: block; }
  .piccolo { position: absolute; font-size: 44px; font-weight: 400; letter-spacing: -0.055em; line-height: 1.02; color: var(--chiaro);
    text-shadow: 0 0 18px var(--ombra); white-space: nowrap; }
  .corsivo { font-family: 'Pinyon Script', cursive; font-weight: 400; letter-spacing: 0; color: var(--chiaro); text-shadow: 0 0 24px var(--ombra); white-space: nowrap; }
  .stella { position: absolute; filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--principale) 40%, transparent)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 4; stroke-linejoin: round; }
  .stella.bianca path { fill: var(--chiaro); stroke: none; }
  .cursore { position: absolute; width: 52px; height: 70px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35)); }
  .cursore path { fill: #FFFFFF; stroke: #000000; stroke-width: 2.2; stroke-linejoin: round; }
</style>
<style>
  .foto { object-position: 50% 30%; }
  .piccolo.etichetta { left: 0; top: 108px; width: 1080px; text-align: center; font-size: 48px; }
  .titolo { left: 0; top: 182px; width: 1080px; text-align: center; font-size: 168px; letter-spacing: -0.05em; text-transform: uppercase; }
  .piccolo.lato { right: 92px; top: 570px; font-size: 50px; line-height: 1; }
  .corsivo { position: absolute; left: 0; top: 900px; width: 1080px; text-align: center; font-size: 280px; line-height: 1; }
</style>
</head>
<body>
  <!-- foto: una persona in strada, figura intera o a mezzo busto, al centro; il titolo le passa dietro la testa -->
  <img class="foto" src="../esempio/strada.jpg" alt="">
  <div class="velo"></div>

  <!-- etichetta: 2-4 parole tra parentesi quadre -->
  <p class="piccolo etichetta">[ sprint di contenuti ]</p>
  <!-- titolo: una parola in maiuscolo, al massimo 9 lettere -->
  <h1 class="titolo">Contenuti</h1>
  <!-- lato: due righe corte tra parentesi quadre, a destra -->
  <p class="piccolo lato">[ timer acceso.<br>&nbsp;&nbsp;chat spente ]</p>
  <!-- corsivo: una parola scritta a mano, 6-9 lettere -->
  <p class="corsivo">in serie</p>
  <svg class="stella bianca" style="left:84px; top:92px; width:50px; height:50px; transform: rotate(0deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg><svg class="stella" style="left:944px; top:262px; width:58px; height:58px; transform: rotate(12deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg><svg class="stella bianca" style="left:940px; top:1040px; width:50px; height:50px; transform: rotate(0deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg><svg class="stella bianca" style="left:64px; top:1236px; width:50px; height:50px; transform: rotate(0deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg>
</body>
</html>
