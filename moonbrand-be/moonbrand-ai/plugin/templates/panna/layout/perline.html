<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3B3130; --secondario: #7EC736; --accento: #F7CF3E; --sfondo: #FEFFDF; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'Hanken Grotesk', sans-serif; }
  /* Testi chiari sulle foto: la tinta dello sfondo del brand, schiarita se il brand ha lo sfondo scuro. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  :root { --ombra: color-mix(in srgb, var(--principale) 55%, transparent); --bordo-stella: color-mix(in srgb, var(--accento) 70%, black); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 18%, transparent); }
  .titolo { position: absolute; font-family: var(--font-titoli); font-weight: 800; letter-spacing: -0.075em; line-height: 0.86; color: var(--chiaro);
    text-shadow: 0 0 34px var(--ombra), 0 3px 10px color-mix(in srgb, var(--principale) 30%, transparent); white-space: nowrap; }
  .titolo span { display: block; }
  .piccolo { position: absolute; font-size: 44px; font-weight: 400; letter-spacing: -0.055em; line-height: 1.02; color: var(--chiaro);
    text-shadow: 0 0 18px var(--ombra); white-space: nowrap; }
  .corsivo { font-family: 'Pinyon Script', cursive; font-weight: 400; letter-spacing: 0; color: var(--chiaro); text-shadow: 0 0 24px var(--ombra); white-space: nowrap; }
  .stella { position: absolute; filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--principale) 40%, transparent)); }
  .stella path { fill: var(--accento); stroke: var(--bordo-stella); stroke-width: 4; stroke-linejoin: round; }
  .stella.bianca path { fill: var(--chiaro); stroke: none; }
  .cursore { position: absolute; width: 52px; height: 70px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35)); }
  .cursore path { fill: #FFFFFF; stroke: #000000; stroke-width: 2.2; stroke-linejoin: round; }
</style>
<style>
  .foto { object-position: 50% 50%; }
  .piccolo.sopra { left: 150px; top: 196px; font-size: 48px; line-height: 0.98; }
  .titolo { left: 150px; top: 452px; width: 800px; font-size: 168px; line-height: 0.88; }
  .titolo span:nth-child(2) { text-align: center; }
  .titolo span:nth-child(3) { text-align: center; }
  .perline { position: absolute; left: 0; top: 890px; width: 1080px; display: flex; justify-content: center; gap: 4px; }
  .perline span { width: 78px; height: 78px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, var(--chiaro) 55%, color-mix(in srgb, var(--chiaro) 82%, black) 100%);
    color: var(--principale); font-family: var(--font-testo); font-size: 38px; font-weight: 700; box-shadow: 0 4px 10px color-mix(in srgb, var(--principale) 40%, transparent); }
  .cuore { position: absolute; left: 96px; top: 700px; width: 92px; height: 84px; transform: rotate(-14deg); filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--principale) 40%, transparent)); }
  .cuore path { fill: var(--accento); }
</style>
</head>
<body>
  <!-- foto: un dettaglio di mani al lavoro (un libro, un quaderno, una tastiera), da vicino -->
  <img class="foto" src="../esempio/libro.jpg" alt="">
  <div class="velo"></div>

  <!-- sopra: due righe corte in minuscolo, in alto a sinistra -->
  <p class="piccolo sopra">ti servono idee<br>più chiare</p>
  <!-- titolo: tre righe in minuscolo, la prima a sinistra, al massimo 9 lettere per riga -->
  <h1 class="titolo"><span>non ti</span><span>servono</span><span>più</span></h1>
  <!-- perline: una parola in maiuscolo, una lettera per perlina, al massimo 10 lettere -->
  <p class="perline"><span>C</span><span>O</span><span>N</span><span>T</span><span>E</span><span>N</span><span>U</span><span>T</span><span>I</span></p>
  <svg class="cuore" viewBox="0 0 92 84"><path d="M46 80 C 20 60, 2 44, 4 24 C 6 8, 30 0, 46 20 C 62 0, 86 8, 88 24 C 90 44, 72 60, 46 80 Z"/></svg>
  <svg class="stella" style="left:900px; top:600px; width:84px; height:84px; transform: rotate(14deg)" viewBox="0 0 100 100"><path d="M50 7 L62.5 36 L94 39 L70 60 L77.5 92 L50 75 L22.5 92 L30 60 L6 39 L37.5 36 Z"/></svg><svg class="cursore" style="left:870px; top:940px" viewBox="0 0 30 40"><path d="M3 2 L3 31 L10 24.5 L15 36 L20.5 33.5 L15.5 22.5 L25 22 Z"/></svg>
</body>
</html>
