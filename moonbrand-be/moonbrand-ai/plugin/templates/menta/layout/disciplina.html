<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2F3F39; --secondario: #B8D8BC; --accento: #7CB68E; --sfondo: #EEEEEE; }
  :root { --font-titoli: 'Poppins', sans-serif; --font-testo: 'Poppins', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: linear-gradient(180deg, color-mix(in srgb, var(--secondario) 65%, white) 0%, var(--accento) 100%); color: var(--principale); font-family: var(--font-testo); }

  .asta { position: absolute; width: 44px; transform: rotate(-12deg); transform-origin: 50% 0; }
  .asta.chiara { left: 392px; top: -40px; height: 810px; background: color-mix(in srgb, var(--secondario) 15%, white); box-shadow: 10px 8px 18px rgba(0,0,0,0.12); }
  .asta.scura { left: 552px; top: 930px; height: 500px; width: 50px; background: var(--principale); }

  .blocco { position: absolute; left: 40px; top: 710px; transform: rotate(-14deg); transform-origin: 0 0; }
  .sopra { font-family: var(--font-testo); font-size: 56px; font-weight: 400; letter-spacing: -0.02em; line-height: 1; margin: 0 0 18px 20px; }
  .parola { display: block; font-family: var(--font-titoli); font-weight: 800; text-transform: uppercase; font-size: 240px; line-height: 0.92; letter-spacing: -0.03em; white-space: nowrap; }
  .p1 { color: #FFFFFF; text-shadow: 0 10px 16px rgba(0,0,0,0.18); }
  .p2 { color: var(--principale); margin-left: 130px; }

  .social { position: absolute; left: 734px; top: 1112px; transform: rotate(-14deg); transform-origin: 0 0; }
  .canale { display: flex; align-items: center; gap: 22px; height: 76px; margin-left: 0; }
  .tondo { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none;
    background: radial-gradient(circle at 40% 35%, #FFFFFF, #E2E2E2); box-shadow: 0 5px 10px rgba(0,0,0,0.18); color: var(--principale); }
  .tondo svg { width: 28px; height: 28px; }
  .canale p { font-size: 30px; font-weight: 400; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="asta chiara"></div>
  <div class="asta scura"></div>

  <div class="blocco">
    <!-- sopra: la frase che porta alla parola, 2-3 parole -->
    <p class="sopra">La crescita chiede</p>
    <!-- parola: una parola lunga spezzata in due righe (5-6 lettere ciascuna), la prima bianca e la seconda scura -->
    <h1><span class="parola p1">Disci</span><span class="parola p2">plina</span></h1>
  </div>

  <!-- social: tre profili del brand, uno per riga, al massimo 16 caratteri -->
  <div class="social">
    <div class="canale" style="--i:0"><span class="tondo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3.5v11H4zM5.8 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 9h3.3v1.6c.5-.9 1.7-1.9 3.5-1.9 3.6 0 4.2 2.3 4.2 5.4V20h-3.5v-5.2c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8V20H10z"/></svg></span><p>@studiorbita</p></div>
    <div class="canale" style="--i:1"><span class="tondo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"/></svg></span><p>@studiorbita</p></div>
    <div class="canale" style="--i:2"><span class="tondo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21z"/></svg></span><p>@studiorbita</p></div>
  </div>
</body>
</html>
