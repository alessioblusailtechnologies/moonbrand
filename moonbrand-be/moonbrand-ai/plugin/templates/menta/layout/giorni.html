<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2F3F39; --secondario: #B8D8BC; --accento: #7CB68E; --sfondo: #EEEEEE; }
  :root { --font-titoli: 'Poppins', sans-serif; --font-testo: 'Poppins', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: linear-gradient(180deg, color-mix(in srgb, var(--principale) 78%, white) 0%, var(--principale) 100%); color: #FFFFFF; font-family: var(--font-testo); }

  .calendario { position: absolute; left: 335px; top: 440px; width: 410px; height: 400px; border-radius: 46px; text-align: center;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 70%, #E4E4E4 100%); box-shadow: 18px 26px 40px rgba(0,0,0,0.35); }
  .anelli { position: absolute; left: 66px; top: -40px; width: 278px; display: flex; justify-content: space-between; }
  .anelli i { display: block; width: 16px; height: 76px; border-radius: 8px; border: 4px solid #8A8F8D;
    background: linear-gradient(90deg, #5E6462, #D9DCDB 45%, #7C8280); }
  .cifra { padding-top: 34px; font-family: var(--font-titoli); font-size: 230px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;
    background: linear-gradient(180deg, var(--secondario), var(--accento)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .unita { margin-top: -6px; font-family: var(--font-titoli); font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; color: var(--principale); }

  .testo { position: absolute; left: 90px; top: 1010px; width: 900px; text-align: center; font-size: 50px; font-weight: 300; line-height: 1.4; letter-spacing: -0.02em; }
  .testo b { font-weight: 700; color: color-mix(in srgb, var(--accento) 70%, white); letter-spacing: -0.035em; }
</style>
</head>
<body>
  <div class="calendario">
    <div class="anelli"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <!-- cifra: il numero, 1-2 cifre -->
    <p class="cifra">6</p>
    <!-- unita: cosa conta, una parola (giorni, settimane, mesi) -->
    <p class="unita">giorni</p>
  </div>

  <!-- testo: la promessa in 3 righe centrate, 14-20 parole, la parte che conta in grassetto colorato con <b> -->
  <p class="testo">Rimettiamo in moto le tue campagne in <b>meno di una settimana</b> di lavoro mirato.</p>
</body>
</html>
