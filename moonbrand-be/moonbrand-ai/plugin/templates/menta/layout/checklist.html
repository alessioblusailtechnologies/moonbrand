<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2F3F39; --secondario: #B8D8BC; --accento: #7CB68E; --sfondo: #EEEEEE; }
  :root { --font-titoli: 'Poppins', sans-serif; --font-testo: 'Poppins', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: linear-gradient(180deg, color-mix(in srgb, var(--secondario) 65%, white) 0%, var(--accento) 100%); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 40px; top: 210px; width: 1000px; text-align: center; font-family: var(--font-titoli); letter-spacing: -0.03em; }
  .titolo span { display: block; font-size: 78px; font-weight: 400; line-height: 1.2; }
  .titolo b { display: block; font-size: 112px; font-weight: 700; line-height: 1.1; color: #FFFFFF; text-shadow: 0 6px 10px rgba(0,0,0,0.18); }

  .lista { position: absolute; left: 236px; top: 590px; width: 780px; padding: 34px 50px 34px 36px; border-radius: 40px; transform: rotate(-6deg);
    background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 60%, #EDEDED 100%); box-shadow: 0 30px 50px rgba(0,0,0,0.22); }
  .riga { display: flex; align-items: center; gap: 30px; height: 100px; border-bottom: 2px solid #DADADA; }
  .riga:last-child { border-bottom: 0; }
  .levetta { position: relative; width: 104px; height: 52px; border-radius: 26px; border: 3px solid var(--principale); flex: none; }
  .levetta::after { content: ''; position: absolute; right: 7px; top: 6px; width: 34px; height: 34px; border-radius: 50%; background: var(--principale); }
  .voce { flex: 1; font-size: 38px; font-weight: 400; letter-spacing: 0.01em; }
  .icona { width: 46px; height: 46px; flex: none; color: var(--principale); }
  .graffetta { position: absolute; left: 54px; top: -58px; width: 150px; height: 90px; transform: rotate(-24deg); color: #8E8E8E; }
</style>
</head>
<body>
  <!-- titolo: due righe; la prima sottile (2-3 parole), la seconda in grassetto bianco (1-2 parole, al massimo 14 caratteri) -->
  <h1 class="titolo"><span>La tua lista</span><b>SEO del mese</b></h1>

  <div class="lista">
    <svg class="graffetta" viewBox="0 0 150 90" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M40 70 L120 22 C 136 12, 150 34, 134 44 L 54 92 C 30 106, 10 72, 34 58 L 110 12"/></svg>
    <!-- voci: sei azioni da spuntare, 2-3 parole ciascuna, al massimo 20 caratteri; l'icona a destra dice l'azione -->
    <div class="riga"><span class="levetta"></span><span class="voce">Analisi del sito</span>
      <svg class="icona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M2 19h20"/><circle cx="12" cy="10" r="2.6"/><path d="M14 12l2 2"/></svg></div>
    <div class="riga"><span class="levetta"></span><span class="voce">Parole chiave</span>
      <svg class="icona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6.5" cy="13" r="3.5"/><circle cx="17.5" cy="13" r="3.5"/><path d="M10 13h4M3 11l1-3h4M21 11l-1-3h-4"/></svg></div>
    <div class="riga"><span class="levetta"></span><span class="voce">Pagine ottimizzate</span>
      <svg class="icona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></div>
    <div class="riga"><span class="levetta"></span><span class="voce">Nuovi contenuti</span>
      <svg class="icona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4M12 10v6M9 13h6"/></svg></div>
    <div class="riga"><span class="levetta"></span><span class="voce">Link in entrata</span>
      <svg class="icona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></div>
    <div class="riga"><span class="levetta"></span><span class="voce">Misura i risultati</span>
      <svg class="icona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M6 17v-5M10 17V7M14 17v-7M18 17V4"/></svg></div>
  </div>
</body>
</html>
