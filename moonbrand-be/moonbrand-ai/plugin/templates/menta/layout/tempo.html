<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2F3F39; --secondario: #B8D8BC; --accento: #7CB68E; --sfondo: #EEEEEE; }
  :root { --font-titoli: 'Poppins', sans-serif; --font-testo: 'Poppins', sans-serif; }
  :root { --principale-chiaro: color-mix(in srgb, var(--principale) 80%, white); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 50%, var(--sfondo) 100%); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 560px; top: -30px; width: 920px; height: 1380px; object-fit: cover; display: block; mix-blend-mode: multiply; }
  .tinta { position: absolute; left: 560px; top: 0; width: 520px; height: 660px; background: var(--accento); mix-blend-mode: color;
    -webkit-mask-image: linear-gradient(180deg, #000 75%, transparent); mask-image: linear-gradient(180deg, #000 75%, transparent); }

  .titolo { position: absolute; left: 112px; top: 560px; width: 640px; font-family: var(--font-titoli); letter-spacing: -0.04em; }
  .titolo b { display: inline-block; font-size: 112px; font-weight: 700; line-height: 1.1; padding-right: 8px;
    background: linear-gradient(180deg, var(--secondario), var(--accento)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .titolo span { display: block; font-size: 98px; font-weight: 300; line-height: 1.12; letter-spacing: -0.035em; }

  .bottone { position: absolute; left: 112px; top: 870px; height: 84px; padding: 0 58px; border-radius: 12px; display: flex; align-items: center;
    background: linear-gradient(180deg, var(--principale-chiaro), var(--principale)); color: #FFFFFF; font-size: 30px; font-weight: 500; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <!-- foto: un oggetto su fondo bianco, tagliato dal bordo destro (qui una clessidra); la sabbia prende il colore d'accento -->
  <img class="foto" src="../esempio/clessidra.jpg" alt="">
  <div class="tinta"></div>

  <!-- titolo: due righe; la prima in grassetto sfumato (1-2 parole, al massimo 10 caratteri), la seconda sottile (2 parole) -->
  <h1 class="titolo"><b>Il tempo</b><span>non aspetta</span></h1>

  <!-- bottone: l'invito, 2-3 parole -->
  <p class="bottone">Prenota ora</p>
</body>
</html>
