<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #000000; --secondario: #D9D9D9; --accento: #3A3A3A; --sfondo: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: 'Instrument Sans', sans-serif; }

  .tag { position: absolute; top: 56px; left: 74px; font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
  .logo.alto { position: absolute; top: 56px; right: 74px; font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
  .titolo { position: absolute; left: 0; top: 214px; width: 1080px; text-align: center; font-size: 152px; font-weight: 700; line-height: 1.04; letter-spacing: -0.055em; }
  .servizi { position: absolute; left: 110px; top: 652px; width: 860px; display: flex; flex-wrap: wrap; justify-content: center; gap: 28px 26px; }
  .servizio { height: 102px; padding: 0 44px; border: 4px solid currentColor; border-radius: 999px; font-size: 46px; font-weight: 500; line-height: 94px; letter-spacing: -0.035em; white-space: nowrap; }

  .pillole { position: absolute; left: 74px; bottom: 70px; display: flex; gap: 14px; }
  .pillola { height: 46px; padding: 0 18px; border: 2.5px solid currentColor; border-radius: 999px; font-size: 24px; font-weight: 600; line-height: 41px; letter-spacing: -0.01em; }
  .logo.basso { position: absolute; right: 74px; bottom: 80px; font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <!-- tag: un hashtag del tema, 1-3 parole attaccate -->
  <div class="tag">#Studio</div>
  <!-- logo: il nome o l'account del brand -->
  <div class="logo alto">@studiovarco</div>

  <!-- titolo: 2-3 parole su due righe -->
  <h1 class="titolo">I nostri<br>servizi</h1>

  <div class="servizi">
    <!-- servizi: da 5 a 8, una o due parole ciascuno -->
    <span class="servizio">Branding</span>
    <span class="servizio">Social media</span>
    <span class="servizio">Ads</span>
    <span class="servizio">Siti web</span>
    <span class="servizio">Grafica</span>
    <span class="servizio">Fotografia</span>
    <span class="servizio">Video</span>
  </div>

  <div class="pillole">
    <!-- pillole: l'argomento del post, una parola -->
    <span class="pillola">Servizi</span>
  </div>
  <!-- logo: il nome o l'account del brand, di nuovo in basso -->
  <div class="logo basso">@studiovarco</div>
</body>
</html>
