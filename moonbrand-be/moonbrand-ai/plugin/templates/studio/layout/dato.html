<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #000000; --secondario: #D9D9D9; --accento: #3A3A3A; --sfondo: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--sfondo); font-family: 'Instrument Sans', sans-serif; }

  .ovale { position: absolute; left: 324px; top: 76px; width: 432px; height: 126px; border: 4px solid currentColor; border-radius: 50%; font-size: 46px; font-weight: 400; line-height: 118px; text-align: center; letter-spacing: -0.03em; }
  .numero { position: absolute; left: 0; top: 280px; width: 1080px; text-align: center; font-size: 370px; font-weight: 700; line-height: 1; letter-spacing: -0.075em; text-indent: -0.075em; }
  .testo { position: absolute; left: 150px; top: 690px; width: 780px; text-align: center; font-size: 44px; font-weight: 400; line-height: 1.42; letter-spacing: -0.025em; }

  .pillole { position: absolute; left: 74px; bottom: 70px; display: flex; gap: 14px; }
  .pillola { height: 46px; padding: 0 18px; border: 2.5px solid currentColor; border-radius: 999px; font-size: 24px; font-weight: 600; line-height: 41px; letter-spacing: -0.01em; }
  .logo { position: absolute; right: 74px; bottom: 80px; font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <!-- ovale: l'attacco, 2-3 parole -->
  <div class="ovale">Lo sapevi?</div>
  <!-- numero: il dato, al massimo 4 caratteri (68%, 3x, 12k) -->
  <div class="numero">68%</div>
  <!-- testo: cosa vuol dire il numero, 12-20 parole, con la fonte se c'è -->
  <p class="testo">delle persone guarda il profilo Instagram di un negozio prima di entrarci per la prima volta.</p>

  <div class="pillole">
    <!-- pillole: 1-2 argomenti del post, una parola ciascuno -->
    <span class="pillola">Social</span>
    <span class="pillola">Dati</span>
  </div>
  <!-- logo: il nome o l'account del brand -->
  <div class="logo">@studiovarco</div>
</body>
</html>
