<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #000000; --secondario: #000000; --accento: #FFFFFF; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Instrument Sans', sans-serif; --font-testo: 'Instrument Sans', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .tag { color: var(--secondario); position: absolute; top: 56px; left: 74px; font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
  .logo { position: absolute; font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
  .logo.alto { top: 56px; right: 74px; }
  .logo.basso { bottom: 80px; right: 74px; }

  .titolo { position: absolute; left: 0; top: 196px; width: 1080px; text-align: center; font-family: var(--font-titoli); font-size: 168px; font-weight: 700; line-height: 146px; letter-spacing: -0.05em; white-space: nowrap; }
  .titolo span { display: block; }
  .titolo .eco::before { content: attr(data-testo); }

  .scheda { position: absolute; left: 290px; top: 340px; width: 500px; height: 620px; transform: rotate(-4deg); border-radius: 30px; box-shadow: -20px 14px 0 color-mix(in srgb, var(--secondario) 42%, var(--sfondo)); }
  .scheda .foto { width: 500px; height: 620px; object-fit: cover; object-position: 50% 30%; border-radius: 30px; display: block; filter: grayscale(1); }
  .nome { position: absolute; left: 668px; top: 838px; transform: rotate(-16deg); background: var(--accento); color: var(--principale); border-radius: 16px; padding: 6px 26px 10px; font-size: 54px; font-weight: 400; letter-spacing: -0.02em; box-shadow: 0 6px 14px color-mix(in srgb, var(--principale) 30%, transparent); }
  .cursore { position: absolute; left: 668px; top: 808px; width: 30px; height: 34px; transform: rotate(-16deg); }

  .pillole { position: absolute; left: 74px; bottom: 70px; display: flex; gap: 14px; }
  .pillola { height: 46px; padding: 0 18px; background: var(--accento); border: 2.5px solid currentColor; border-radius: 999px; font-size: 24px; font-weight: 600; line-height: 41px; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <!-- tag: un hashtag della rubrica, 1-3 parole attaccate -->
  <div class="tag">#DietroLeQuinte</div>
  <!-- logo: il nome o l'account del brand -->
  <div class="logo alto">@studiovarco</div>

  <!-- titolo: il nome della rubrica, 2 parole brevi (al massimo 10 lettere), uguale nella prima e nell'ultima riga e nei data-testo delle quattro righe in mezzo (l'eco, coperta dalla foto) -->
  <h1 class="titolo">
    <span>Due parole</span>
    <span class="eco" data-testo="Due parole"></span>
    <span class="eco" data-testo="Due parole"></span>
    <span class="eco" data-testo="Due parole"></span>
    <span class="eco" data-testo="Due parole"></span>
    <span>Due parole</span>
  </h1>

  <!-- foto: ritratto in bianco e nero della persona, a mezzo busto, sfondo scuro o neutro -->
  <div class="scheda"><img class="foto" src="../esempio/ritratto.jpg" alt=""></div>
  <svg class="cursore" viewBox="0 0 30 34"><path d="M0 0 L30 14 L16 18 L10 34 Z" fill="currentColor"/></svg>
  <!-- nome: il nome della persona, una parola -->
  <div class="nome">Marco</div>

  <div class="pillole">
    <!-- pillole: la rubrica, una parola -->
    <span class="pillola">Intervista</span>
  </div>
  <!-- logo: il nome o l'account del brand, di nuovo in basso -->
  <div class="logo basso">@studiovarco</div>
</body>
</html>
