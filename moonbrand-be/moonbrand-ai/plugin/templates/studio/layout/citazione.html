<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #000000; --secondario: #000000; --accento: #FFFFFF; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Instrument Sans', sans-serif; --font-testo: 'Instrument Sans', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .etichetta { position: absolute; top: 52px; left: 0; width: 1080px; text-align: center; }
  .etichetta span { display: inline-block; background: var(--accento); height: 46px; padding: 0 18px; border: 2.5px solid currentColor; border-radius: 999px; font-size: 24px; font-weight: 700; line-height: 41px; letter-spacing: -0.01em; }
  .virgolette { position: absolute; left: 0; top: 196px; width: 1080px; text-align: center; font-family: var(--font-titoli); color: var(--secondario); font-size: 150px; font-weight: 700; line-height: 1; height: 80px; letter-spacing: -0.08em; }
  .blocco { position: absolute; left: 0; top: 336px; width: 1080px; display: flex; flex-direction: column; align-items: center; }
  .frase { font-family: var(--font-titoli); width: 740px; min-width: min-content; text-align: center; font-size: 110px; font-weight: 700; line-height: 1.03; letter-spacing: -0.055em; }
  .autore { margin-top: 64px; text-align: center; font-size: 37px; font-style: italic; font-weight: 400; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <!-- etichetta: un hashtag della rubrica, 1-3 parole attaccate -->
  <div class="etichetta"><span>#FraseDelGiorno</span></div>

  <div class="virgolette">“</div>
  <!-- frase: la citazione, 10-14 parole, senza virgolette, su cinque o sei righe -->
  <div class="blocco">
  <p class="frase">I clienti più scontenti sono la tua più grande fonte di apprendimento.</p>
  <!-- autore: chi l'ha detta, nome e cognome -->
  <div class="autore">Bill Gates</div>
  </div>
</body>
</html>
