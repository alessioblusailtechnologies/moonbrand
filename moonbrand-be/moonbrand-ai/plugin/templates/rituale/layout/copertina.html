<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1E2C2E; --secondario: #73847F; --accento: #8A5566; --sfondo: #E5E8E3; }
  body { --filo: color-mix(in srgb, var(--principale) 55%, transparent); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { position: relative; overflow: hidden; background: var(--sfondo); color: var(--principale); font-family: 'Hanken Grotesk', sans-serif; }

  .logo { position: absolute; left: 88px; top: 76px; font-size: 28px; font-weight: 600; letter-spacing: 0.01em; }

  /* la foto: riquadro squadrato, spostato a destra e in alto */
  .foto { position: absolute; left: 400px; top: 150px; width: 608px; height: 760px; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* il filetto: prosegue il lato basso della foto fino al margine sinistro */
  .filetto { position: absolute; left: 88px; top: 909px; width: 312px; height: 1.5px; background: var(--filo); }
  .segno { position: absolute; left: 88px; top: 896px; width: 1.5px; height: 28px; background: var(--accento); }

  h1 { position: absolute; left: 88px; top: 962px; width: 760px; font-family: 'Newsreader', serif; font-weight: 300; font-size: 78px; line-height: 1.04; letter-spacing: -0.015em; font-variation-settings: 'opsz' 72; }
  .nota { position: absolute; left: 88px; top: 1196px; width: 640px; font-size: 26px; line-height: 1.4; }
  .luogo { position: absolute; right: 72px; top: 1196px; font-size: 26px; line-height: 1.4; text-align: right; color: color-mix(in srgb, var(--principale) 75%, var(--sfondo)); }
</style>
</head>
<body>
  <!-- logo: il nome del brand in testo, l'agente lo sostituisce con il file del logo -->
  <div class="logo">Studio Neve</div>

  <!-- foto: verticale 4:5, il trattamento o la cabina, luce naturale -->
  <div class="foto"><img src="../esempio/copertina.jpg" alt=""></div>

  <div class="filetto"></div>
  <div class="segno"></div>

  <!-- titolo: 4-8 parole, frase normale, mai in maiuscolo -->
  <h1>La pulizia del viso per la pelle che si arrossa</h1>

  <!-- nota: una riga concreta sul trattamento (durata, per chi), al massimo 2 righe -->
  <p class="nota">Sessanta minuti, senza vapore caldo né estrattori.</p>

  <!-- luogo: indirizzo o quartiere del centro, oppure togli -->
  <p class="luogo">Via Moretto 12<br>Brescia</p>
</body>
</html>
