<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1E2C2E; --secondario: #73847F; --accento: #8A5566; --sfondo: #E5E8E3; }
  body { --filo: color-mix(in srgb, var(--principale) 55%, transparent); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { position: relative; overflow: hidden; background: var(--sfondo); color: var(--principale); font-family: 'Hanken Grotesk', sans-serif; }

  .logo { position: absolute; left: 88px; top: 76px; font-size: 28px; font-weight: 600; letter-spacing: 0.01em; }

  /* le due foto, stessa misura e stessa linea di base: spostate a sinistra, il margine destro resta più largo */
  .foto { position: absolute; top: 200px; width: 440px; height: 550px; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prima { left: 88px; }
  .dopo { left: 544px; }

  /* il filetto: la linea di base delle foto, prosegue fino al margine destro */
  .filetto { position: absolute; left: 88px; top: 774px; width: 920px; height: 1.5px; background: var(--filo); }
  .segno { position: absolute; left: 544px; top: 761px; width: 1.5px; height: 28px; background: var(--accento); }

  .didascalia { position: absolute; top: 797px; font-size: 26px; line-height: 1.35; }
  .didascalia.a { left: 88px; }
  .didascalia.b { left: 544px; }

  .fondo { position: absolute; left: 88px; bottom: 80px; width: 760px; }
  h1 { width: 680px; font-family: 'Newsreader', serif; font-weight: 300; font-size: 64px; line-height: 1.06; letter-spacing: -0.012em; font-variation-settings: 'opsz' 72; }
  .nota { margin-top: 36px; font-size: 26px; line-height: 1.42; }
</style>
</head>
<body>
  <!-- logo: il nome del brand in testo, l'agente lo sostituisce con il file del logo -->
  <div class="logo">Studio Neve</div>

  <!-- foto prima: stesso soggetto, stessa inquadratura e stessa luce della foto dopo, verticale 4:5 -->
  <div class="foto prima"><img src="../esempio/prima.jpg" alt=""></div>
  <!-- foto dopo: la stessa zona dopo il trattamento, senza filtri -->
  <div class="foto dopo"><img src="../esempio/dopo.jpg" alt=""></div>

  <div class="filetto"></div>
  <div class="segno"></div>

  <!-- didascalie: quando è stata fatta ciascuna foto, una o due righe brevi -->
  <p class="didascalia a">Prima, a settembre</p>
  <p class="didascalia b">Dopo quattro sedute</p>

  <div class="fondo">
  <!-- titolo: 4-9 parole, il risultato detto in modo semplice -->
  <h1>Sei settimane per calmare il rossore</h1>

  <!-- nota: il trattamento, quante sedute, ogni quanto; al massimo 3 righe -->
  <p class="nota">Peeling all'acido mandelico, una seduta ogni dieci giorni. Le due foto hanno la stessa luce e nessun ritocco.</p>
  </div>
</body>
</html>
