<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #BE1B2C; --secondario: #F2EEE2; --accento: #CA1B2C; --sfondo: #F2D6D2; }
  :root { --font-titoli: 'Cormorant Garamond', serif; --font-testo: 'Montserrat', sans-serif; }
  /* il testo chiaro sul fondo principale: la tinta dello sfondo schiarita */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 0; width: 1080px; top: 36px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 196px; line-height: 0.86em; letter-spacing: -0.02em; }
  .titolo span { display: block; white-space: nowrap; }
  .testo { position: absolute; left: 190px; width: 700px; top: 432px; text-align: center; font-size: 24px; font-weight: 600; line-height: 1.32; }
  .logo { position: absolute; left: 50%; top: 588px; transform: translateX(-50%); padding: 11px 30px; border: 2px solid var(--chiaro); border-radius: 14px; font-size: 24px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
  .arco { position: absolute; left: 280px; top: 700px; width: 540px; height: 700px; border-radius: 270px 270px 0 0; overflow: hidden; border: 4px solid var(--chiaro); border-bottom: 0; }
  .arco img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }
</style>
</head>
<body>
  <!-- titolo: 2 righe, la rubrica (prima riga 9-11 lettere, seconda più corta) -->
  <h1 class="titolo" data-max="1000"><span>Ingrediente</span><span>del mese</span></h1>

  <!-- testo: 30-40 parole sull'ingrediente, da dove viene e dove lo usate -->
  <p class="testo">Il cioccolato fondente al 70% arriva da una piccola torrefazione di Modica. Lo sciogliamo piano ogni mattina per le crostate, i cornetti e la cioccolata calda del sabato.</p>

  <!-- logo: il nome del brand nell'etichetta sotto il testo -->
  <div class="logo">Forno Rosa</div>

  <!-- foto: l'ingrediente in lavorazione, nell'arco che esce dal fondo -->
  <div class="arco"><img src="../esempio/cioccolato-pentolino.jpg" alt=""></div>
  <script>
    // Con font del brand più larghi il titolo si rimpicciolisce finché ogni riga sta nella sua misura (data-max, in px
    // lungo la riga; data-verticale per il titolo ruotato). Interlinea in em, così le righe restano vicine.
    const adatta = () => {
      for (const el of document.querySelectorAll('[data-max]')) {
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        const misura = () => {
          const righe = [];
          const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
          for (let node = walker.nextNode(); node; node = walker.nextNode()) {
            const range = document.createRange();
            range.selectNodeContents(node);
            for (const r of range.getClientRects()) righe.push(el.dataset.verticale !== undefined ? r.height : r.width);
          }
          return Math.max(0, ...righe);
        };
        while (misura() > Number(el.dataset.max) && size > 40) { size -= 2; el.style.fontSize = `${size}px`; }
      }
    };
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
