<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #BE1B2C; --secondario: #F2EEE2; --accento: #CA1B2C; --sfondo: #F2D6D2; }
  :root { --font-titoli: 'Cormorant Garamond', serif; --font-testo: 'Montserrat', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; }
  /* il manifesto è un foglio di carta vero: colore fisso, stropicciato */
  .foglio { position: absolute; left: 204px; top: 300px; width: 680px; height: 900px; background: #EEEDEB; overflow: hidden; }
  .foglio svg { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; opacity: 0.55; }
  .nastro { position: absolute; left: 303px; top: 224px; width: 324px; height: 116px; background: rgb(214 190 150 / 0.88); transform: rotate(-1.5deg); }
  .fiocco { position: absolute; left: 480px; top: 237px; width: 280px; height: 56px; background: var(--accento); transform: rotate(40deg); clip-path: polygon(0 8%, 100% 0, 97% 50%, 100% 100%, 2% 92%, 4% 50%); }
  .etichetta { position: absolute; left: 0; width: 680px; top: 70px; text-align: center; font-size: 24px; font-weight: 700; color: var(--accento); text-transform: uppercase; letter-spacing: 0.02em; }
  .titolo { position: absolute; left: 0; width: 680px; top: 130px; text-align: center; font-family: var(--font-titoli); font-weight: 500; font-size: 176px; line-height: 168px; letter-spacing: -0.02em; text-transform: uppercase; }
  .titolo span { display: block; white-space: nowrap; }
  .orari { position: absolute; left: 92px; width: 496px; top: 744px; font-size: 24px; font-weight: 700; color: var(--accento); text-transform: uppercase; }
  .orari p { display: flex; justify-content: space-between; line-height: 1; }
  .orari hr { border: 0; height: 3px; background: var(--accento); margin: 14px 0 16px; }
</style>
</head>
<body>
  <!-- foto: un prodotto da vicino che riempie tutto, molti pezzi uguali -->
  <img class="foto" src="../esempio/girelle.jpg" alt="">

  <div class="foglio">
    <svg aria-hidden="true"><filter id="pieghe"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="4" seed="3"/><feDiffuseLighting lighting-color="#fff" surfaceScale="3"><feDistantLight azimuth="225" elevation="52"/></feDiffuseLighting></filter><rect width="100%" height="100%" filter="url(#pieghe)"/></svg>
    <!-- etichetta: 2-3 parole sopra il titolo -->
    <p class="etichetta">Tutti i giorni</p>
    <!-- titolo: 3 righe di una parola, la notizia -->
    <h1 class="titolo"><span>Ora</span><span>siamo</span><span>aperti</span></h1>
    <!-- orari: due righe, giorno a sinistra e ora a destra, separate dal filetto -->
    <div class="orari"><p><span>Apriamo</span><span>7:00</span></p><hr><p><span>Chiudiamo</span><span>20:30</span></p></div>
  </div>
  <div class="nastro"></div>
  <div class="fiocco"></div>
</body>
</html>
