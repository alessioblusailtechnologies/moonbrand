<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Alegreya:ital,wght@0,800;1,400&family=League+Spartan:wght@400&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2B1009; --secondario: #5B3621; --accento: #D9D0C1; --sfondo: #FFF7EC; }
  :root { --font-titoli: 'Pinyon Script', cursive; --font-testo: 'Alegreya', serif; }
  /* il chiaro sulla foto: la tinta dello sfondo schiarita, leggibile anche con uno sfondo scuro */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }
  .mano { font-family: 'Nothing You Could Do', cursive; }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 40%; display: block; }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 34%, transparent); }

  .angolo { position: absolute; top: 58px; font-weight: 800; font-size: 25px; line-height: 1.05; text-transform: uppercase; }
  .angolo.sx { left: 56px; }
  .angolo.dx { right: 56px; text-align: right; }

  .titolo { position: absolute; left: 0; top: 150px; width: 1080px; font-family: var(--font-titoli); font-weight: 400; font-size: 170px; line-height: 0.95; text-align: center; }
  .titolo span { display: block; }
  .titolo span:first-child { margin-left: 120px; }
  .titolo span:last-child { margin-left: 260px; }

  .calendario { position: absolute; left: -251px; top: 520px; width: 1656px; height: 560px; transform: rotate(-4deg); transform-origin: 578px 0; }
  .calendario .riga { position: absolute; left: 0; right: 0; height: 4px; background: var(--chiaro); }
  .calendario .col { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--chiaro); }
  .giorno { position: absolute; top: 34px; width: 552px; text-align: center; font-family: 'League Spartan', sans-serif; font-size: 36px; letter-spacing: 0.06em; text-transform: uppercase; }
  .numero { position: absolute; top: 180px; width: 552px; text-align: center; font-size: 200px; line-height: 1; }
  .cerchio { position: absolute; left: 708px; top: 150px; width: 300px; height: 280px; overflow: visible; }
  .evviva { position: absolute; left: 945px; top: 410px; font-size: 40px; transform: rotate(-14deg); white-space: nowrap; }

  .testo { position: absolute; left: 130px; width: 820px; top: 1128px; text-align: center; font-style: italic; font-size: 31px; line-height: 1.3; }
  .sito { position: absolute; left: 0; width: 1080px; top: 1278px; text-align: center; font-style: italic; font-size: 27px; }
</style>
</head>
<body>
  <!-- foto: verticale, prodotti e mani dall'alto su un fondo chiaro; viene scurita da un velo del principale -->
  <img class="foto" src="../esempio/baguette.jpg" alt="">
  <div class="velo"></div>

  <!-- logo: il nome del brand su due righe, in alto a sinistra -->
  <p class="angolo sx logo">Pasticceria<br>Bruna</p>
  <!-- luogo: la città e l'anno di apertura, in alto a destra -->
  <p class="angolo dx">Bari<br>dal 2015</p>

  <!-- titolo: in corsivo calligrafico, due righe di 1-2 parole, sfalsate -->
  <h1 class="titolo"><span>Segna</span><span>la data!!</span></h1>

  <!-- calendario: tre giorni di fila, quello dell'evento al centro e cerchiato -->
  <div class="calendario">
    <div class="riga" style="top: 0;"></div>
    <div class="riga" style="top: 118px;"></div>
    <div class="riga" style="top: 556px;"></div>
    <div class="col" style="left: 550px;"></div>
    <div class="col" style="left: 1102px;"></div>
    <span class="giorno" style="left: 0; text-align: right; padding-right: 44px;">Sabato</span>
    <span class="giorno" style="left: 552px;">Domenica</span>
    <span class="giorno" style="left: 1104px; text-align: left; padding-left: 34px;">Lunedì</span>
    <span class="numero mano" style="left: 0; text-align: right; padding-right: 70px;">4</span>
    <span class="numero mano" style="left: 552px;">5</span>
    <span class="numero mano" style="left: 1104px; text-align: left; padding-left: 60px;">6</span>
    <svg class="cerchio" viewBox="0 0 300 280"><path d="M150 12 C 240 8, 292 70, 288 140 C 284 214, 220 270, 146 268 C 64 266, 10 206, 12 138 C 14 70, 70 18, 162 16 M138 30 C 222 22, 278 84, 272 146 C 266 210, 206 256, 140 254 C 74 252, 26 200, 30 140 C 34 80, 84 34, 170 28" fill="none" stroke="var(--chiaro)" stroke-width="4" stroke-linecap="round"/></svg>
    <!-- giorno: 2-3 parole scritte a mano accanto al cerchio -->
    <span class="evviva mano">è festa!!</span>
  </div>

  <!-- testo: l'annuncio dell'evento, 30-40 parole -->
  <p class="testo">Segnatevi la data: domenica 5 ottobre festeggiamo dieci anni di forno. Pane caldo, assaggi per tutti e una torta grande così. Tutti i dettagli nei prossimi giorni!</p>

  <!-- sito: il sito del brand -->
  <p class="sito">pasticceriabruna.it</p>
</body>
</html>
