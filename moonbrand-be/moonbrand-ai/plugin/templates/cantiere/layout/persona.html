<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #22302B; --secondario: #7D8A83; --accento: #2D54C8; --sfondo: #E8E7E1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: 'Archivo', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 24px; line-height: 1.35; }

  .foto { position: absolute; left: 0; top: 0; width: 650px; height: 1350px; object-fit: cover; object-position: 38% 50%; display: block; }
  .nome { position: absolute; left: 696px; top: 60px; width: 330px; font-size: 92px; font-weight: 800; font-stretch: 68%; line-height: 0.92; }
  .ruolo { position: absolute; left: 700px; top: 260px; width: 320px; }
  .testo { position: absolute; left: 700px; top: 560px; width: 320px; font-size: 32px; line-height: 1.32; }
  .tavolo { position: absolute; left: 700px; top: 1010px; width: 320px; }
  .logo { position: absolute; left: 700px; bottom: 52px; font-size: 30px; font-weight: 700; font-stretch: 90%; }
</style>
</head>
<body>
  <!-- foto: la persona al lavoro, non in posa, verticale -->
  <img class="foto" src="../esempio/persona.jpg" alt="">

  <!-- nome: nome e cognome, uno per riga -->
  <h2 class="nome">Chiara<br>Lisi</h2>
  <!-- ruolo: mestiere e da quando, 4-8 parole -->
  <p class="ruolo mono">Grafica, nello studio dal 2019</p>

  <!-- testo: cosa fa e un dettaglio vero del suo modo di lavorare, 2 frasi, 18-30 parole -->
  <p class="testo">Disegna le etichette a matita prima di aprire il computer. Le ultime tre del frantoio sono sue.</p>

  <!-- tavolo: su cosa lavora adesso, 6-12 parole -->
  <p class="tavolo mono">Questa settimana: la carta da pacchi del Forno Sforza</p>

  <!-- logo: il nome del brand -->
  <div class="logo">Studio Rovo</div>
</body>
</html>
