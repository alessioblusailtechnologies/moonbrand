<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #22302B; --secondario: #7D8A83; --accento: #2D54C8; --sfondo: #E8E7E1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: 'Archivo', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 24px; line-height: 1.35; }

  .foto { position: absolute; left: 0; top: 0; width: 912px; height: 780px; object-fit: cover; object-position: 55% 50%; display: block; }
  .didascalia { position: absolute; left: 64px; width: 700px; top: 802px; }
  .titolo { position: absolute; left: 60px; top: 900px; width: 440px; font-size: 68px; font-weight: 800; font-stretch: 72%; line-height: 0.98; }
  .testo { position: absolute; left: 560px; top: 908px; width: 456px; font-size: 30px; line-height: 1.38; font-weight: 400; }
  .logo { position: absolute; left: 64px; bottom: 52px; font-size: 30px; font-weight: 700; font-stretch: 90%; }
  .passo { position: absolute; right: 64px; top: 60px; }
</style>
</head>
<body>
  <!-- foto: il passaggio del lavoro ripreso da vicino (mani, bozze, strumenti, uno schermo vero), orizzontale -->
  <img class="foto" src="../esempio/matita.jpg" alt="">

  <!-- didascalia: cosa si vede nella foto, in modo tecnico, 5-12 parole -->
  <p class="didascalia mono">Seconda prova di stampa, carta uso mano 120 g</p>

  <!-- titolo: il passaggio, 3-6 parole -->
  <h2 class="titolo">Le bozze si correggono su carta</h2>

  <!-- testo: cosa si fa e perché, 2-3 frasi, 25-45 parole -->
  <p class="testo">Lo schermo perdona tutto. Stampiamo ogni versione in scala vera e la leggiamo a un metro, come la vedrà chi passa davanti allo scaffale. Il corpo del testo è salito da 7 a 9 punti.</p>

  <!-- logo: il nome del brand -->
  <div class="logo">Studio Rovo</div>
  <!-- la posizione nel carosello, nella forma N/totale -->
  <div class="passo mono">2/6</div>
</body>
</html>
