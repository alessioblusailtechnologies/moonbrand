<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #22302B; --secondario: #7D8A83; --accento: #2D54C8; --sfondo: #E8E7E1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: 'Archivo', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 24px; line-height: 1.35; }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 880px; object-fit: cover; object-position: 50% 55%; display: block; }
  .didascalia { position: absolute; left: 64px; right: 64px; top: 904px; display: flex; justify-content: space-between; gap: 40px; }
  .titolo { position: absolute; left: 60px; top: 992px; width: 960px; font-size: 96px; font-weight: 800; font-stretch: 72%; line-height: 0.95; letter-spacing: -0.01em; }
  .logo { position: absolute; left: 64px; bottom: 52px; font-size: 30px; font-weight: 700; font-stretch: 90%; }
  .scorri { position: absolute; right: 64px; bottom: 54px; }
</style>
</head>
<body>
  <!-- foto: il lavoro vero in grande (tavolo con le bozze, set, progetto stampato, schermo vero fotografato), orizzontale o quadrata -->
  <img class="foto" src="../esempio/tavolo.jpg" alt="">

  <div class="didascalia mono">
    <!-- didascalia sinistra: cliente e luogo, 2-5 parole -->
    <span>Frantoio Ruggi, Andria</span>
    <!-- didascalia destra: cosa e quando, 3-6 parole -->
    <span>etichetta e sito, marzo 2026</span>
  </div>

  <!-- titolo: il progetto o il metodo del carosello, 6-10 parole, frase normale senza punto finale -->
  <h1 class="titolo">Rifare l’etichetta di un olio che vendeva già bene</h1>

  <!-- logo: il nome del brand -->
  <div class="logo">Studio Rovo</div>
  <!-- quante slide ha il carosello, nella forma 1/N -->
  <div class="scorri mono">1/6</div>
</body>
</html>
