<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #141414; --secondario: #EF007A; --accento: #DEFE14; --sfondo: #FFFEF1; }
  :root { --font-titoli: 'League Spartan', sans-serif; --font-testo: 'Roboto Mono', monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .logo { position: absolute; left: 128px; top: 108px; font-size: 40px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }

  .sigla { position: absolute; left: 106px; top: 236px; font-family: var(--font-titoli); font-weight: 700; font-size: 300px; line-height: 1; letter-spacing: -0.04em; text-transform: uppercase; white-space: nowrap; }
  .nota { position: absolute; left: 642px; top: 326px; font-size: 40px; line-height: 42px; letter-spacing: 0.04em; text-transform: uppercase; }

  .fascia { position: absolute; left: 107px; top: 580px; width: 870px; padding: 34px 0 22px 8px; background: var(--accento); color: var(--principale);
    font-family: var(--font-titoli); font-weight: 700; font-size: 178px; line-height: 0.84; letter-spacing: -0.035em; text-transform: uppercase; }
  .fascia span { display: block; white-space: nowrap; }

  .posti { position: absolute; left: 107px; top: 1036px; font-size: 68px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  .temi { position: absolute; left: 86px; top: 1214px; font-size: 27px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; word-spacing: 0.9em; }
</style>
</head>
<body>
  <!-- logo: il nome del brand con il trattino basso del cursore -->
  <p class="logo">Nodo Studio_</p>

  <!-- sigla: il periodo in 2-3 caratteri (Q1, T4, '27) -->
  <p class="sigla">Q1</p>
  <!-- nota: tre righe brevi, al massimo 13 caratteri ciascuna -->
  <p class="nota">Posti<br>limitati nel<br>trimestre</p>

  <!-- fascia: l'annuncio in due righe di una parola, al massimo 7 lettere -->
  <h1 class="fascia"><span>Agenda</span><span>aperta</span></h1>

  <!-- posti: quanti ne restano, 3-4 parole, al massimo 16 caratteri -->
  <p class="posti">Ultimi 4 posti</p>

  <!-- temi: tre servizi con le barre davanti, attaccati in una parola -->
  <p class="temi">//SitiWeb //Identità //Contenuti</p>
</body>
</html>
