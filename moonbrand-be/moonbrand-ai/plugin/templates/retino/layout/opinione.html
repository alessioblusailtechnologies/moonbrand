<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #141414; --secondario: #EF007A; --accento: #DEFE14; --sfondo: #FFFEF1; }
  :root { --font-titoli: 'League Spartan', sans-serif; --font-testo: 'Roboto Mono', monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  /* Retino: foto in grigio + griglia di punti, poi il contrasto li fa diventare punti netti come una stampa a retino. */
  .retino { position: absolute; left: 737px; top: 115px; width: 343px; height: 1125px; overflow: hidden; background: #FFFFFF; filter: contrast(8); mix-blend-mode: multiply; opacity: 0.78; }
  .retino img { display: block; width: 343px; height: 1125px; object-fit: cover; object-position: 50% 50%; filter: grayscale(1) brightness(1.45) contrast(1.05) blur(1px); }
  .retino::after { content: ''; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: radial-gradient(circle closest-side, #808080 0%, #9F9F9F 50%, #CFCFCF 70%, #FFFFFF 80%) 0 0 / 8px 8px; mix-blend-mode: multiply; }

  .etichetta { position: absolute; left: 57px; top: 110px; height: 100px; padding: 0 26px; display: flex; align-items: center; border: 2px solid var(--principale);
    font-size: 38px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }

  .titolo { position: absolute; left: 56px; top: 392px; font-family: var(--font-titoli); font-weight: 700; font-size: 148px; line-height: 0.79; letter-spacing: -0.03em; text-transform: uppercase; }
  .titolo span { display: block; white-space: nowrap; }
  .titolo .evidenza { position: relative; width: 870px; margin-top: 44px; margin-left: -2px; padding: 34px 0 16px 4px; background: var(--accento); color: var(--principale); }

  .bottone { position: absolute; left: 62px; top: 1145px; height: 100px; padding: 0 36px; display: flex; align-items: center; background: var(--principale); color: var(--sfondo);
    font-size: 38px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
</style>
</head>
<body>
  <!-- foto: una persona a figura intera su un fondo chiaro, in posa (braccia alzate); diventa una striscia verticale a retino -->
  <div class="retino"><img src="../esempio/braccia.jpg" alt=""></div>

  <!-- etichetta: con le due barre davanti, 2-3 parole -->
  <p class="etichetta">//Opinione scomoda</p>

  <!-- titolo: tre righe brevi (al massimo 8 lettere) e l'ultima parola nella fascia, al massimo 7 lettere col punto -->
  <h1 class="titolo"><span>Bello</span><span>non vuol</span><span>dire</span><span class="evidenza">utile.</span></h1>

  <!-- bottone: la risposta, 2-4 parole col punto -->
  <p class="bottone">La strategia sì.</p>
</body>
</html>
