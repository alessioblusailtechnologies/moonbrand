<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3E2116; --secondario: #7B4325; --accento: #A8673E; --sfondo: #F6ECE3; }
  :root { --font-titoli: 'Cormorant Garamond', serif; --font-testo: 'Josefin Sans', sans-serif; }
  /* Testo chiaro sul bottone: la tinta dello sfondo schiarita. */
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 0; top: 110px; width: 1080px; text-align: center; font-family: var(--font-titoli); text-transform: uppercase; line-height: 1; }
  .titolo span { display: block; white-space: nowrap; }
  .titolo .uno { font-weight: 500; font-size: 112px; letter-spacing: 0.06em; }
  .titolo .due { font-weight: 700; font-size: 134px; letter-spacing: 0.04em; margin-top: 14px; }

  .fiore { position: absolute; left: 880px; top: 120px; width: 110px; height: 110px; }
  .fiore path { fill: none; stroke: var(--accento); stroke-width: 2.5; stroke-linecap: round; opacity: 0.75; }

  .foto { position: absolute; left: 0; top: 420px; width: 1080px; height: 640px; object-fit: cover; object-position: 50% 55%; display: block; }

  .bollino { position: absolute; left: 760px; top: 410px; width: 290px; height: 290px; border-radius: 50%; background: var(--sfondo); border: 3px solid var(--accento);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .bollino::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 1.5px dotted var(--accento); }
  .bollino span { display: block; line-height: 1.1; }
  .bollino .su, .bollino .giu { font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase; }
  .bollino .num { font-family: var(--font-titoli); font-weight: 600; font-size: 80px; line-height: 1; margin: 0 0 4px; }

  .riga { position: absolute; left: 0; top: 1110px; width: 1080px; text-align: center; font-size: 40px; letter-spacing: 0.1em; text-transform: uppercase; }
  .bottone { position: absolute; left: 380px; top: 1186px; width: 320px; height: 76px; border-radius: 38px; background: var(--secondario); color: var(--chiaro);
    display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
  <!-- titolo: 2 righe in maiuscolo, la seconda più pesante; 6-9 caratteri ciascuna -->
  <h1 class="titolo"><span class="uno">Sconto</span><span class="due">d'autunno</span></h1>

  <svg class="fiore" viewBox="0 0 110 110"><path d="M55 95V50M55 50c-8-14-6-28 0-36 6 8 8 22 0 36zM55 50c-14-4-22-14-24-26 12 0 22 10 24 26zM55 50c14-4 22-14 24-26-12 0-22 10-24 26zM55 72c-10-2-18-8-20-16 8 0 16 6 20 16z"/></svg>

  <!-- foto: una fila di dolci, a tutta larghezza -->
  <img class="foto" src="../esempio/pasticcini.jpg" alt="">

  <!-- bollino: lo sconto, «fino al», la percentuale e «in meno» -->
  <div class="bollino"><span class="su">Fino al</span><span class="num">30%</span><span class="giu">in meno</span></div>

  <!-- riga: fino a quando vale, 3-4 parole -->
  <p class="riga">Solo fino a domenica</p>
  <!-- bottone: l'invito, 2 parole -->
  <p class="bottone">Passa ora</p>
</body>
</html>
