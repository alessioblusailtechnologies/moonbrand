<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Josefin+Sans:wght@400;600&family=Ephesis&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3E2116; --secondario: #7B4325; --accento: #A8673E; --sfondo: #F6ECE3; }
  :root { --font-titoli: 'Cormorant Garamond', serif; --font-testo: 'Josefin Sans', sans-serif; }
  /* Corsivo a pennello: dettaglio fisso del template. Testi sul fondo scuro: la tinta dello sfondo schiarita. */
  :root { --corsivo: 'Ephesis', cursive; --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 0; top: 116px; width: 1080px; text-align: center; font-family: var(--font-titoli); font-weight: 500; font-size: 92px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  .corsivo { position: absolute; left: 0; top: 220px; width: 1080px; text-align: center; font-family: var(--corsivo); font-size: 136px; line-height: 1; white-space: nowrap; }

  .foto { position: absolute; left: 150px; top: 430px; width: 780px; height: 640px; object-fit: cover; object-position: 50% 45%;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 66%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 66%, transparent 100%); }

  .rametto { position: absolute; width: 150px; height: 150px; }
  .rametto path { fill: none; stroke: var(--accento); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .rametto.sx { left: 92px; top: 470px; }
  .rametto.dx { left: 846px; top: 450px; transform: scaleX(-1); }
  .rametto.giu { left: 104px; top: 880px; width: 110px; height: 110px; opacity: 0.6; }
  .cuore { position: absolute; width: 46px; height: 42px; }
  .cuore path { fill: var(--chiaro); }
  .cuore.sx { left: 150px; top: 740px; }
  .cuore.dx { left: 884px; top: 740px; }

  .invito { position: absolute; left: 0; top: 1176px; width: 1080px; text-align: center; font-size: 42px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
  <!-- titolo: il servizio in maiuscolo, 2-3 parole, una riga -->
  <h1 class="titolo">Torte su misura</h1>
  <!-- corsivo: a chi o a cosa serve, 3-4 parole a mano -->
  <p class="corsivo">per ogni occasione</p>

  <!-- foto: una torta intera su fondo scuro, al centro, che sfuma nel fondo -->
  <img class="foto" src="../esempio/torta-fiori.jpg" alt="">

  <svg class="rametto sx" viewBox="0 0 150 150"><path d="M20 130C50 100 90 60 130 22M48 102c-16-2-28-12-30-26 14 0 26 10 30 26zM48 102c2-16 12-28 26-30 0 14-10 26-26 30zM78 72c-16-2-28-12-30-26 14 0 26 10 30 26zM78 72c2-16 12-28 26-30 0 14-10 26-26 30zM106 44c-12-2-20-10-22-20 10 0 20 8 22 20z"/></svg>
  <svg class="rametto dx" viewBox="0 0 150 150"><path d="M20 130C50 100 90 60 130 22M48 102c-16-2-28-12-30-26 14 0 26 10 30 26zM48 102c2-16 12-28 26-30 0 14-10 26-26 30zM78 72c-16-2-28-12-30-26 14 0 26 10 30 26zM78 72c2-16 12-28 26-30 0 14-10 26-26 30zM106 44c-12-2-20-10-22-20 10 0 20 8 22 20z"/></svg>
  <svg class="rametto giu" viewBox="0 0 150 150"><path d="M30 140C60 110 90 70 110 20M58 108c-14-4-22-14-22-26 12 2 22 12 22 26zM80 72c12-10 26-12 36-6-8 10-22 12-36 6z"/></svg>
  <svg class="cuore sx" viewBox="0 0 24 22"><path d="M12 21.3 10.3 19.8C4.2 14.3 0 10.6 0 6.1 0 2.6 2.7 0 6.2 0c2 0 3.9.9 5.8 3 1.9-2.1 3.8-3 5.8-3C21.3 0 24 2.6 24 6.1c0 4.5-4.2 8.2-10.3 13.7z"/></svg>
  <svg class="cuore dx" viewBox="0 0 24 22"><path d="M12 21.3 10.3 19.8C4.2 14.3 0 10.6 0 6.1 0 2.6 2.7 0 6.2 0c2 0 3.9.9 5.8 3 1.9-2.1 3.8-3 5.8-3C21.3 0 24 2.6 24 6.1c0 4.5-4.2 8.2-10.3 13.7z"/></svg>

  <!-- invito: 2-3 parole in maiuscolo -->
  <p class="invito">Prenota la tua</p>
</body>
</html>
