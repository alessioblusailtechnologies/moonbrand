<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Josefin+Sans:wght@400;600&family=Ephesis&display=swap" rel="stylesheet">
<style>
  :root { --principale: #3E2116; --secondario: #7B4325; --accento: #A8673E; --sfondo: #F6ECE3; }
  :root { --font-titoli: 'Cormorant Garamond', serif; --font-testo: 'Josefin Sans', sans-serif; }
  /* Corsivo a pennello: dettaglio fisso del template. Testi chiari sulla fascia: la tinta dello sfondo schiarita. */
  :root { --corsivo: 'Ephesis', cursive; --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  /* Foto in una grande foglia inclinata che esce a destra */
  .foglia { position: absolute; left: 600px; top: 250px; width: 900px; height: 1060px; border-radius: 50%; overflow: hidden; transform: rotate(32deg); z-index: 2; }
  .foglia img { position: absolute; left: -40px; top: 60px; width: 980px; height: 940px; object-fit: cover; object-position: 50% 30%; transform: rotate(-32deg); }

  .corsivo { position: absolute; left: 150px; top: 150px; font-family: var(--corsivo); font-size: 190px; line-height: 1; color: var(--accento); white-space: nowrap; }
  .titolo { position: absolute; left: 96px; top: 350px; z-index: 1; font-family: var(--font-titoli); font-weight: 500; font-size: 136px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; }

  .timbro { position: absolute; left: 150px; top: 580px; width: 270px; height: 270px; border-radius: 50%; border: 3px solid var(--accento); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timbro::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--accento) 70%, transparent); }
  .timbro .num { font-family: var(--font-titoli); font-weight: 600; font-size: 84px; line-height: 0.9; }
  .timbro .sotto { font-size: 34px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; }

  .schizzo { position: absolute; left: 150px; top: 900px; width: 120px; height: 90px; }
  .schizzo path { fill: none; stroke: var(--accento); stroke-width: 3; stroke-linecap: round; opacity: 0.7; }

  .fascia { position: absolute; left: 70px; top: 1070px; z-index: 3; width: 940px; height: 200px; background: var(--secondario); border-radius: 26px 70px 30px 60px / 40px 30px 60px 40px; }
  .riga { position: absolute; z-index: 4; left: 70px; width: 940px; text-align: center; text-transform: uppercase; color: var(--chiaro); }
  .riga.prima { top: 1118px; font-size: 44px; font-weight: 600; letter-spacing: 0.08em; }
  .riga.seconda { top: 1186px; font-size: 32px; font-weight: 400; letter-spacing: 0.14em; }
</style>
</head>
<body>
  <!-- foto: un dolce da vicino, su fondo scuro, nella foglia che esce a destra -->
  <div class="foglia"><img src="../esempio/cupcake.jpg" alt=""></div>

  <!-- corsivo: una parola a mano sopra il titolo, 6-8 lettere -->
  <p class="corsivo">Offerta</p>
  <!-- titolo: una parola in maiuscolo, 7-8 lettere -->
  <h1 class="titolo">Speciale</h1>

  <!-- timbro: lo sconto, un numero e una parola -->
  <div class="timbro"><span class="num">20%</span><span class="sotto">in meno</span></div>

  <svg class="schizzo" viewBox="0 0 120 90"><path d="M30 70c-14-10-22-20-18-30 4-9 15-7 18 1 4-8 15-10 18-1 4 10-5 20-18 30zM78 52c-9-6-14-13-11-19 2-6 9-5 11 1 3-6 10-7 12-1 2 6-3 13-12 19z"/></svg>

  <div class="fascia"></div>
  <!-- riga: fino a quando vale, 3-4 parole -->
  <p class="riga prima">Solo questa settimana</p>
  <!-- riga: l'invito, 2 parole -->
  <p class="riga seconda">Ordina ora</p>
</body>
</html>
