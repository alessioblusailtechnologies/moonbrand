<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1A1A1A; --secondario: #1A1A1A; --accento: #9A75E6; --sfondo: #F4F4F4; }
  :root { --font-titoli: 'Host Grotesk', sans-serif; --font-testo: 'Host Grotesk', sans-serif; }
  :root { --su-accento: color-mix(in oklab, oklch(from var(--accento) calc(clamp(0, (0.6 - l) * 1000, 1)) 0 0) 88%, var(--accento));
    --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.6 - l) * 1000, 1)) 0 0);
    --corsivo: 'Newsreader', serif; --mono: 'IBM Plex Mono', monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }
  .testata { position: absolute; left: 48px; right: 48px; top: 40px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 20px; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; z-index: 3; }
  .stella { display: block; color: var(--accento); }

  body { background: var(--accento); color: var(--su-accento); }
  .titolo { position: absolute; left: 56px; top: 150px; width: 980px; font-family: var(--font-titoli); font-weight: 400; font-size: 108px; line-height: 1.02; letter-spacing: -0.05em; }
  .dato { position: absolute; left: 50px; bottom: 112px; display: flex; align-items: flex-end; }
  .cifra { font-family: var(--font-titoli); font-weight: 400; font-size: 560px; line-height: 0.74; letter-spacing: -0.06em; }
  .unita { margin-left: 14px; font-family: var(--font-titoli); font-size: 128px; line-height: 0.74; letter-spacing: -0.05em; }
  .spiega { margin-left: 40px; width: 380px; font-size: 46px; line-height: 1.04; letter-spacing: -0.045em; }

</style>
</head>
<body>
  <div class="testata">
    <!-- logo: il nome del brand, in alto a sinistra -->
    <span class="logo">Nodo Studio</span>
    <!-- serie: il nome della rubrica e il numero, 2-4 parole -->
    <span>Quaderni di marca 6</span>
  </div>

  <!-- titolo: il fatto, 9-13 parole -->
  <h1 class="titolo">Molti siti perdono chi li visita in meno di dieci secondi</h1>
  <div class="dato">
    <!-- cifra: 1-2 caratteri -->
    <p class="cifra">8</p>
    <!-- unita: 1-4 lettere -->
    <p class="unita">sec</p>
    <!-- spiega: cosa misura, 8-12 parole -->
    <p class="spiega">è il tempo medio prima che qualcuno se ne vada.</p>
  </div>
</body>
</html>
