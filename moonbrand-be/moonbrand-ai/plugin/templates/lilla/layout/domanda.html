<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --principale: #1A1A1A; --secondario: #1A1A1A; --accento: #9A75E6; --sfondo: #F4F4F4; }
  :root { --font-titoli: 'Host Grotesk', sans-serif; --font-testo: 'Host Grotesk', sans-serif; }
  :root { --su-accento: color-mix(in oklab, oklch(from var(--accento) calc(clamp(0, (0.6 - l) * 1000, 1)) 0 0) 88%, var(--accento));
    --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.6 - l) * 1000, 1)) 0 0);
    --corsivo: 'Newsreader', serif; --mono: 'IBM Plex Mono', monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }
  .testata { position: absolute; left: 48px; right: 48px; top: 40px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 20px; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; z-index: 3; }
  .stella { display: block; color: var(--accento); }

  .colonna { position: absolute; left: 56px; top: 196px; width: 920px; display: flex; flex-direction: column; align-items: flex-start; }
  .titolo { margin-left: 8px; font-family: var(--font-titoli); font-weight: 400; font-size: 106px; line-height: 1.04; letter-spacing: -0.05em; }
  .invito { margin-top: 56px; height: 84px; padding: 0 46px 4px; display: flex; align-items: center; border-radius: 42px; background: var(--accento); color: var(--su-accento); font-size: 44px; letter-spacing: -0.05em; white-space: nowrap; }
  .sotto { margin: 112px 0 0 8px; width: 300px; font-size: 32px; line-height: 1.08; letter-spacing: -0.045em; }
  .stella { position: absolute; left: 842px; top: 1098px; width: 150px; height: 150px; }

</style>
</head>
<body>
  <div class="testata">
    <!-- logo: il nome del brand, in alto a sinistra -->
    <span class="logo">Nodo Studio</span>
    <!-- serie: il nome della rubrica e il numero, 2-4 parole -->
    <span>Quaderni di marca 6</span>
  </div>

  <!-- titolo: una domanda al pubblico, 8-12 parole, in 3-4 righe -->
  <div class="colonna">
  <h1 class="titolo">Cosa dice il tuo brand che i concorrenti non dicono?</h1>
  <!-- invito: cosa fare, 2-4 parole -->
  <p class="invito">Scrivilo nei commenti</p>
  <!-- sotto: la chiusa, 7-10 parole -->
  <p class="sotto">Se non ti viene niente, il problema è lì</p>
  </div>
  <svg class="stella" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M58 50L98 50M57.4 53.1L94.3 68.4M55.7 55.7L83.9 83.9M53.1 57.4L68.4 94.3M50 58L50 98M46.9 57.4L31.6 94.3M44.3 55.7L16.1 83.9M42.6 53.1L5.7 68.4M42 50L2 50M42.6 46.9L5.7 31.6M44.3 44.3L16.1 16.1M46.9 42.6L31.6 5.7M50 42L50 2M53.1 42.6L68.4 5.7M55.7 44.3L83.9 16.1M57.4 46.9L94.3 31.6"/></svg>
</body>
</html>
