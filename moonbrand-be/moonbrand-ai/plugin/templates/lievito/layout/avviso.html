<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root { --principale: #4E3F31; --secondario: #A8957E; --accento: #C4532F; --sfondo: #E8E1D7; }
  :root { --font-titoli: 'Gelasio', serif; --font-testo: 'Courier Prime', monospace; }
  :root { --carta: color-mix(in srgb, var(--sfondo) 45%, white); --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --corsivo: 'Sacramento', cursive; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 40% 50%; filter: brightness(.82); }
  .etichetta { position: absolute; left: 0; top: 58px; width: 1080px; text-align: center; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: var(--chiaro); }
  .etichetta::after { content: ""; display: block; width: 10px; height: 2px; margin: 8px auto 0; background: currentColor; }

  .foglio { position: absolute; left: 215px; top: 296px; width: 650px; height: 880px; background: color-mix(in srgb, var(--carta) 92%, #9A9A9A); box-shadow: 0 18px 36px rgba(0,0,0,.4); }
  .molla { position: absolute; left: 418px; top: 186px; width: 244px; height: 156px; }

  .titolo { position: absolute; left: 215px; top: 452px; width: 650px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 84px; line-height: 86px; text-transform: uppercase; }
  .titolo span { display: block; }
  .corsivo { position: absolute; left: 215px; top: 618px; width: 650px; text-align: center; font-family: var(--corsivo); font-size: 196px; line-height: 1; color: var(--accento); -webkit-text-stroke: 2.2px var(--accento); transform: rotate(-4deg); }
  .titolo.giu { top: 826px; }
  .testo { position: absolute; left: 290px; top: 1010px; width: 500px; text-align: center; font-size: 24px; line-height: 32px; text-transform: uppercase; letter-spacing: .04em; }

  .logo { position: absolute; left: 340px; top: 1215px; width: 400px; text-align: center; color: var(--chiaro); }
  .logo b { display: block; font-family: var(--font-titoli); font-weight: 500; font-size: 34px; letter-spacing: .03em; text-transform: uppercase; }
  .logo i { display: block; margin-top: -2px; font-family: var(--corsivo); font-style: normal; font-size: 36px; line-height: 1; }
</style>
</head>
<body>
  <!-- foto: pane o dolci da vicino, luce calda e scura -->
  <img class="foto" src="../esempio/panini.jpg" alt="">
  <!-- etichetta: 1-2 parole -->
  <p class="etichetta">Avviso</p>

  <!-- foglio: carta appesa con una molla di metallo in alto -->
  <div class="foglio"></div>
  <svg class="molla" viewBox="0 0 244 156" aria-hidden="true">
    <path d="M70 112 L82 18 Q122 -4 162 18 L174 112" fill="none" stroke="#B8A27A" stroke-width="7" stroke-linejoin="round"/>
    <path d="M78 108 L88 24 Q122 6 156 24 L166 108" fill="none" stroke="#6E5E44" stroke-width="2.5" opacity=".6"/>
    <rect x="30" y="104" width="184" height="46" rx="5" fill="#2A2724"/>
    <rect x="30" y="104" width="184" height="10" rx="4" fill="#4A4540"/>
  </svg>

  <!-- titolo: 2 righe di 4-10 caratteri, poi una parola in corsivo, poi 1 riga -->
  <h1 class="titolo"><span>Scusate,</span><span>oggi siamo</span></h1>
  <p class="corsivo">chiusi</p>
  <h1 class="titolo giu"><span>per riposo</span></h1>
  <!-- testo: quando si riapre, 6-12 parole -->
  <p class="testo">Riapriamo domani alle 7, giovedì 28 novembre.</p>

  <!-- logo: il nome del brand con il motto sotto, chiaro sulla foto -->
  <div class="logo"><b>Forno Merighi</b><i>pane e dolci</i></div>
</body>
</html>
