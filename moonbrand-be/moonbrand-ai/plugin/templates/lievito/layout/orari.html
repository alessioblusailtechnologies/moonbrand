<style>
  :root { --principale: #4E3F31; --secondario: #A8957E; --accento: #C4532F; --sfondo: #E8E1D7; }
  :root { --font-titoli: 'Gelasio', serif; --font-testo: 'Courier Prime', monospace; }
  :root { --carta: color-mix(in srgb, var(--sfondo) 45%, white); --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --corsivo: 'Sacramento', cursive; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; }
  .etichetta { position: absolute; left: 0; top: 58px; width: 1080px; text-align: center; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: var(--principale); }
  .etichetta::after { content: ""; display: block; width: 10px; height: 2px; margin: 8px auto 0; background: currentColor; }

  .centrino { position: absolute; left: 112px; top: 222px; width: 900px; height: 900px; filter: drop-shadow(0 10px 14px rgba(0,0,0,.22)); }

  .titolo { position: absolute; left: 262px; top: 448px; width: 600px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 86px; line-height: 84px; text-transform: uppercase; color: var(--accento); }
  .titolo span { display: block; }
  .righe { position: absolute; left: 322px; top: 650px; width: 480px; }
  .riga { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; }
  .riga + .riga { border-top: 2px dashed var(--accento); }
  .giorni { font-family: var(--font-titoli); font-size: 34px; text-transform: uppercase; }
  .ore { font-size: 31px; letter-spacing: .04em; }
  .nota { position: absolute; left: 322px; top: 812px; width: 480px; text-align: center; font-size: 21px; font-style: italic; letter-spacing: .08em; text-transform: uppercase; }

  .logo { position: absolute; left: 340px; top: 1190px; width: 400px; text-align: center; color: var(--chiaro); }
  .logo b { display: block; font-family: var(--font-titoli); font-weight: 500; font-size: 34px; letter-spacing: .03em; text-transform: uppercase; }
  .logo i { display: block; margin-top: -2px; font-family: var(--corsivo); font-style: normal; font-size: 36px; line-height: 1; }
</style>
</head>
