<style>
  :root { --principale: #4E3F31; --secondario: #A8957E; --accento: #C4532F; --sfondo: #E8E1D7; }
  :root { --font-titoli: 'Gelasio', serif; --font-testo: 'Courier Prime', monospace; }
  :root { --carta: color-mix(in srgb, var(--sfondo) 45%, white); --corsivo: 'Sacramento', cursive; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: -150px; top: -160px; width: 1380px; height: 1720px; object-fit: cover; object-position: 50% 50%; }
  .carta { position: absolute; left: 110px; top: 122px; width: 860px; height: 1205px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.28)); }

  .corsivo { position: absolute; left: 0; top: 584px; width: 1080px; text-align: center; font-family: var(--corsivo); font-size: 132px; line-height: 1; color: var(--accento); -webkit-text-stroke: 1.6px var(--accento); }
  .titolo { position: absolute; left: 0; top: 728px; width: 1080px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 72px; line-height: 74px; text-transform: uppercase; }
  .titolo span { display: block; }
  .titolo em { font-style: italic; }
  .testo { position: absolute; left: 270px; top: 1000px; width: 540px; text-align: center; font-size: 25px; line-height: 32px; text-transform: uppercase; letter-spacing: .04em; }

  .logo { position: absolute; left: 340px; top: 1150px; width: 400px; text-align: center; color: var(--accento); }
  .logo b { display: block; font-family: var(--font-titoli); font-weight: 500; font-size: 34px; letter-spacing: .03em; text-transform: uppercase; }
  .logo i { display: block; margin-top: -2px; font-family: var(--corsivo); font-style: normal; font-size: 36px; line-height: 1; }
</style>
</head>
