<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root { --principale: #4E3F31; --secondario: #A8957E; --accento: #C4532F; --sfondo: #E8E1D7; }
  :root { --font-titoli: 'Gelasio', serif; --font-testo: 'Courier Prime', monospace; }
  :root { --carta: color-mix(in srgb, var(--sfondo) 25%, white); --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --corsivo: 'Sacramento', cursive; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 60%; }
  .etichetta { position: absolute; left: 0; top: 58px; width: 1080px; text-align: center; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: var(--principale); }
  .etichetta::after { content: ""; display: block; width: 10px; height: 2px; margin: 8px auto 0; background: currentColor; }

  .biglietto { position: absolute; left: 195px; top: 196px; width: 690px; height: 990px; transform: rotate(-4deg); filter: drop-shadow(0 14px 22px rgba(0,0,0,.4)); }
  .biglietto svg { position: absolute; left: 0; top: 0; width: 690px; height: 990px; }

  .titolo { position: absolute; left: 0; top: 64px; width: 690px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 66px; line-height: 68px; text-transform: uppercase; }
  .titolo span { display: block; }
  .data { position: absolute; left: 0; top: 246px; width: 690px; text-align: center; font-family: var(--corsivo); font-size: 116px; line-height: 104px; color: var(--accento); -webkit-text-stroke: 1.6px var(--accento); transform: rotate(-5deg); }
  .data span { display: block; }
  .testo { position: absolute; left: 95px; top: 488px; width: 500px; text-align: center; font-size: 21px; line-height: 27px; text-transform: uppercase; letter-spacing: .03em; }
  .invito { position: absolute; left: 0; top: 608px; width: 690px; text-align: center; font-size: 21px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  .logo { position: absolute; left: 145px; top: 790px; width: 400px; text-align: center; color: var(--accento); }
  .logo b { display: block; font-family: var(--font-titoli); font-weight: 500; font-size: 40px; letter-spacing: .03em; text-transform: uppercase; }
  .logo i { display: block; margin-top: -2px; font-family: var(--corsivo); font-style: normal; font-size: 42px; line-height: 1; }

  .firma { position: absolute; left: 0; top: 1262px; width: 1080px; text-align: center; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: var(--principale); }
  .firma::before { content: ""; display: block; width: 10px; height: 2px; margin: 0 auto 8px; background: currentColor; }
</style>
</head>
<body>
  <!-- foto: pane avvolto in un telo o in un sacchetto, toni caldi -->
  <img class="foto" src="../esempio/pane-lino.jpg" alt="">
  <!-- etichetta: 1-2 parole -->
  <p class="etichetta">Annuncio</p>

  <!-- biglietto: tagliando dentellato e inclinato, con la linea dello strappo sopra il logo -->
  <div class="biglietto">
    <svg viewBox="0 0 690 990" aria-hidden="true">
      <path d="M0 0 L4.3 0 A9 9 0 0 0 22.3 0 L30.8 0 A9 9 0 0 0 48.8 0 L57.3 0 A9 9 0 0 0 75.3 0 L83.9 0 A9 9 0 0 0 101.9 0 L110.4 0 A9 9 0 0 0 128.4 0 L137 0 A9 9 0 0 0 155 0 L163.5 0 A9 9 0 0 0 181.5 0 L190 0 A9 9 0 0 0 208 0 L216.6 0 A9 9 0 0 0 234.6 0 L243.1 0 A9 9 0 0 0 261.1 0 L269.7 0 A9 9 0 0 0 287.7 0 L296.2 0 A9 9 0 0 0 314.2 0 L322.7 0 A9 9 0 0 0 340.7 0 L349.3 0 A9 9 0 0 0 367.3 0 L375.8 0 A9 9 0 0 0 393.8 0 L402.3 0 A9 9 0 0 0 420.3 0 L428.9 0 A9 9 0 0 0 446.9 0 L455.4 0 A9 9 0 0 0 473.4 0 L482 0 A9 9 0 0 0 500 0 L508.5 0 A9 9 0 0 0 526.5 0 L535 0 A9 9 0 0 0 553 0 L561.6 0 A9 9 0 0 0 579.6 0 L588.1 0 A9 9 0 0 0 606.1 0 L614.7 0 A9 9 0 0 0 632.7 0 L641.2 0 A9 9 0 0 0 659.2 0 L667.7 0 A9 9 0 0 0 685.7 0 L690 0 L690 684 A16 16 0 0 0 690 716 L690 990 L685.7 990 A9 9 0 0 0 667.7 990 L659.2 990 A9 9 0 0 0 641.2 990 L632.7 990 A9 9 0 0 0 614.7 990 L606.1 990 A9 9 0 0 0 588.1 990 L579.6 990 A9 9 0 0 0 561.6 990 L553 990 A9 9 0 0 0 535 990 L526.5 990 A9 9 0 0 0 508.5 990 L500 990 A9 9 0 0 0 482 990 L473.4 990 A9 9 0 0 0 455.4 990 L446.9 990 A9 9 0 0 0 428.9 990 L420.3 990 A9 9 0 0 0 402.3 990 L393.8 990 A9 9 0 0 0 375.8 990 L367.3 990 A9 9 0 0 0 349.3 990 L340.7 990 A9 9 0 0 0 322.7 990 L314.2 990 A9 9 0 0 0 296.2 990 L287.7 990 A9 9 0 0 0 269.7 990 L261.1 990 A9 9 0 0 0 243.1 990 L234.6 990 A9 9 0 0 0 216.6 990 L208 990 A9 9 0 0 0 190 990 L181.5 990 A9 9 0 0 0 163.5 990 L155 990 A9 9 0 0 0 137 990 L128.4 990 A9 9 0 0 0 110.4 990 L101.9 990 A9 9 0 0 0 83.9 990 L75.3 990 A9 9 0 0 0 57.3 990 L48.8 990 A9 9 0 0 0 30.8 990 L22.3 990 A9 9 0 0 0 4.3 990 L0 990 L0 716 A16 16 0 0 0 0 684 Z" style="fill: var(--carta)"/>
      <line x1="24" y1="700" x2="666" y2="700" style="stroke: var(--principale)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 14"/>
    </svg>
    <!-- titolo: 2 righe di 8-12 caratteri -->
    <h1 class="titolo"><span>Prossimo</span><span>preordine</span></h1>
    <!-- data: in corsivo, 2 righe -->
    <p class="data"><span>venerdì 8</span><span>novembre</span></p>
    <!-- testo: 14-20 parole -->
    <p class="testo">Dal nostro forno a casa tua. Ritiro o consegna, i posti sono pochi: prenota per tempo.</p>
    <!-- invito: dove prenotare, 3-6 parole -->
    <p class="invito">DM o link in bio</p>
    <!-- logo: il nome del brand con il motto sotto, sotto lo strappo -->
    <div class="logo"><b>Forno Merighi</b><i>pane e dolci</i></div>
  </div>

  <!-- firma: il profilo del brand -->
  <p class="firma">@forno.merighi</p>
</body>
</html>
