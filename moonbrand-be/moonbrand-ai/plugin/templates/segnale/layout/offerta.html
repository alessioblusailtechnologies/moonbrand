<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0C0C0E; --secondario: #FF9200; --accento: #FFC915; --sfondo: #F2EFE8; }
  :root { --sfumato: linear-gradient(100deg, var(--accento) 10%, var(--secondario) 100%); --grigio: color-mix(in srgb, var(--sfondo) 70%, var(--principale)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--sfondo); font-family: 'Archivo', sans-serif; }

  .logo { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 700; font-stretch: 78%; letter-spacing: -0.01em; }
  .marchio { width: 48px; height: 48px; border-radius: 50%; background: var(--sfumato); color: var(--principale); display: grid; place-items: center; font-size: 30px; font-weight: 900; font-stretch: 100%; }
  .titolo { position: absolute; left: 64px; top: 236px; width: 600px; font-size: 108px; font-weight: 800; font-stretch: 106%; line-height: 0.98; letter-spacing: -0.015em; }
  .finale { background: var(--sfumato); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .opzioni { position: absolute; left: 66px; right: 66px; top: 640px; display: flex; gap: 24px; }
  .opzione { flex: 1; height: 318px; padding: 42px 36px 0; border-radius: 14px; background: color-mix(in srgb, var(--principale) 93%, #fff); }
  .opzione.piena { background: var(--sfumato); color: var(--principale); }
  .numero { font-size: 14px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accento); }
  .piena .numero { color: var(--principale); }
  .opzione h2 { margin-top: 14px; font-size: 40px; font-weight: 800; font-stretch: 106%; letter-spacing: -0.01em; }
  .opzione p { margin-top: 10px; font-family: 'Inter', sans-serif; font-size: 23px; line-height: 1.45; color: var(--grigio); }
  .piena p { color: color-mix(in srgb, var(--principale) 80%, transparent); }
  .bottone { display: inline-block; margin-top: 26px; padding: 0 32px; height: 44px; line-height: 44px; border-radius: 22px; background: var(--sfumato); color: var(--principale); font-size: 14px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.2em; text-transform: uppercase; }
  .piena .bottone { background: var(--principale); color: var(--sfondo); }
</style>
</head>
<body>
  <!-- logo: il nome del brand (il marchio tondo è l'iniziale) -->
  <div class="logo"><span class="marchio">F</span>faro.studio</div>

  <!-- titolo: una domanda di 4-5 parole su 3 righe; l'ultima parola sfumata (.finale) -->
  <h1 class="titolo">Ci vuoi dalla tua <span class="finale">parte?</span></h1>

  <div class="opzioni">
    <div class="opzione">
      <!-- numero dell'opzione: «Opzione 01» -->
      <div class="numero">Opzione 01</div>
      <!-- nome del servizio: 1-3 parole col punto -->
      <h2>Il check-up.</h2>
      <!-- cosa comprende: 12-20 parole -->
      <p>Un'ora insieme. Guardiamo profilo, scheda Google e vetrina. Esci con un piano.</p>
      <!-- invito: 2-3 parole -->
      <span class="bottone">Prenota</span>
    </div>
    <div class="opzione piena">
      <div class="numero">Opzione 02</div>
      <h2>Il mese pieno.</h2>
      <p>Quattro settimane. Facciamo i post con te e pubblichiamo il primo mese.</p>
      <span class="bottone">Scrivici</span>
    </div>
  </div>
</body>
</html>
