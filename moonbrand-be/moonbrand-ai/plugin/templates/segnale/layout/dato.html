<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0C0C0E; --secondario: #FF9200; --accento: #FFC915; --sfondo: #F2EFE8; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Inter', sans-serif; }
  :root { --sfumato: linear-gradient(in oklab 100deg, var(--accento) 10%, var(--secondario) 100%); --grigio: color-mix(in srgb, var(--sfondo) 70%, var(--principale)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--sfondo); font-family: var(--font-testo); }

  .logo { font-family: var(--font-titoli); position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 700; font-stretch: 78%; letter-spacing: -0.01em; }
  .marchio { width: 48px; height: 48px; border-radius: 50%; background: var(--sfumato); color: var(--principale); display: grid; place-items: center; font-size: 30px; font-weight: 900; font-stretch: 100%; }
  .numero { font-family: var(--font-titoli); position: absolute; left: 50px; top: 268px; font-size: 360px; font-weight: 800; font-stretch: 106%; line-height: 1; letter-spacing: -0.03em; background: var(--sfumato); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .titolo { isolation: isolate; font-family: var(--font-titoli); position: absolute; left: 64px; top: 720px; width: 960px; font-size: 80px; font-weight: 800; font-stretch: 106%; line-height: 0.96; letter-spacing: -0.015em; }
  .evidenza { position: relative; color: var(--principale); }
  .evidenza::before { content: ''; position: absolute; z-index: -1; left: -6px; right: -6px; top: 0.1em; bottom: -0.06em; background: var(--sfumato); border-radius: 5px; }
  .testo { position: absolute; left: 64px; top: 1068px; width: 900px; font-family: var(--font-testo); font-size: 25px; line-height: 1.55; color: var(--grigio); }
  .fonte { position: absolute; left: 64px; bottom: 60px; font-family: var(--font-testo); font-size: 18px; color: var(--grigio); }
</style>
</head>
<body>
  <!-- logo: il nome del brand (il marchio tondo è l'iniziale) -->
  <div class="logo"><span class="marchio">F</span>faro.studio</div>

  <!-- numero: il dato, al massimo 4 caratteri (68%, 3×, 9/10) -->
  <div class="numero">76%</div>
  <!-- titolo: cosa misura il numero, 10-16 parole su 4 righe; una parola nella fascia (.evidenza) -->
  <h1 class="titolo">di chi cerca un negozio <span class="evidenza">vicino</span> ci va entro un giorno.</h1>
  <!-- testo: cosa vuol dire per chi legge, 15-25 parole -->
  <p class="testo">La scheda Google non è un dettaglio. È la vetrina che ti trova chi è già per strada e ha fretta.</p>
  <!-- fonte: da dove viene il dato, «Fonte: …» -->
  <div class="fonte">Fonte: Google, ricerche locali da mobile</div>
</body>
</html>
