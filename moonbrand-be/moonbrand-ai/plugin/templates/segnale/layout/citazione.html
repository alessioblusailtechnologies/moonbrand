<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0C0C0E; --secondario: #FF9200; --accento: #FFC915; --sfondo: #F2EFE8; }
  :root { --sfumato: linear-gradient(100deg, var(--accento) 10%, var(--secondario) 100%); --grigio: color-mix(in srgb, var(--sfondo) 70%, var(--principale)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--sfondo); font-family: 'Archivo', sans-serif; }

  .logo { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 700; font-stretch: 78%; letter-spacing: -0.01em; }
  .marchio { width: 48px; height: 48px; border-radius: 50%; background: var(--sfumato); color: var(--principale); display: grid; place-items: center; font-size: 30px; font-weight: 900; font-stretch: 100%; }
  .blocco { position: absolute; left: 150px; right: 150px; top: 440px; text-align: center; }
  .virgolette { display: block; width: 84px; height: 62px; margin: 0 auto 34px; }
  .titolo { font-size: 78px; font-weight: 800; font-stretch: 106%; line-height: 0.99; letter-spacing: -0.015em; }
  .evidenza { position: relative; z-index: 0; color: var(--principale); }
  .evidenza::before { content: ''; position: absolute; z-index: -1; left: -6px; right: -6px; top: 0.1em; bottom: -0.06em; background: var(--sfumato); border-radius: 5px; }
  .finale { background: var(--sfumato); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .firma { position: absolute; left: 0; right: 0; top: 1120px; text-align: center; font-family: 'Inter', sans-serif; font-size: 22px; color: var(--grigio); }
</style>
</head>
<body>
  <!-- logo: il nome del brand (il marchio tondo è l'iniziale) -->
  <div class="logo"><span class="marchio">F</span>faro.studio</div>

  <div class="blocco">
    <svg class="virgolette" viewBox="0 0 84 62"><defs><linearGradient id="v" x1="0" x2="1"><stop offset="0.1" style="stop-color: var(--accento)"/><stop offset="1" style="stop-color: var(--secondario)"/></linearGradient></defs><path fill="url(#v)" d="M18 0 H34 L38 62 H4 Z M58 0 H74 L78 62 H44 Z"/></svg>
    <!-- citazione: 8-12 parole su 4 righe; una parola nella fascia (.evidenza), l'ultima sfumata (.finale) -->
    <h1 class="titolo">Il marketing è solo essere <span class="evidenza">utili</span> in pubblico, ogni <span class="finale">settimana.</span></h1>
  </div>
  <!-- firma: chi l'ha detto, «Nome Cognome, ruolo o attività», senza trattino -->
  <div class="firma">Giulia Ferrante, faro.studio</div>
</body>
</html>
