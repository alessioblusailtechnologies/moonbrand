<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0C0C0E; --secondario: #FF9200; --accento: #FFC915; --sfondo: #F2EFE8; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Inter', sans-serif; }
  :root { --sfumato: linear-gradient(in oklab 100deg, var(--accento) 10%, var(--secondario) 100%); --grigio: color-mix(in srgb, var(--principale) 62%, #fff); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .logo { font-family: var(--font-titoli); position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 700; font-stretch: 78%; letter-spacing: -0.01em; }
  .marchio { width: 48px; height: 48px; border-radius: 50%; background: var(--sfumato); color: var(--principale); display: grid; place-items: center; font-size: 30px; font-weight: 900; font-stretch: 100%; }
  .foto { position: absolute; right: 66px; top: 52px; width: 360px; height: 440px; object-fit: cover; object-position: 50% 30%; display: block; }
  .caso { position: absolute; left: 66px; top: 232px; padding: 0 20px; height: 40px; line-height: 40px; border-radius: 10px; background: var(--sfumato); font-size: 14px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.2em; text-transform: uppercase; }
  .blocco { position: absolute; left: 64px; top: 296px; width: 580px; }
  .titolo { isolation: isolate; font-family: var(--font-titoli); font-size: 56px; font-weight: 800; font-stretch: 106%; line-height: 1; letter-spacing: -0.015em; }
  .finale { background: var(--sfumato); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .testo { margin: 40px 0 0 2px; width: 470px; font-family: var(--font-testo); font-size: 24px; line-height: 1.5; color: var(--grigio); }

  .numeri { position: absolute; left: 140px; right: 66px; top: 1062px; display: flex; gap: 14px; }
  .numeri > div { flex: 1; height: 180px; padding: 40px 32px 0; border-radius: 14px; }
  .numeri .piena { background: var(--sfumato); }
  .numeri .scura { background: var(--principale); }
  .voce { font-size: 13px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.22em; text-transform: uppercase; }
  .numeri div:first-child .voce, .scura .voce { color: var(--accento); }
  .valore { font-family: var(--font-titoli); margin-top: 18px; font-size: 64px; font-weight: 800; font-stretch: 106%; letter-spacing: -0.02em; line-height: 1; }
  .scura .valore { color: var(--accento); }
  .pagina { position: absolute; right: 78px; bottom: 50px; font-size: 13px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.2em; color: var(--grigio); }
</style>
</head>
<body>
  <!-- logo: il nome del brand (il marchio tondo è l'iniziale) -->
  <div class="logo"><span class="marchio">F</span>faro.studio</div>
  <!-- foto: il cliente in posa o al lavoro, ritratto verticale, viso in alto -->
  <img class="foto" src="../esempio/cliente.jpg" alt="">

  <!-- etichetta: «Caso» e il numero, 2 parole -->
  <div class="caso">Caso 07</div>
  <!-- titolo: tre frasi brevi col punto, una per riga (br), 7-9 parole; una parola sfumata (.finale) -->
  <div class="blocco">
  <h1 class="titolo">Stessa via.<br>Offerta più <span class="finale">chiara.</span><br>Chiamate triplicate.</h1>
  <!-- testo: cosa abbiamo cambiato, 15-25 parole -->
  <p class="testo">Non abbiamo speso un euro in più in pubblicità. Abbiamo riscritto cosa promette la pagina, e per chi.</p>
  </div>

  <div class="numeri">
    <!-- tre risultati: voce di 1-2 parole e valore di al massimo 5 caratteri -->
    <div><div class="voce">Chiamate</div><div class="valore">3,1×</div></div>
    <div class="piena"><div class="voce">Prenotazioni</div><div class="valore">+42%</div></div>
    <div class="scura"><div class="voce">Pubblicità</div><div class="valore">0 €</div></div>
  </div>
  <!-- pagina: la slide e il totale, «04 / 06» -->
  <div class="pagina">04 / 06</div>
</body>
</html>
