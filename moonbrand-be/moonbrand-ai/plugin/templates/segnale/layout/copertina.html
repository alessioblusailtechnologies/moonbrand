<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0C0C0E; --secondario: #FF9200; --accento: #FFC915; --sfondo: #F2EFE8; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Inter', sans-serif; }
  :root { --sfumato: linear-gradient(in oklab 100deg, var(--accento) 10%, var(--secondario) 100%); --grigio: color-mix(in srgb, var(--sfondo) 70%, var(--principale)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--sfondo); font-family: var(--font-testo); }

  .angolo { position: absolute; left: 0; top: 0; width: 150px; height: 150px; background: color-mix(in srgb, var(--accento) 48%, var(--principale)); clip-path: polygon(0 0, 100% 0, 0 100%); }
  .logo { font-family: var(--font-titoli); position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 700; font-stretch: 78%; letter-spacing: -0.01em; }
  .marchio { width: 48px; height: 48px; border-radius: 50%; background: var(--sfumato); color: var(--principale); display: grid; place-items: center; font-size: 30px; font-weight: 900; font-stretch: 100%; }
  .serie { position: absolute; right: 72px; top: 68px; font-size: 15px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.24em; text-transform: uppercase; color: var(--grigio); }
  .occhiello { position: absolute; left: 66px; top: 300px; font-size: 16px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.2em; text-transform: uppercase; color: var(--secondario); }
  .titolo { isolation: isolate; font-family: var(--font-titoli); position: absolute; left: 62px; top: 356px; width: 960px; font-size: 136px; font-weight: 800; font-stretch: 106%; line-height: 0.95; letter-spacing: -0.015em; }
  .evidenza { position: relative; color: var(--principale); }
  .evidenza::before { content: ''; position: absolute; z-index: -1; left: -10px; right: -12px; top: 0.12em; bottom: -0.08em; background: var(--sfumato); border-radius: 6px; transform: rotate(-1deg); }
  .finale { background: var(--sfumato); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .testo { position: absolute; left: 64px; top: 1088px; width: 600px; font-family: var(--font-testo); font-size: 25px; line-height: 1.55; color: var(--grigio); }
  .scorri { position: absolute; right: 64px; top: 1086px; display: flex; flex-direction: column; align-items: flex-end; gap: 22px; font-size: 13px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.24em; text-transform: uppercase; color: var(--grigio); }
  .scorri svg { width: 52px; height: 52px; }
</style>
</head>
<body>
  <div class="angolo"></div>
  <!-- logo: il nome del brand (il marchio tondo è l'iniziale) -->
  <div class="logo"><span class="marchio">F</span>faro.studio</div>
  <!-- serie: il nome della rubrica e il numero, 1-3 parole -->
  <div class="serie">Guida · 01</div>

  <!-- occhiello: il tema del carosello, 2-4 parole -->
  <div class="occhiello">Marketing locale, spiegato</div>
  <!-- titolo: 4-7 parole su 3-4 righe; una parola nella fascia (.evidenza), l'ultima sfumata (.finale), punto finale -->
  <h1 class="titolo">Clienti nuovi senza <span class="evidenza">alzare</span> il <span class="finale">budget.</span></h1>

  <!-- testo: cosa trova chi scorre, 15-25 parole -->
  <p class="testo">Dieci mosse che usiamo ogni settimana con le attività di quartiere: piccole, poco spettacolari, e funzionano.</p>
  <div class="scorri">
    <!-- invito a scorrere: 1 parola -->
    <span>Scorri</span>
    <svg viewBox="0 0 52 52" fill="none" stroke="var(--accento)" stroke-width="4" stroke-linecap="square"><path d="M10 42 L40 12 M18 12 H40 V34"/></svg>
  </div>
</body>
</html>
