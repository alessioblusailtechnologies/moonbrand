<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --principale: #0C0C0E; --secondario: #FF9200; --accento: #FFC915; --sfondo: #F2EFE8; }
  :root { --sfumato: linear-gradient(100deg, var(--accento) 10%, var(--secondario) 100%); --grigio: color-mix(in srgb, var(--sfondo) 70%, var(--principale)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--sfondo); font-family: 'Archivo', sans-serif; }

  .logo { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 700; font-stretch: 78%; letter-spacing: -0.01em; }
  .marchio { width: 48px; height: 48px; border-radius: 50%; background: var(--sfumato); color: var(--principale); display: grid; place-items: center; font-size: 30px; font-weight: 900; font-stretch: 100%; }
  .titolo { position: absolute; left: 64px; top: 340px; width: 960px; font-size: 156px; font-weight: 800; font-stretch: 106%; line-height: 0.95; letter-spacing: -0.02em; }
  .titolo span { display: block; width: max-content; }
  .fascia { position: relative; z-index: 0; color: var(--principale); }
  .fascia::before { content: ''; position: absolute; z-index: -1; left: -6px; right: -50px; top: 0.06em; bottom: -0.08em; background: var(--sfumato); border-radius: 4px; transform: rotate(-2deg); }
  .finale { background: var(--sfumato); -webkit-background-clip: text; background-clip: text; color: transparent; width: max-content; }
  .testo { position: absolute; left: 64px; top: 986px; width: 600px; font-family: 'Inter', sans-serif; font-size: 25px; line-height: 1.55; color: var(--grigio); }
  .azioni { position: absolute; left: 64px; top: 1140px; display: flex; align-items: center; gap: 40px; font-size: 14px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.2em; text-transform: uppercase; }
  .azioni span { height: 46px; line-height: 46px; }
  .azioni .bordo { line-height: 42px; }
  .bordo { padding: 0 24px; border: 2px solid var(--grigio); border-radius: 23px; }
  .piena { padding: 0 30px; border-radius: 23px; background: var(--sfumato); color: var(--principale); }
  .angolo { position: absolute; right: 0; bottom: 0; width: 120px; height: 120px; background: var(--sfumato); clip-path: polygon(100% 0, 100% 100%, 0 100%); }
</style>
</head>
<body>
  <!-- logo: il nome del brand (il marchio tondo è l'iniziale) -->
  <div class="logo"><span class="marchio">F</span>faro.studio</div>

  <!-- titolo: tre comandi di 1-2 parole col punto, uno per riga; il secondo nella fascia, il terzo sfumato -->
  <h1 class="titolo"><span>Salvalo.</span><span class="fascia">Giralo.</span><span class="finale">Usalo.</span></h1>

  <!-- testo: a chi mandarlo e perché, 15-25 parole -->
  <p class="testo">Se questa guida ti ha fatto cambiare idea sulla tua vetrina, mandala a chi ha un negozio e ne ha più bisogno.</p>
  <div class="azioni">
    <!-- tre inviti di 1-3 parole: salvare, condividere, seguire -->
    <span class="bordo">↳ Salva</span>
    <span>↗ Condividi</span>
    <span class="piena">+ Seguici</span>
  </div>
  <div class="angolo"></div>
</body>
</html>
