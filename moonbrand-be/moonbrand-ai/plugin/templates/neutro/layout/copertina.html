<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;500;700&display=block" rel="stylesheet">
<style>
  :root { --principale: #1F1B18; --secondario: #BD9E84; --accento: #866B4F; --sfondo: #E6D7C8; }
  :root { --pannello: color-mix(in srgb, var(--secondario) 40%, var(--sfondo)); }
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: 'Montserrat', sans-serif; }

  .titolo { position: absolute; left: 76px; top: 150px; width: 560px; margin: 0; font-family: 'Cinzel', serif; font-weight: 400;
    font-size: 88px; line-height: 126px; letter-spacing: 1px; }
  .titolo .maiuscolo { text-transform: uppercase; }
  .filetto { position: absolute; left: 76px; top: 610px; width: 205px; height: 2px; background: var(--principale); }
  .testo { position: absolute; left: 76px; top: 662px; width: 420px; margin: 0; font-size: 32px; line-height: 50px; font-weight: 500; }
  .bottone { position: absolute; left: 70px; top: 930px; width: 282px; height: 54px; box-sizing: border-box; border: 2px solid var(--principale);
    display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: 500; letter-spacing: 6px;
    color: color-mix(in srgb, var(--principale) 75%, var(--sfondo)); text-transform: uppercase; }

  .pannello { position: absolute; right: 0; top: 1030px; width: 290px; height: 320px; background: var(--pannello); }
  .cornice { position: absolute; left: 530px; top: 500px; width: 496px; height: 760px; box-sizing: border-box; border: 3px solid
    color-mix(in srgb, var(--sfondo) 45%, white); border-radius: 248px 248px 0 0; }
  .arco { position: absolute; left: 540px; top: 510px; width: 476px; height: 740px; object-fit: cover; object-position: 22% 30%;
    border-radius: 238px 238px 0 0; }
  .ellisse { position: absolute; left: 452px; top: 1180px; width: 268px; height: 120px; border: 2px solid
    color-mix(in srgb, var(--accento) 70%, var(--sfondo)); border-radius: 50%; transform: rotate(-6deg); }
  .cerchio { position: absolute; left: 470px; top: 1090px; width: 132px; height: 132px; border-radius: 50%; background: var(--accento);
    color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Cinzel', serif;
    font-weight: 700; font-size: 29px; line-height: 32px; text-align: center; }
  .cerchio small { font-size: 22px; line-height: 24px; letter-spacing: 1px; }
  .anello { position: absolute; left: 878px; top: 455px; width: 170px; height: 170px; }
  .anello text { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 2px; fill: var(--principale); }
</style>
</head>
<body>
  <!-- titolo: 3 righe brevi, la prima in maiuscoletto (minuscole), le altre due in maiuscolo; 2-3 parole per riga -->
  <h1 class="titolo">Diamo luce<br><span class="maiuscolo">ai tuoi</span><br><span class="maiuscolo">capelli</span></h1>
  <div class="filetto"></div>
  <!-- testo: 15-25 parole, invito o promessa del salone -->
  <p class="testo">Scopri sul nostro profilo i consigli giusti per avere capelli sani e luminosi tutto l'anno.</p>
  <!-- bottone: invito all'azione, 1-2 parole -->
  <div class="bottone">Prenota ora</div>

  <div class="pannello"></div>
  <div class="cornice"></div>
  <!-- foto: ritratto di una cliente, viso e capelli, verticale -->
  <img class="arco" src="../esempio/sguardo.jpg" width="476" height="740" alt="">
  <div class="ellisse"></div>
  <!-- cerchio: lo sconto, una cifra e una parola (togliere se non c'è un'offerta) -->
  <div class="cerchio">20%<small>sconto</small></div>
  <!-- anello: una parola breve ripetuta tre volte, in maiuscolo -->
  <svg class="anello" viewBox="0 0 170 170">
    <defs><path id="giro" d="M85,85 m-62,0 a62,62 0 1,1 124,0 a62,62 0 1,1 -124,0"/></defs>
    <text><textPath href="#giro" textLength="385">PROMO • PROMO • PROMO •</textPath></text>
  </svg>
</body>
</html>
