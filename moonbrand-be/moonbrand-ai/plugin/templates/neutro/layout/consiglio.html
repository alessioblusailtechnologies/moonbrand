<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Montserrat:ital,wght@0,400;0,500;1,400&display=block" rel="stylesheet">
<style>
  :root { --principale: #1F1B18; --secondario: #BD9E84; --accento: #866B4F; --sfondo: #E6D7C8; }
  :root { --font-titoli: 'Playfair Display', serif; --font-testo: 'Montserrat', sans-serif; }
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .sfondo { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 60% 50%; }
  .scheda { position: absolute; left: 205px; top: 330px; width: 670px; min-height: 830px; box-sizing: border-box; padding: 175px 70px 140px;
    background: color-mix(in srgb, color-mix(in srgb, var(--sfondo) 50%, white) 92%, transparent); border-radius: 14px; text-align: center; }
  .tondo { position: absolute; left: 420px; top: 210px; width: 240px; height: 240px; border-radius: 50%; object-fit: cover;
    object-position: 45% 40%; }
  .titolo { margin: 0; font-family: var(--font-titoli); font-weight: 400; font-size: 54px; line-height: 70px; }
  .sottotitolo { margin: 10px 0 0; font-size: 27px; line-height: 36px; font-weight: 500; text-transform: uppercase;
    color: color-mix(in srgb, var(--secondario) 80%, var(--principale)); }
  .testo { margin: 44px 0 0; font-size: 31px; line-height: 46px; text-align: justify; text-align-last: left; }
  .piede { position: absolute; left: 0; right: 0; bottom: 0; height: 108px; border-top: 2px solid var(--accento); color: var(--accento);
    display: flex; align-items: center; justify-content: center; font-size: 33px; font-style: italic; }
</style>
</head>
<body>
  <!-- foto di sfondo: capelli visti di spalle (treccia, piega, colore), toni chiari -->
  <img class="sfondo" src="../esempio/treccia.jpg" width="1080" height="1350" alt="">
  <div class="scheda">
    <!-- titolo: 2-4 parole, una riga -->
    <h1 class="titolo">Il consiglio del giorno</h1>
    <!-- sottotitolo: in maiuscolo, 3-6 parole, a cosa serve il consiglio -->
    <p class="sottotitolo">Per capelli più forti</p>
    <!-- testo: 30-45 parole, il consiglio spiegato -->
    <p class="testo">Massaggio alla cute. Ogni sera, prima di dormire, premi con delicatezza i polpastrelli su tutta la testa con piccoli movimenti circolari: il sangue arriva meglio ai follicoli e aiuta i capelli a crescere sani e più forti.</p>
    <!-- piede: chiusa breve in corsivo, 1-3 parole -->
    <div class="piede">Da provare!</div>
  </div>
  <!-- tondo: la stessa foto di sfondo, più vicina -->
  <img class="tondo" src="../esempio/treccia.jpg" width="240" height="240" alt="">
</body>
</html>
