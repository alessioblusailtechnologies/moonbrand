<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
:root { --principale: #2B2421; --secondario: #8C8579; --accento: #9E2B25; --sfondo: #E4E1DB; }
p, h1 { text-wrap: pretty; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--principale); }
.pagina { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--principale); }
/* La foto a sinistra a tutta altezza, la colonna di destra è il colore principale: il prezzo comanda. */
.foto { position: absolute; left: 0; top: 0; width: 620px; height: 1350px; object-fit: cover; object-position: 42% 50%; }
.titolo {
  position: absolute; left: 672px; top: 96px; width: 360px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-optical-sizing: auto; font-weight: 500;
  font-size: 64px; line-height: 0.98; letter-spacing: -0.025em; color: var(--sfondo);
}
.prezzo {
  position: absolute; left: 662px; top: 470px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-optical-sizing: auto; font-weight: 400;
  font-size: 250px; line-height: 0.8; letter-spacing: -0.05em; color: var(--sfondo);
}
.prezzo .valuta { font-size: 0.42em; letter-spacing: 0; }
.filetto { position: absolute; left: 672px; top: 740px; width: 56px; height: 3px; background: var(--accento); }
.testo {
  position: absolute; left: 672px; top: 770px; width: 368px; margin: 0;
  font-family: 'Hanken Grotesk', sans-serif; font-size: 26px; line-height: 1.36; color: var(--sfondo);
}
.condizione {
  position: absolute; left: 672px; bottom: 130px; width: 368px; margin: 0;
  font-family: 'Hanken Grotesk', sans-serif; font-weight: 500; font-size: 26px; line-height: 1.36; color: var(--sfondo);
}
.logo {
  position: absolute; left: 672px; bottom: 56px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: var(--sfondo);
}
</style>
</head>
<body>
<div class="pagina">
  <!-- foto: verticale, il trattamento o il risultato da vicino -->
  <img class="foto" src="../esempio/offerta.jpg" alt="">
  <!-- titolo: cosa si offre, 3-6 parole -->
  <h1 class="titolo">Le punte, prima dell’estate</h1>
  <!-- prezzo: solo la cifra e il simbolo (o una parola corta: «Gratis», «−20%») -->
  <p class="prezzo">45<span class="valuta">€</span></p>
  <div class="filetto"></div>
  <!-- testo: cosa comprende, 12-22 parole -->
  <p class="testo">Trattamento ristrutturante alla cheratina e spuntatina, con piega naturale.</p>
  <!-- condizione: date, giorni, come prenotare, 10-20 parole; numeri di telefono con &nbsp; tra i gruppi -->
  <p class="condizione">Dal 3 al 28 giugno, martedì e mercoledì. Prenota al 081&nbsp;552&nbsp;1934.</p>
  <!-- logo: il nome del brand -->
  <p class="logo">Salone Maria</p>
</div>
</body>
</html>
