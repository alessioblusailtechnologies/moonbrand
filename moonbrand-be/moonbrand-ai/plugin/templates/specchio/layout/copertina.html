<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
:root { --principale: #2B2421; --secondario: #8C8579; --accento: #9E2B25; --sfondo: #E4E1DB; }
/* Il colore dei testi sulla foto: nero o bianco puro secondo la zona dove poggiano, non la palette. */
.pagina { --su-foto: #16120F; }
p, h1 { text-wrap: pretty; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
.pagina { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 30%; transform: scale(1.06); transform-origin: 62% 40%; }
.titolo {
  position: absolute; left: 64px; top: 96px; width: 560px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-optical-sizing: auto; font-weight: 500;
  font-size: 138px; line-height: 0.9; letter-spacing: -0.035em; color: var(--su-foto);
}
.testo {
  position: absolute; left: 68px; bottom: 150px; width: 270px; margin: 0;
  font-family: 'Hanken Grotesk', sans-serif; font-size: 27px; line-height: 1.32; color: var(--su-foto);
}
.filetto { position: absolute; left: 68px; bottom: 120px; width: 72px; height: 3px; background: var(--accento); }
.logo {
  position: absolute; left: 68px; bottom: 56px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 34px; color: var(--su-foto);
}
</style>
</head>
<body>
<div class="pagina">
  <!-- foto: un ritratto verticale con il soggetto a destra e una parete o un fondo tranquillo a sinistra, tagliato alla fronte -->
  <img class="foto" src="../esempio/copertina.jpg" alt="">
  <!-- titolo: 3-6 parole, in minuscolo con la sola iniziale maiuscola, va a capo da solo su 3-4 righe -->
  <h1 class="titolo">Il carré che non chiede piega</h1>
  <!-- testo: una o due frasi concrete, 12-25 parole: cosa, per chi, quando -->
  <p class="testo">Tagliato a secco, pari sulla nuca. Si asciuga con le mani in dieci minuti.</p>
  <div class="filetto"></div>
  <!-- logo: il nome del brand -->
  <p class="logo">Salone Maria</p>
</div>
</body>
</html>
