<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
:root { --principale: #2B2421; --secondario: #8C8579; --accento: #9E2B25; --sfondo: #E4E1DB; }
p, h1 { text-wrap: pretty; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
.pagina { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
/* La foto taglia la pagina in alto per tre quinti; il consiglio sta sotto, sul fondo, in due colonne sfalsate. */
.foto { position: absolute; left: 0; top: 0; width: 1080px; height: 790px; object-fit: cover; object-position: 60% 62%; }
.titolo {
  position: absolute; left: 64px; top: 838px; width: 600px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-optical-sizing: auto; font-weight: 500;
  font-size: 84px; line-height: 0.95; letter-spacing: -0.03em; color: var(--principale);
}
.colonna { position: absolute; left: 708px; top: 852px; width: 316px; }
.filetto { width: 56px; height: 3px; background: var(--accento); margin-bottom: 26px; }
.testo {
  margin: 0 0 22px; font-family: 'Hanken Grotesk', sans-serif; font-size: 25px; line-height: 1.38; color: var(--principale);
}
.logo {
  position: absolute; left: 64px; bottom: 56px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: var(--principale);
}
</style>
</head>
<body>
<div class="pagina">
  <!-- foto: un dettaglio del gesto (mani, capelli, prodotto), orizzontale o tagliato stretto -->
  <img class="foto" src="../esempio/consiglio.jpg" alt="">
  <!-- titolo: il consiglio in una frase di 4-8 parole -->
  <h1 class="titolo">Dopo la tinta, acqua tiepida e niente fretta</h1>
  <div class="colonna">
  <div class="filetto"></div>
  <!-- testo: il perché, 20-30 parole -->
  <p class="testo">L’acqua calda apre la cuticola e il colore scivola via. Le prime 48 ore non lavare i capelli.</p>
  <!-- testo: cosa fare in pratica, 15-25 parole -->
  <p class="testo">Poi shampoo senza solfati, risciacquo freddo alla fine e una maschera una volta a settimana.</p>
  </div>
  <!-- logo: il nome del brand -->
  <p class="logo">Salone Maria</p>
</div>
</body>
</html>
