<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
:root { --principale: #2B2421; --secondario: #8C8579; --accento: #9E2B25; --sfondo: #E4E1DB; }
p, h1 { text-wrap: pretty; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
.pagina { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
/* Le parole della cliente comandano: una colonna stretta di foto a destra, tagliata sul lavoro, il resto è carta. */
.foto { position: absolute; right: 0; top: 0; width: 340px; height: 1350px; object-fit: cover; object-position: 46% 50%; }
.blocco { position: absolute; left: 64px; top: 120px; width: 630px; }
.citazione {
  margin: 0;
  font-family: 'Bodoni Moda', serif; font-optical-sizing: auto; font-weight: 400;
  font-size: 66px; line-height: 1.06; letter-spacing: -0.02em; color: var(--principale);
}
.filetto { width: 56px; height: 3px; margin: 64px 0 26px 2px; background: var(--accento); }
.firma {
  margin: 0;
  font-family: 'Hanken Grotesk', sans-serif; font-size: 27px; line-height: 1.35; color: var(--principale);
}
.firma strong { font-weight: 500; }
.logo {
  position: absolute; left: 64px; bottom: 56px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: var(--principale);
}
</style>
</head>
<body>
<div class="pagina">
  <!-- foto: il lavoro sulla cliente o un dettaglio del salone, verticale: se ne vede solo una striscia -->
  <img class="foto" src="../esempio/dopo.jpg" alt="">
  <div class="blocco">
  <!-- citazione: le parole vere della cliente tra virgolette basse, 20-35 parole -->
  <p class="citazione">«Avevo paura del rame, pensavo di sembrare un’altra. Mi sono guardata allo specchio e mi sono riconosciuta subito, solo più sveglia.»</p>
  <div class="filetto"></div>
  <!-- firma: nome della cliente in grassetto e un dettaglio vero (da quanto viene, cosa ha fatto) -->
  <p class="firma"><strong>Giulia Neri</strong><br>tinta rame e taglio, a marzo</p>
  </div>
  <!-- logo: il nome del brand -->
  <p class="logo">Salone Maria</p>
</div>
</body>
</html>
