<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
:root { --principale: #2B2421; --secondario: #8C8579; --accento: #9E2B25; --sfondo: #E4E1DB; }
/* Il colore dei testi sulla foto: nero o bianco puro secondo la zona dove poggiano, non la palette. */
.pagina { --su-foto: #FFFFFF; }
p, h1 { text-wrap: pretty; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
.pagina { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; }
.nome {
  position: absolute; right: 56px; top: 56px; width: 424px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-optical-sizing: auto; font-weight: 500;
  font-size: 132px; line-height: 0.9; letter-spacing: -0.03em; color: var(--su-foto);
}
.testo {
  position: absolute; right: 56px; top: 196px; width: 424px; margin: 0;
  font-family: 'Hanken Grotesk', sans-serif; font-size: 25px; line-height: 1.34; color: var(--su-foto);
}
.logo {
  position: absolute; right: 56px; bottom: 48px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: var(--su-foto);
}
</style>
</head>
<body>
<div class="pagina">
  <!-- foto: la persona nel suo posto di lavoro, ritratto verticale con una zona scura e calma in alto a destra -->
  <img class="foto" src="../esempio/persona.jpg" alt="">
  <!-- nome: il nome di battesimo, una parola -->
  <h1 class="nome">Maria</h1>
  <!-- testo: chi è e cosa fa, una cosa vera e concreta, 12-20 parole su tre righe al massimo -->
  <p class="testo">Ha aperto in via Duomo nel 1996. I tagli corti, il sabato mattina, li fa ancora lei.</p>
  <!-- logo: il nome del brand -->
  <p class="logo">Salone Maria</p>
</div>
</body>
</html>
