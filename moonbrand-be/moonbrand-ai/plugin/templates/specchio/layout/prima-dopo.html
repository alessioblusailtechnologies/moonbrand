<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
:root { --principale: #2B2421; --secondario: #8C8579; --accento: #9E2B25; --sfondo: #E4E1DB; }
p, h1 { text-wrap: pretty; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
.pagina { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--sfondo); }
/* Il dopo comanda: a tutta altezza sulla destra. Il prima è più piccolo, in alto a sinistra, come una foto di lavoro. */
.dopo { position: absolute; right: 0; top: 0; width: 640px; height: 1350px; object-fit: cover; object-position: 50% 40%; }
.prima { position: absolute; left: 0; top: 0; width: 412px; height: 560px; object-fit: cover; object-position: 50% 45%; }
.didascalia {
  position: absolute; margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 500; font-size: 26px; color: #fff;
}
.didascalia.d-prima { left: 40px; top: 500px; }
.didascalia.d-dopo { left: 472px; bottom: 48px; }
.colonna { position: absolute; left: 48px; top: 624px; width: 360px; }
.titolo {
  margin: 0;
  font-family: 'Bodoni Moda', serif; font-optical-sizing: auto; font-weight: 500;
  font-size: 70px; line-height: 0.96; letter-spacing: -0.03em; color: var(--principale);
}
.filetto { width: 56px; height: 3px; margin: 48px 0 26px; background: var(--accento); }
.testo {
  margin: 0; width: 330px;
  font-family: 'Hanken Grotesk', sans-serif; font-size: 25px; line-height: 1.34; color: var(--principale);
}
.logo {
  position: absolute; left: 48px; bottom: 48px; margin: 0;
  font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 30px; color: var(--principale);
}
</style>
</head>
<body>
<div class="pagina">
  <!-- foto dopo: la stessa persona, stessa inquadratura e luce del prima, verticale -->
  <img class="dopo" src="../esempio/dopo.jpg" alt="">
  <!-- foto prima: la stessa persona prima del lavoro, verticale -->
  <img class="prima" src="../esempio/prima.jpg" alt="">
  <p class="didascalia d-prima">Prima</p>
  <p class="didascalia d-dopo">Dopo</p>
  <div class="colonna">
  <!-- titolo: il cambiamento in 3-6 parole -->
  <h1 class="titolo">Da castano spento a rame</h1>
  <div class="filetto"></div>
  <!-- testo: cosa si è fatto e quanto è durato, 12-22 parole, con il nome della cliente se lo concede -->
  <p class="testo">Tinta, lucidante e venti centimetri in meno. Tre ore di poltrona per Giulia.</p>
  </div>
  <!-- logo: il nome del brand -->
  <p class="logo">Salone Maria</p>
</div>
</body>
</html>
