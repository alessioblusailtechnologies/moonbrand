<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,800;1,800&display=swap" rel="stylesheet">
<style>
  :root { --principale: #5A4A3D; --secondario: #A9BE5F; --accento: #CF6FA0; --sfondo: #E7E6E2; }
  :root { --font-titoli: 'Figtree', sans-serif; --font-testo: 'Figtree', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 60px; top: 196px; width: 960px; text-align: center; font-family: var(--font-titoli); font-weight: 800; font-size: 86px; line-height: 1.05; letter-spacing: -0.035em; }
  .titolo em { font-style: italic; color: var(--accento); }
  .tondo { position: absolute; width: 290px; height: 290px; border-radius: 50%; object-fit: cover; display: block; }
  .a { left: 222px; top: 420px; }
  .b { left: 568px; top: 420px; }
  .c { left: 222px; top: 760px; }
  .d { left: 568px; top: 760px; }
  .profilo { position: absolute; left: 0; top: 1170px; width: 1080px; text-align: center; font-size: 24px; }
</style>
</head>
<body>
  <!-- titolo: 3-4 parole, una riga; una parola in corsivo -->
  <h1 class="titolo">Scegli il <em>tuo</em> caffè</h1>

  <!-- foto: quattro bevande o dolci visti dall'alto, ritagliati in cerchio, due per riga -->
  <img class="tondo a" src="../esempio/matcha.jpg" alt="">
  <img class="tondo b" src="../esempio/caffe-ghiaccio.jpg" alt="">
  <img class="tondo c" src="../esempio/cannella.jpg" alt="">
  <img class="tondo d" src="../esempio/latte-ghiaccio.jpg" alt="">

  <!-- profilo: il profilo social del brand -->
  <p class="profilo">@ortensia.forno</p>
</body>
</html>
