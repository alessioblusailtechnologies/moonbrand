<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Red+Hat+Display:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root { --principale: #562427; --secondario: #966255; --accento: #9D2D29; --sfondo: #F1EDE1; }
  :root { --font-titoli: 'DM Serif Display', serif; --font-testo: 'Red Hat Display', sans-serif; }
  :root { --tratto: color-mix(in oklch, var(--secondario) 62%, var(--sfondo)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .icone { position: absolute; left: 440px; top: 428px; width: 200px; height: 140px; fill: none; stroke: var(--tratto); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .titolo { position: absolute; left: 0; top: 614px; width: 1080px; text-align: center; color: var(--accento); }
  .titolo b { display: block; font-family: var(--font-titoli); font-weight: 400; font-size: 96px; line-height: 1; letter-spacing: -0.01em; }
  .titolo span { display: block; margin-top: 2px; font-family: var(--font-testo); font-weight: 300; font-size: 94px; line-height: 1; letter-spacing: -0.035em; }
  .titolo i { font-style: italic; }
  .marchio { position: absolute; left: 0; top: 1210px; width: 1080px; text-align: center; color: var(--accento); line-height: 1; }
  .marchio b { display: block; font-family: var(--font-testo); font-weight: 700; font-size: 44px; letter-spacing: -0.015em; line-height: 0.95; text-transform: uppercase; }
  .marchio span { display: block; font-family: var(--font-titoli); font-size: 31px; line-height: 1; }
</style>
</head>
<body>
  <svg class="icone" viewBox="0 0 200 140" aria-hidden="true">
    <path d="M10,42 L12,88 C12,94 16,98 22,98 L40,98 C46,98 50,94 50,88 L52,42 Z"/>
    <path d="M52,52 C62,50 66,58 64,66 C62,74 56,76 50,76"/>
    <path d="M24,34 C20,28 28,24 24,16 M36,34 C32,28 40,24 36,16"/>
    <path d="M44,90 C40,74 54,64 66,70 C76,62 92,66 92,80 C98,86 96,98 86,100 C76,108 54,106 44,90 Z"/>
    <path d="M60,74 C62,84 66,94 70,102 M76,68 C76,80 78,92 80,102"/>
    <path d="M118,58 C112,40 128,30 142,36 L174,30 C190,28 196,46 186,56 L186,96 C186,100 184,102 180,102 L130,108 Z"/>
    <path d="M142,36 C156,32 164,46 156,56 L158,104"/>
    <path d="M100,112 C96,100 108,92 118,96 L150,92 C162,90 168,102 160,110 L158,124 L108,130 Z"/>
  </svg>

  <!-- titolo: un motto di due righe brevi, la seconda con una parola in corsivo -->
  <h1 class="titolo"><b>Pane buono</b><span>Buon <i>umore</i></span></h1>

  <!-- logo: il nome del brand, centrato in basso -->
  <div class="marchio logo"><b>Rosina</b><span>Pasticceria</span></div>
</body>
</html>
