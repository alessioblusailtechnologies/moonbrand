<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Playfair+Display:wght@400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root { --principale: #161412; --secondario: #FFCB00; --accento: #BC1D14; --sfondo: #F4F2F3; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Playfair Display', serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .titolo { position: absolute; left: 0; top: 268px; white-space: nowrap; font-family: var(--font-titoli); font-weight: 900; font-size: 330px; line-height: 1; letter-spacing: -0.045em; color: var(--accento); }
  .frusta { position: absolute; left: 100px; top: 620px; width: 560px; height: 560px; }
  .anno { position: absolute; left: 72px; top: 1250px; font-size: 42px; letter-spacing: -0.02em; }
  .logo { position: absolute; right: 50px; top: 1130px; font-family: 'Mrs Saint Delafield', cursive; font-size: 190px; line-height: 1; color: var(--principale); transform: rotate(-6deg); }
</style>
</head>
<body>
  <!-- titolo: una sola parola grande col punto finale (il mestiere o il nome), 5-6 lettere, occupa tutta la larghezza -->
  <h1 class="titolo">Forno.</h1>

  <!-- disegno: un attrezzo da forno disegnato a linea (frusta, mattarello, sac à poche), in obliquo -->
  <svg class="frusta" viewBox="0 0 560 560" fill="none" stroke="var(--principale)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(202 333) rotate(45) scale(1.1)" stroke-width="4">
      <path d="M-6 -60 C-26 -160 -30 -330 0 -360 C30 -330 26 -160 6 -60"/>
      <path d="M-8 -60 C-52 -170 -60 -330 0 -362 C60 -330 52 -170 8 -60"/>
      <path d="M-9 -60 C-78 -180 -86 -330 -2 -364"/>
      <path d="M9 -60 C78 -180 86 -330 2 -364"/>
      <path d="M-10 -60 C-100 -190 -104 -320 -8 -362"/>
      <path d="M10 -60 C100 -190 104 -320 8 -362"/>
      <path d="M-14 -60 L-14 -18 L14 -18 L14 -60 Z" fill="var(--sfondo)" stroke-width="5"/>
      <path d="M-14 -48 L14 -48 M-14 -30 L14 -30" stroke-width="3"/>
      <path d="M-12 -18 C-14 30 -20 70 -34 110 C-50 150 -30 196 0 196 C30 196 50 150 34 110 C20 70 14 30 12 -18" fill="var(--sfondo)" stroke-width="5"/>
      <path d="M-24 120 L-8 128 M-28 140 L-10 146 M-28 160 L-12 164 M-24 178 L-10 180 M20 40 L8 44 M22 60 L8 62" stroke-width="2.5"/>
    </g>
  </svg>

  <!-- anno: da quando c'è il forno, 2-3 parole -->
  <p class="anno">dal 1958</p>

  <!-- logo: il nome del forno come firma a mano, in basso a destra -->
  <div class="logo">Lievito</div>
</body>
</html>
