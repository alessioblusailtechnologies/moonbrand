<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Allison&display=swap" rel="stylesheet">
<style>
  :root { --principale: #85564D; --secondario: #B6A18E; --accento: #9C6B5F; --sfondo: #E8E0D8; }
  :root { --font-titoli: 'Libre Baskerville', serif; --font-testo: 'Libre Baskerville', serif; }
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --firma: 'Allison', cursive; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; filter: saturate(0.8); }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--sfondo) 22%, transparent); }
  .cerchio { position: absolute; left: 94px; top: 229px; width: 892px; height: 892px; border-radius: 50%; background: var(--chiaro); }
  .stelle { position: absolute; left: 330px; top: 360px; width: 110px; height: 90px; }
  .titolo { position: absolute; left: 140px; top: 500px; width: 800px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 76px; line-height: 1; }
  .corsivo { position: absolute; left: 290px; top: 548px; width: 440px; text-align: center; font-family: var(--firma); font-size: 230px; line-height: 1; color: var(--principale); }
  .cuore { position: absolute; left: 706px; top: 628px; width: 62px; height: 56px; }
  .pane { position: absolute; left: 400px; top: 764px; width: 280px; height: 112px; }
  .firma { position: absolute; left: 140px; top: 906px; width: 800px; text-align: center; font-size: 24px; line-height: 1.5; letter-spacing: 0.14em; }
  .firma .logo { display: block; text-transform: uppercase; }
</style>
</head>
<body>
  <!-- foto: prodotti da vicino a tutto fondo, un po' spenti -->
  <img class="foto" src="../esempio/cesto-cornetti.jpg" alt="">
  <div class="velo"></div>
  <div class="cerchio"></div>

  <svg class="stelle" viewBox="0 0 110 90" fill="var(--secondario)">
    <path d="M40 30 C 42 50 47 55 66 57 C 47 59 42 64 40 84 C 38 64 33 59 14 57 C 33 55 38 50 40 30 Z"/>
    <path d="M86 0 C 87 12 90 15 102 16 C 90 17 87 20 86 32 C 85 20 82 17 70 16 C 82 15 85 12 86 0 Z"/>
  </svg>

  <!-- titolo: 2-3 parole minuscole in serif, chiuse da una parola a mano sotto -->
  <h1 class="titolo">sfornato con</h1>
  <!-- parola a mano: una parola, al massimo 6 lettere -->
  <p class="corsivo">amore</p>
  <svg class="cuore" viewBox="0 0 62 56"><path d="M31 56 C 10 40 0 28 0 16 C 0 7 7 0 16 0 C 23 0 28 4 31 10 C 34 4 39 0 46 0 C 55 0 62 7 62 16 C 62 28 52 40 31 56 Z" fill="var(--accento)"/></svg>

  <!-- disegno a filo: il pane con la scia, sotto la parola a mano -->
  <svg class="pane" viewBox="0 0 300 120" fill="none" stroke="var(--principale)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 92 C 30 70 60 104 88 90"/>
    <path d="M88 90 C 76 52 112 26 152 26 C 196 26 230 52 222 88 C 186 102 120 102 88 90 Z"/>
    <path d="M118 44 C 128 58 126 72 114 84"/>
    <path d="M150 34 C 160 50 158 68 148 86"/>
    <path d="M184 40 C 194 56 192 72 182 86"/>
    <path d="M222 88 C 246 72 262 102 292 80"/>
  </svg>

  <!-- firma: nome dell'attività e sito -->
  <p class="firma"><span class="logo">Pasticceria Gemma</span>www.pasticceriagemma.it</p>
</body>
</html>
