<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #85564D; --secondario: #B6A18E; --accento: #9C6B5F; --sfondo: #E8E0D8; }
  :root { --font-titoli: 'Libre Baskerville', serif; --font-testo: 'Libre Baskerville', serif; }
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; }
  .arco { position: absolute; left: 64px; top: 300px; width: 720px; height: 1100px; border-radius: 360px 360px 0 0; background: color-mix(in srgb, var(--chiaro) 86%, transparent); }
  .titolo { position: absolute; left: 64px; top: 560px; width: 720px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 56px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; }
  .voci { position: absolute; left: 124px; top: 700px; width: 600px; list-style: none; font-size: 25px; letter-spacing: 0.12em; text-transform: uppercase; }
  .voci li { display: flex; justify-content: space-between; line-height: 1.95; }
  .voci li span:last-child { width: 130px; text-align: left; }
  .piede { position: absolute; left: 64px; top: 1262px; width: 720px; text-align: center; font-size: 24px; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <!-- foto: il banco con i prodotti, a tutto fondo -->
  <img class="foto" src="../esempio/banco.jpg" alt="">
  <div class="arco"></div>

  <!-- titolo: 2-3 parole in maiuscolo -->
  <h1 class="titolo">Il nostro menu</h1>

  <!-- voci: 5-7 prodotti, nome di 1-3 parole e prezzo -->
  <ul class="voci">
    <li><span>Biscotti al cacao</span><span>1,50</span></li>
    <li><span>Cornetto</span><span>1,30</span></li>
    <li><span>Muffin</span><span>2,50</span></li>
    <li><span>Torta (fetta)</span><span>3,50</span></li>
    <li><span>Torta intera</span><span>28,00</span></li>
    <li><span>Crostata di mele</span><span>14,00</span></li>
  </ul>

  <!-- piede: profilo e telefono separati da una barretta -->
  <p class="piede">@pasticceriagemma | 051 234 5678</p>
</body>
</html>
