<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Allison&display=swap" rel="stylesheet">
<style>
  :root { --principale: #85564D; --secondario: #B6A18E; --accento: #9C6B5F; --sfondo: #E8E0D8; }
  :root { --font-titoli: 'Libre Baskerville', serif; --font-testo: 'Libre Baskerville', serif; }
  :root { --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); --firma: 'Allison', cursive; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .fondo { position: absolute; left: -40px; top: -40px; width: 1160px; height: 1430px; object-fit: cover; filter: blur(14px); }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--sfondo) 78%, transparent); }
  .macchia { position: absolute; left: 380px; top: 740px; width: 980px; height: 980px; border-radius: 50%; background: var(--secondario); }

  .titolo { position: absolute; left: 290px; top: 130px; font-family: var(--font-titoli); font-weight: 700; font-size: 124px; line-height: 0.92; letter-spacing: 0.01em; text-transform: uppercase; }
  .corsivo { position: absolute; left: 550px; top: 330px; font-family: var(--firma); font-size: 300px; line-height: 1; color: var(--principale); transform: rotate(-6deg); }

  .filo { position: absolute; left: 990px; top: 0; width: 2px; height: 410px; background: var(--principale); opacity: 0.6; }
  .ciondolo { position: absolute; left: 925px; top: 400px; width: 132px; height: 132px; border-radius: 50%; background: var(--secondario); }
  .ciondolo svg { position: absolute; left: 22px; top: 40px; width: 88px; height: 36px; }

  .polaroid { position: absolute; background: #FFFFFF; padding: 14px 14px 30px; box-shadow: 0 6px 18px rgba(60, 40, 30, 0.18); }
  .polaroid img { display: block; object-fit: cover; }
  .polaroid.sx { left: 92px; top: 560px; transform: rotate(-1deg); }
  .polaroid.sx img { width: 430px; height: 450px; }
  .polaroid.dx { left: 575px; top: 640px; transform: rotate(7deg); }
  .polaroid.dx img { width: 410px; height: 480px; }

  .firma { position: absolute; left: 540px; top: 1200px; width: 440px; text-align: center; font-size: 24px; line-height: 1.5; letter-spacing: 0.14em; color: var(--principale); }
  .firma .logo { display: block; text-transform: uppercase; }
</style>
</head>
<body>
  <img class="fondo" src="../esempio/cornetti-grigio.jpg" alt="">
  <div class="velo"></div>
  <div class="macchia"></div>

  <!-- titolo: la cifra dello sconto e una parola, due righe in maiuscolo nero -->
  <h1 class="titolo">30%<br>solo</h1>
  <!-- parola a mano: una parola con il punto esclamativo, al massimo 6 lettere -->
  <p class="corsivo">oggi!</p>

  <!-- ciondolo: il cerchio appeso a un filo, con il disegno del pane -->
  <div class="filo"></div>
  <div class="ciondolo">
    <svg viewBox="0 0 300 120" fill="none" stroke="var(--principale)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 92 C 30 70 60 104 88 90"/>
      <path d="M88 90 C 76 52 112 26 152 26 C 196 26 230 52 222 88 C 186 102 120 102 88 90 Z"/>
      <path d="M118 44 C 128 58 126 72 114 84"/>
      <path d="M150 34 C 160 50 158 68 148 86"/>
      <path d="M184 40 C 194 56 192 72 182 86"/>
      <path d="M222 88 C 246 72 262 102 292 80"/>
    </svg>
  </div>

  <!-- foto: due prodotti in sconto, in due polaroid; la seconda inclinata sopra la macchia -->
  <div class="polaroid sx"><img src="../esempio/cornetti-grigio.jpg" alt=""></div>
  <div class="polaroid dx"><img src="../esempio/sfogliatine-pesca.jpg" alt=""></div>

  <!-- firma: nome dell'attività e sito, nella macchia -->
  <p class="firma"><span class="logo">Pasticceria Gemma</span>www.pasticceriagemma.it</p>
</body>
</html>
