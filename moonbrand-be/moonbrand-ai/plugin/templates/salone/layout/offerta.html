<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --principale: #0F5F5C; --secondario: #E7B7A8; --accento: #F4B63F; --sfondo: #F7E7E1; }
html { --margine: 72px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; }
body { position: relative; overflow: hidden; background: var(--principale); font-family: 'Archivo', sans-serif; color: var(--sfondo); }

/* Tutto in campitura piena; la foto sta in alto a destra, al vivo su due lati, e la campitura le gira intorno a L. */
.foto { position: absolute; left: 470px; top: 0; width: 610px; height: 800px; object-fit: cover; object-position: 55% 60%; }

.titolo {
  position: absolute; left: var(--margine); top: 92px; width: 360px;
  font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 128px; line-height: 0.86;
  text-transform: uppercase; color: var(--sfondo);
}
.cosa { position: absolute; left: var(--margine); top: 360px; width: 340px; font-size: 32px; line-height: 1.35; color: var(--sfondo); }
.prezzo {
  position: absolute; left: 60px; top: 830px;
  font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 320px; line-height: 0.82; color: var(--accento); white-space: nowrap;
}
.condizione { position: absolute; left: 610px; top: 872px; width: 398px; font-size: 34px; line-height: 1.35; font-weight: 500; color: var(--sfondo); }
.logo {
  position: absolute; left: var(--margine); bottom: 72px;
  font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 46px; line-height: 1; color: var(--sfondo);
}
.dove { position: absolute; left: 610px; bottom: 78px; font-size: 28px; font-weight: 500; color: var(--sfondo); }
</style>
</head>
<body>
  <!-- foto: il servizio in offerta, ripreso al lavoro (ciotola del colore, phon, lavatesta) -->
  <img class="foto" src="../esempio/colore.jpg" alt="">
  <!-- titolo: il servizio o la novità, 2-4 parole, 2-3 righe -->
  <h1 class="titolo">Colore e piega</h1>
  <!-- cosa: cosa comprende, 1-2 frasi brevi -->
  <p class="cosa">Tinta senza ammoniaca, lavaggio e piega. Il taglio, se lo vuoi, sono 15 € in più.</p>
  <!-- prezzo: il numero, corto (cifra e simbolo); solo qui va l'accento -->
  <div class="prezzo">55&#8239;€</div>
  <!-- condizione: date, giorni, come si prenota; concreta, 2-3 righe -->
  <p class="condizione">Dal 14 al 31 ottobre, dal martedì al giovedì. Si prenota al 02 3956 1180.</p>
  <!-- logo: il nome del salone -->
  <div class="logo">Da Nives</div>
  <!-- dove: via o quartiere -->
  <div class="dove">via Padova 112, Milano</div>
</body>
</html>
