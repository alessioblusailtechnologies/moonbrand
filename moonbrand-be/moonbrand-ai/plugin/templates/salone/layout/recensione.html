<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --principale: #0F5F5C; --secondario: #E7B7A8; --accento: #F4B63F; --sfondo: #F7E7E1; }
html { --margine: 72px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; }
body { position: relative; overflow: hidden; background: var(--sfondo); font-family: 'Archivo', sans-serif; color: var(--principale); }

/* La foto della cliente a sinistra, alta quanto il post; il nome sta in un blocco pieno che parte dalla foto e
   entra nella colonna del testo. */
.foto { position: absolute; left: 0; top: 0; width: 470px; height: 1350px; object-fit: cover; object-position: 12% 50%; }
.nome {
  position: absolute; left: 0; bottom: 0; width: 700px; height: 210px; padding: 44px 0 0 var(--margine);
  background: var(--principale); color: var(--sfondo);
}
.nome strong { display: block; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 76px; line-height: 0.9; text-transform: uppercase; }
.nome span { display: block; margin-top: 12px; font-size: 28px; font-weight: 500; }

.frase {
  position: absolute; left: 534px; top: 92px; width: 476px;
  font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 96px; line-height: 0.9;
  text-transform: uppercase; color: var(--principale);
}
.testo { position: absolute; left: 534px; top: 730px; width: 474px; font-size: 32px; line-height: 1.38; color: var(--principale); }
.logo {
  position: absolute; right: var(--margine); bottom: 76px;
  font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 46px; line-height: 1; color: var(--principale);
}
</style>
</head>
<body>
  <!-- foto: la cliente, meglio se allo specchio del salone o appena finita -->
  <img class="foto" src="../esempio/cliente.jpg" alt="">
  <!-- frase: le parole della cliente che colpiscono di più, 8-14 parole, testuali -->
  <h1 class="frase">«Mi fermano per strada a chiedermi chi mi ha fatto i capelli»</h1>
  <!-- testo: il resto della recensione o il contesto, 1-3 frasi, al massimo 35 parole -->
  <p class="testo">Ero entrata per spuntare le punte. Nives mi ha guardata e ha detto: proviamo corto, al massimo ricresce. Sono tre anni che non lo faccio ricrescere.</p>
  <!-- nome: nome della cliente e da quanto viene, solo con il suo permesso -->
  <div class="nome"><strong>Graziella</strong><span>viene da noi dal 2009</span></div>
  <!-- logo: il nome del salone -->
  <div class="logo">Da Nives</div>
</body>
</html>
