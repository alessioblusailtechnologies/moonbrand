<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #D7452C; --secondario: #2B2826; --accento: #D7452C; --sfondo: #F3EADB; }
  :root { --font-titoli: 'Old Standard TT', serif; --font-testo: 'Montserrat', sans-serif; }
  :root {
    --su-accento: oklch(from var(--accento) clamp(0, (0.66 - l) * 1000, 1) 0 0);
    --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 80%; display: block; }
  /* la lettera gigante chiara dietro il riquadro, tagliata a sinistra */
  .lettera { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
  .lettera .pieno { fill: var(--chiaro); }
  .titolo { position: absolute; left: 40px; right: 40px; top: 62px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 104px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; }
  .titolo span { display: block; white-space: nowrap; }
  .riquadro { position: absolute; left: 298px; top: 230px; width: 484px; height: 920px; background: var(--chiaro); }
  .riquadro::after { content: ''; position: absolute; left: 92px; top: 870px; width: 300px; height: 150px; border-radius: 0 0 150px 150px; background: var(--chiaro); }
  .riquadro img { position: absolute; left: 18px; top: 18px; width: 448px; height: 600px; object-fit: cover; object-position: 40% 72%; display: block; }
  .invito { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-size: 34px; font-weight: 700; text-transform: uppercase; }
  .bottone { position: absolute; left: 54px; right: 54px; top: 736px; height: 74px; border-radius: 14px; background: var(--accento); color: var(--su-accento); text-align: center; font-size: 25px; font-weight: 600; line-height: 74px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
</style>
</head>
<body>
  <img class="foto" src="../esempio/sfoglia-crema.jpg" alt="">

  <!-- lettera: la «C» gigante disegnata, chiara, dietro il riquadro e tagliata a sinistra -->
  <svg class="lettera" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs><mask id="vuoto"><rect width="1080" height="1350" fill="#fff"/><ellipse cx="520" cy="640" rx="440" ry="545" fill="#000"/><path d="M560 640 L1100 80 L1100 1200 Z" fill="#000"/></mask></defs>
    <circle class="pieno" cx="470" cy="640" r="600" mask="url(#vuoto)"/>
    <path class="pieno" d="M890 196 l0 150 l-26 0 l0 -150 Z M890 1084 l0 -150 l-26 0 l0 150 Z"/>
  </svg>
  <!-- titolo: 3-4 parole su una riga, maiuscolo -->
  <h1 class="titolo" data-max="1000"><span>Chiedilo al forno</span></h1>

  <div class="riquadro">
    <img src="../esempio/sfoglia-crema.jpg" alt="">
    <!-- invito: 2-3 parole -->
    <p class="invito">Rispondiamo a tutto!</p>
    <!-- bottone: 3-4 parole -->
    <div class="bottone">Scrivi nei commenti</div>
  </div>
  <script>
    // Con font del brand più larghi il titolo si rimpicciolisce finché ogni riga sta nella sua misura (data-max, px).
    const adatta = () => {
      for (const el of document.querySelectorAll('[data-max]')) {
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        const misura = () => Math.max(0, ...[...el.children].map((c) => {
          const r = document.createRange();
          r.selectNodeContents(c);
          return r.getBoundingClientRect().width;
        }));
        while (misura() > Number(el.dataset.max) && size > 40) { size -= 2; el.style.fontSize = `${size}px`; }
      }
    };
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
