<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --principale: #D7452C; --secondario: #2B2826; --accento: #D7452C; --sfondo: #F3EADB; }
  :root { --font-titoli: 'Old Standard TT', serif; --font-testo: 'Montserrat', sans-serif; }
  :root {
    --su-accento: oklch(from var(--accento) clamp(0, (0.66 - l) * 1000, 1) 0 0);
    --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--chiaro); font-family: var(--font-testo); }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 50% 40%; display: block; }
  .logo { position: absolute; left: 0; right: 0; top: 44px; text-align: center; color: var(--secondario); font-size: 24px; font-weight: 500; text-transform: uppercase; }
  /* la riga piccola sopra il titolo, appena curva */
  .sopra { position: absolute; left: 290px; top: 270px; width: 500px; height: 110px; overflow: visible; }
  .sopra text { fill: var(--chiaro); font-family: var(--font-titoli); font-size: 40px; text-transform: uppercase; }
  .titolo { position: absolute; left: 40px; right: 40px; top: 368px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 164px; line-height: 0.9em; text-transform: uppercase; }
  .titolo span { display: block; white-space: nowrap; }
  .nome { position: absolute; left: 86px; top: 900px; width: 300px; font-size: 32px; font-weight: 700; line-height: 1.05; text-transform: uppercase; }
  .filetto { position: absolute; left: 86px; top: 990px; width: 330px; height: 2px; background: var(--chiaro); opacity: 0.7; }
  .testo { position: absolute; left: 86px; top: 1024px; width: 380px; font-size: 25px; font-weight: 300; line-height: 1.3; }
  .prezzo-voce { position: absolute; left: 86px; top: 1150px; font-size: 25px; font-weight: 400; }
  .prezzo { position: absolute; left: 374px; top: 1140px; font-size: 32px; font-weight: 700; }
  .fascia { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--accento); color: var(--su-accento); text-align: center; font-size: 26px; font-weight: 400; line-height: 74px; white-space: nowrap; }
  .fascia b { font-weight: 700; }
</style>
</head>
<body>
  <img class="foto" src="../esempio/torta-strati.jpg" alt="">

  <!-- logo: il nome del brand piccolo in alto, senza fondo -->
  <div class="logo">Forno Corallo</div>

  <!-- sopra: 3-5 parole che introducono il titolo, su una riga curva -->
  <svg class="sopra" viewBox="0 0 500 110"><path id="arco" d="M20 100 Q250 20 480 100" fill="none"/><text text-anchor="middle"><textPath href="#arco" startOffset="50%">Una fetta che sa di</textPath></text></svg>

  <!-- titolo: 2 righe di 5-8 lettere, sul prodotto -->
  <h1 class="titolo" data-max="1000"><span>Burro &amp;</span><span>vaniglia</span></h1>

  <!-- nome: il prodotto in 2 righe -->
  <p class="nome">Torta<br>a strati</p>
  <div class="filetto"></div>
  <!-- testo: 12-18 parole sul prodotto -->
  <p class="testo">Pan di Spagna, crema al burro e frutti rossi, montata a mano ogni mattina.</p>
  <!-- prezzo: la voce e il prezzo -->
  <p class="prezzo-voce">Prezzo a fetta</p>
  <p class="prezzo">4,50 €</p>

  <!-- fascia: dove trovarvi, una riga -->
  <div class="fascia"><b>Ci trovi in</b> Via dei Mille 18, Bari</div>
  <script>
    // Con font del brand più larghi il titolo si rimpicciolisce finché ogni riga sta nella sua misura (data-max, px).
    const adatta = () => {
      for (const el of document.querySelectorAll('[data-max]')) {
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        const misura = () => Math.max(0, ...[...el.children].map((c) => {
          const r = document.createRange();
          r.selectNodeContents(c);
          return r.getBoundingClientRect().width;
        }));
        while (misura() > Number(el.dataset.max) && size > 40) { size -= 2; el.style.fontSize = `${size}px`; }
      }
    };
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
