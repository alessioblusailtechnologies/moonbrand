<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --principale: #D7452C; --secondario: #2B2826; --accento: #D7452C; --sfondo: #F3EADB; }
  :root { --font-titoli: 'Old Standard TT', serif; --font-testo: 'Montserrat', sans-serif; }
  :root {
    --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); color: var(--chiaro); font-family: var(--font-testo); }

  .logo { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); padding: 10px 28px; border: 2.5px solid var(--chiaro); border-radius: 16px; font-size: 25px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  /* il titolo enorme su due righe, a tutta larghezza */
  .titolo { position: absolute; left: 20px; right: 20px; top: 300px; text-align: center; font-family: var(--font-titoli); font-weight: 400; font-size: 232px; line-height: 0.86em; text-transform: uppercase; }
  .titolo span { display: block; white-space: nowrap; }
  .foto { position: absolute; top: 760px; width: 342px; height: 590px; object-fit: cover; display: block; }
</style>
</head>
<body>
  <!-- logo: il nome del brand nella cornice in alto -->
  <div class="logo">Forno Corallo</div>

  <!-- titolo: 2 parole di 5-7 lettere, maiuscolo -->
  <h1 class="titolo" data-max="1000"><span>Dolce</span><span>ottobre</span></h1>

  <!-- foto: tre, i dolci del momento -->
  <img class="foto" style="left: 0;" src="../esempio/ciambella-festa.jpg" alt="">
  <img class="foto" style="left: 369px; object-position: 50% 60%;" src="../esempio/crostata-lamponi.jpg" alt="">
  <img class="foto" style="left: 738px;" src="../esempio/girella-piatto.jpg" alt="">
  <script>
    // Con font del brand più larghi il titolo si rimpicciolisce finché ogni riga sta nella sua misura (data-max, px).
    const adatta = () => {
      for (const el of document.querySelectorAll('[data-max]')) {
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        const misura = () => Math.max(0, ...[...el.children].map((c) => {
          const r = document.createRange();
          r.selectNodeContents(c);
          return r.getBoundingClientRect().width;
        }));
        while (misura() > Number(el.dataset.max) && size > 40) { size -= 2; el.style.fontSize = `${size}px`; }
      }
    };
    adatta();
    document.fonts.ready.then(adatta);
  </script>
</body>
</html>
