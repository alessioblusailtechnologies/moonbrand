<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Arimo:ital,wght@0,400;0,700;1,700&family=Ballet:opsz@16..72&family=Libre+Caslon+Text:ital@0;1&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<style>
  :root { --principale: #383330; --secondario: #FDF6EC; --accento: #FFA1DD; --sfondo: #F5F4F2; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Arimo', sans-serif; }
  /* il testo sui fondi del brand: bianco se il fondo è scuro, quasi nero se è chiaro; il chiaro sulle foto */
  :root { --su-secondario: oklch(from var(--secondario) clamp(0.25, (0.66 - l) * 1000, 1) 0 0);
          --su-accento: oklch(from var(--accento) clamp(0.25, (0.66 - l) * 1000, 1) 0 0);
          --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }
  .titolo { font-family: var(--font-titoli); font-weight: 900; font-stretch: 112%; letter-spacing: -0.035em; line-height: 0.92; }
  .titolo span { display: block; }
  .fondo { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; }
  .profilo { position: absolute; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-transform: uppercase; }
  .etichetta { position: absolute; font-size: 20px; letter-spacing: -0.02em; text-transform: uppercase; }
  body { background: #000; color: var(--chiaro); }
  .fondo { object-position: 50% 50%; filter: brightness(0.78) saturate(1.05); }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--principale) 22%, transparent); }
  .profilo { left: 395px; top: 104px; width: 290px; height: 58px; border: 3px solid var(--secondario); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--chiaro); font-size: 19px; }
  .titolo { position: absolute; left: 0; width: 1080px; top: 510px; text-align: center; font-size: 150px; text-transform: lowercase; letter-spacing: -0.03em; }
  .firma { position: absolute; left: 0; width: 1080px; top: 668px; text-align: center; font-family: 'Ballet', cursive; font-size: 230px; line-height: 1; transform: rotate(-4deg); }
  .invito { position: absolute; left: 0; width: 1080px; top: 948px; display: flex; justify-content: center; align-items: center; gap: 14px; font-family: 'Libre Caslon Text', serif; font-size: 38px; text-transform: uppercase; letter-spacing: -0.01em; }
  .invito::after { content: ''; width: 26px; height: 2px; background: currentColor; }
</style>
</head>
<body>
  <!-- fondo: tanti prodotti dall'alto, a tutto campo (croissant, girelle, pane in fila) -->
  <img class="fondo" src="../esempio/croissant-marmo.jpg" alt="">
  <div class="velo"></div>

  <!-- profilo: il nome del profilo social del brand, nella cornice arrotondata -->
  <p class="profilo">@fornomaddalena</p>

  <!-- titolo: 1-2 parole in minuscolo, la prima metà della frase -->
  <h1 class="titolo"><span>siamo</span></h1>
  <!-- firma: 1 parola scritta a mano, la seconda metà della frase -->
  <p class="firma">Aperti</p>

  <!-- invito: 2-4 parole in maiuscolo, cosa si trova nella slide dopo -->
  <p class="invito">Orari di apertura</p>
</body>
</html>
