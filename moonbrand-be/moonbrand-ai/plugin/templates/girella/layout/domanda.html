<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Arimo:ital,wght@0,400;0,700;1,700&family=Ballet:opsz@16..72&family=Libre+Caslon+Text:ital@0;1&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<style>
  :root { --principale: #383330; --secondario: #FDF6EC; --accento: #FFA1DD; --sfondo: #F5F4F2; }
  :root { --font-titoli: 'Archivo', sans-serif; --font-testo: 'Arimo', sans-serif; }
  /* il testo sui fondi del brand: bianco se il fondo è scuro, quasi nero se è chiaro; il chiaro sulle foto */
  :root { --su-secondario: oklch(from var(--secondario) clamp(0.25, (0.66 - l) * 1000, 1) 0 0);
          --su-accento: oklch(from var(--accento) clamp(0.25, (0.66 - l) * 1000, 1) 0 0);
          --chiaro: oklch(from var(--sfondo) max(l, 0.93) min(c, 0.06) h); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--sfondo); color: var(--principale); font-family: var(--font-testo); }
  .titolo { font-family: var(--font-titoli); font-weight: 900; font-stretch: 112%; letter-spacing: -0.035em; line-height: 0.92; }
  .titolo span { display: block; }
  .fondo { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; display: block; }
  .profilo { position: absolute; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-transform: uppercase; }
  .etichetta { position: absolute; font-size: 20px; letter-spacing: -0.02em; text-transform: uppercase; }
  body { background: #000; }
  .fondo { object-position: 50% 50%; filter: brightness(0.9); }
  .profilo { left: 0; width: 1080px; top: 112px; text-align: center; color: var(--chiaro); }
  .fumetto { position: absolute; padding: 30px 34px; border-radius: 22px; font-size: 25px; line-height: 1.55; letter-spacing: -0.01em; }
  .fumetto::after { content: ''; position: absolute; bottom: -14px; border: 16px solid transparent; border-bottom: 0; }
  .domanda { left: 135px; top: 572px; width: 500px; background: var(--chiaro); color: #2b2724; }
  .domanda::after { left: 0; border-left: 0; border-top-color: var(--chiaro); }
  .risposta { left: 475px; top: 792px; width: 495px; background: var(--accento); color: var(--su-accento); text-align: right; }
  .risposta::after { right: 0; border-right: 0; border-top-color: var(--accento); }
</style>
</head>
<body>
  <!-- fondo: un prodotto ripetuto a tutto campo, da vicino (girelle, pagnotte, biscotti) -->
  <img class="fondo" src="../esempio/girelle.jpg" alt="">

  <!-- profilo: il profilo social del brand -->
  <p class="profilo">@fornomaddalena</p>

  <!-- domanda: il messaggio di un cliente, 10-16 parole su due righe -->
  <p class="fumetto domanda">Mi serve un dolce per domenica. Cosa conviene prenotare prima?</p>

  <!-- risposta: la risposta del forno con l'invito, 12-18 parole -->
  <p class="fumetto risposta">La crostata, finisce sempre per prima. Scrivi «MENU» e ti mandiamo la lista.</p>
</body>
</html>
