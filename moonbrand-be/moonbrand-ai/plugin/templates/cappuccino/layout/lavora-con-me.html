<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --principale: #2B2620; --secondario: #FFF3D0; --accento: #D4BF80; --sfondo: #FFFFFF; }
  :root { --font-titoli: 'Hanken Grotesk', sans-serif; --font-testo: 'IBM Plex Mono', monospace; }
  :root { --su-secondario: oklch(from var(--secondario) calc(clamp(0, (0.62 - l) * 1000, 1)) 0 0); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: var(--principale); font-family: var(--font-testo); color: #FFFFFF; }

  .foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 66% 50%; display: block; }
  .velo { position: absolute; inset: 0; background: rgba(0,0,0,0.16); }

  /* il nome tra parentesi quadre, su un ritaglio di carta un po' storto */
  .nome { position: absolute; left: 196px; top: 470px; background: var(--secondario); color: var(--su-secondario); font-family: var(--font-titoli); font-weight: 300;
    font-size: 40px; letter-spacing: -0.03em; line-height: 1; padding: 10px 14px 12px; transform: rotate(-5deg); white-space: nowrap; }

  .titolo { position: absolute; left: 0; top: 520px; width: 1080px; text-align: center; font-family: var(--font-titoli); font-weight: 700;
    font-size: 196px; line-height: 0.8; letter-spacing: -0.075em; }
  .titolo span { display: block; white-space: nowrap; }
  
  /* il biglietto: carta nel secondario con il nastro adesivo nell'accento */
  .biglietto { position: absolute; left: 380px; top: 880px; width: 400px; min-height: 250px; background: var(--secondario); color: var(--su-secondario); padding: 58px 30px 40px; }
  .nastro { position: absolute; left: 470px; top: 836px; width: 270px; height: 66px; background: color-mix(in srgb, var(--accento) 70%, transparent); }
  .biglietto p { font-size: 24px; line-height: 1.38; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <!-- foto: ritratto della persona o del team, deciso (al telefono, in movimento); il viso nella metà alta -->
  <img class="foto" src="../esempio/chiamata.jpg" alt="">
  <div class="velo"></div>

  <!-- nome: chi parla, tra parentesi quadre, 2-3 parole -->
  <p class="nome">[ Sono Giulia ]</p>
  <h1 class="titolo">
    <!-- titolo: l'invito su due righe, 1-2 parole per riga, al massimo 9 lettere per riga -->
    <span>Lavora</span>
    <span>con me</span>
  </h1>
  <div class="biglietto">
    <!-- biglietto: cosa offri, 14-20 parole -->
    <p>Strategia social per piccole attività: un piano chiaro, contenuti coerenti e clienti che tornano.</p>
  </div>
  <div class="nastro"></div>
</body>
</html>
