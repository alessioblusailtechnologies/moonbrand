<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root { --principale: #4A1520; --secondario: #E8A3B0; --accento: #F2B300; --sfondo: #E6E3DC; }
:root { --margine: 64px; --taglio: 730px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--principale);
  color: var(--sfondo);
  font-family: 'Archivo', sans-serif;
  position: relative;
  overflow: hidden;
}
.foto {
  position: absolute; top: 0; left: 0; width: 1080px; height: var(--taglio);
  object-fit: cover; object-position: 60% 45%;
}
.filetto {
  position: absolute; top: var(--taglio); left: 0; right: 0; height: 16px; background: var(--accento);
}
.cliente {
  position: absolute; left: var(--margine); top: calc(var(--taglio) + 58px);
  font-size: 32px; line-height: 1.3; font-stretch: 100%;
}
.cliente b { display: block; font-weight: 800; }
.cliente span { display: block; font-weight: 400; color: color-mix(in srgb, var(--sfondo) 72%, var(--principale)); }
.logo {
  position: absolute; right: var(--margine); top: calc(var(--taglio) + 58px);
  font-size: 30px; font-weight: 800; font-stretch: 110%; letter-spacing: -0.01em;
}
.risultato {
  position: absolute; left: calc(var(--margine) - 10px); bottom: 30px;
  font-size: 330px; line-height: 1; font-weight: 900; font-stretch: 62%;
  letter-spacing: -0.03em;
}
.cosa {
  position: absolute; left: 720px; right: var(--margine); bottom: 84px;
  font-size: 38px; line-height: 1.12; font-weight: 700; font-stretch: 88%;
}
</style>
</head>
<body>
  <!-- foto: il lavoro o il posto del cliente, vera; il soggetto nella metà alta -->
  <img class="foto" src="../esempio/caso.jpg" alt="">
  <div class="filetto"></div>
  <p class="cliente">
    <!-- cliente: nome e città -->
    <b>Panificio Gallo, Torino</b>
    <!-- lavoro: cosa avete fatto e da quando, 3-6 parole -->
    <span>Instagram e WhatsApp, da marzo</span>
  </p>
  <!-- logo: il nome del brand (diventa il file del logo se c'è) -->
  <span class="logo">Calce</span>
  <!-- risultato: il numero misurato, corto (+41%, 2x, 380) -->
  <div class="risultato">+41%</div>
  <!-- cosa misura: 8-14 parole, con il periodo -->
  <p class="cosa">di pane prenotato su WhatsApp in quattro mesi, con lo stesso forno e le stesse ore.</p>
</body>
</html>
