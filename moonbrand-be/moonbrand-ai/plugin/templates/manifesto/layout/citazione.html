<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root { --principale: #4A1520; --secondario: #E8A3B0; --accento: #F2B300; --sfondo: #E6E3DC; }
:root { --margine: 64px; --campo: color-mix(in srgb, var(--secondario) 45%, var(--sfondo)); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--campo);
  color: var(--principale);
  font-family: 'Archivo', sans-serif;
  position: relative;
  overflow: hidden;
}
.logo {
  position: absolute; top: var(--margine); right: var(--margine);
  font-size: 30px; font-weight: 800; font-stretch: 110%; letter-spacing: -0.01em;
}
blockquote {
  position: absolute; left: calc(var(--margine) - 6px); right: var(--margine); top: 140px;
  font-size: 178px; line-height: 0.86; font-weight: 900; font-stretch: 62%;
  letter-spacing: -0.012em;
}
.chi {
  position: absolute; left: 392px; right: var(--margine); bottom: var(--margine);
  padding-top: 22px; border-top: 4px solid var(--principale);
  font-size: 32px; line-height: 1.3; font-stretch: 100%;
}
.nome { display: block; font-weight: 800; }
.ruolo { display: block; font-weight: 400; }
</style>
</head>
<body>
  <!-- logo: il nome del brand (diventa il file del logo se c'è) -->
  <span class="logo">Calce</span>
  <!-- citazione: le parole vere della persona, 8-16 parole, tra « »; i <br> li decide chi impagina -->
  <blockquote>«Ci hanno<br>detto di<br>pubblicare<br>la metà. Le<br>prenotazioni<br>sono salite.»</blockquote>
  <p class="chi">
    <!-- nome: nome e cognome di chi parla -->
    <span class="nome">Giulia Ferraris</span>
    <!-- ruolo: chi è e dove, una riga -->
    <span class="ruolo">titolare, Osteria del Ponte, Asti</span>
  </p>
</body>
</html>
