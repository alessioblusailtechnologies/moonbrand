<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root { --principale: #4A1520; --secondario: #E8A3B0; --accento: #F2B300; --sfondo: #E6E3DC; }
:root { --margine: 64px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--accento);
  color: var(--principale);
  font-family: 'Archivo', sans-serif;
  position: relative;
  overflow: hidden;
}
.logo {
  position: absolute; top: var(--margine); left: var(--margine);
  font-size: 30px; font-weight: 800; font-stretch: 110%; letter-spacing: -0.01em;
}
.numero {
  position: absolute; left: calc(var(--margine) - 22px); top: 96px;
  font-size: 640px; line-height: 1; font-weight: 900; font-stretch: 62%;
  letter-spacing: -0.035em;
}
.cosa {
  position: absolute; left: var(--margine); right: 150px; top: 720px;
  font-size: 66px; line-height: 1.02; font-weight: 800; font-stretch: 85%;
  letter-spacing: -0.01em;
}
.fonte {
  position: absolute; left: var(--margine); right: var(--margine); bottom: var(--margine);
  padding-top: 22px; border-top: 4px solid var(--principale);
  font-size: 27px; line-height: 1.3; font-weight: 500; font-stretch: 100%;
}
</style>
</head>
<body>
  <!-- logo: il nome del brand (diventa il file del logo se c'è) -->
  <span class="logo">Calce</span>
  <!-- numero: il dato vero, corto (74%, 3 su 4, 1,2 mln); più è corto, più va grande -->
  <div class="numero">74%</div>
  <!-- cosa vuol dire: una frase, 12-22 parole, che dice cosa significa per chi legge -->
  <p class="cosa">dei messaggi che arrivano ai nostri clienti chiede orari o prezzi. Due cose che possono stare già in bio.</p>
  <!-- fonte: da dove viene il numero, con periodo o anno; sempre vera -->
  <p class="fonte">Fonte: 48 profili Instagram seguiti da Calce, gennaio-giugno 2026</p>
</body>
</html>
